<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a3171b">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* landscape on phones: slimmer top bar */
@media (orientation: landscape) and (max-height: 500px) {
  nav.parts { padding-block: .3rem !important; }
  nav.parts a { padding: .15rem .6rem !important; font-size: 14px !important; }
  .tools button { height: 1.7rem !important; }
}
</style>
<title>Napi szentmise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Alegreya+SC:wght@500;700&display=swap">
<style>
/* Layout: one reading column like a missal page, sticky part-nav, rubric red for labels */
:root {
  --bg: #fdfcfa; --fg: #1e1a1a; --muted: #6b6262; --rubric: #a3171b; --line: #e8e1df; --chip: #f4eeec;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-cap: "Alegreya SC", "Alegreya", Georgia, serif;
  --size: 19px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161314; --fg: #ece6e3; --muted: #a59c99; --rubric: #e8736f; --line: #2e2829; --chip: #241f20; color-scheme: dark; } }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { --bg: #161314; --fg: #ece6e3; --muted: #a59c99; --rubric: #e8736f; --line: #2e2829; --chip: #241f20; color-scheme: dark; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--size); line-height: 1.32; }
.wrap { max-width: 52rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 4rem; }
main.wrap > section:not(.bilingual), header.top, .legend { max-width: 36rem; margin-left: auto; margin-right: auto; }
header.top { text-align: center; padding-block: 2rem 1.25rem; }
.date { font-family: var(--f-cap); color: var(--rubric); letter-spacing: .06em; font-size: .9em; margin: 0; }
h1 { font-weight: 700; font-size: 1.5em; line-height: 1.2; margin: .4rem 0 .2rem; text-wrap: balance; }
.rank { font-style: italic; margin: 0; }
.meta { color: var(--muted); font-size: .85em; margin: .9rem 0 0; }
nav.parts { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; gap: .4rem; align-items: center; overflow-x: auto; scrollbar-width: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + .55rem); padding-bottom: .55rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-shadow: 0 4px 18px rgba(0,0,0,.12); transform: translateY(-110%); visibility: hidden;
  transition: transform .22s ease, visibility 0s linear .22s; }
nav.parts.open { transform: none; visibility: visible; transition: transform .22s ease; }
.menu-fab { position: fixed; z-index: 21; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--rubric);
  font-size: 18px; line-height: 1; cursor: pointer; opacity: .55; box-shadow: 0 1px 6px rgba(0,0,0,.15); transition: opacity .2s; }
.menu-fab:hover, .menu-fab:focus-visible, .menu-fab[aria-expanded="true"] { opacity: 1; }
@media (prefers-reduced-motion: reduce) { nav.parts, nav.parts.open { transition: none; } }
nav.parts::-webkit-scrollbar { display: none; }
nav.parts a { flex: none; font-family: var(--f-cap); font-size: 15px; letter-spacing: .03em; color: var(--fg); text-decoration: none;
  background: var(--chip); border-radius: 999px; padding: .3rem .75rem; }
nav.parts a:focus-visible, button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.tools { display: flex; gap: .3rem; flex: none; padding-right: .5rem; margin-right: .1rem; border-right: 1px solid var(--line); }
.tools button { font: 600 15px var(--f-body); color: var(--rubric); background: none; border: 1px solid var(--line); border-radius: 8px; width: 2.2rem; height: 2rem; cursor: pointer; }
section { padding-top: .5rem; }
h2.part { font-family: var(--f-cap); font-weight: 700; color: var(--rubric); text-align: center; font-size: 1.15em; letter-spacing: .05em;
  margin: 2.2rem 0 .4rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line); text-wrap: balance; }
h3 { font-family: var(--f-cap); font-weight: 500; color: var(--rubric); font-size: .9em; letter-spacing: .07em; margin: 1.6rem 0 .35rem; text-wrap: balance; }
p { margin: .65rem 0; }
.resp { font-weight: 700; }
.verse { padding-left: .9rem; }
.rub, .sub { font-style: italic; color: var(--rubric); }
.cite { text-align: right; font-style: italic; color: var(--muted); font-size: .8em; margin-top: .1rem; }
.cons { font-weight: 700; padding-left: .9rem; border-left: 2px solid var(--rubric); margin: .8rem 0; }
.choice { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; margin: .6rem 0 .4rem; }
.choice label { font-family: var(--f-cap); color: var(--muted); font-size: .72em; letter-spacing: .06em; }
.choice select { flex: 1 1 12rem; min-width: 0; font: inherit; font-size: .78em; color: var(--rubric); background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: .15rem 0; }
.choice select:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.jump { text-align: center; margin: 1rem 0; }
.jump { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
button.btn { background: none; cursor: pointer; }
.btn { display: inline-block; font-family: var(--f-cap); letter-spacing: .04em; font-size: .85em; color: var(--rubric); text-decoration: none; border: 1px solid var(--rubric); border-radius: 999px; padding: .4rem 1rem; }
.btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.bilingual { margin-top: 3rem; border-top: 2px solid var(--line); }
.bi-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 1rem; font-size: .9em; }
.bi-grid > * { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.bi-l { grid-column: 1; }
.bi-r { grid-column: 2; }
.bi-full { grid-column: 1 / -1; }
.bi-lab { font-family: var(--f-cap); color: var(--muted); font-size: .8em; letter-spacing: .08em; border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
.bi-grid h3 { margin-top: 1.4rem; }
.bi-grid .verse, .bi-grid .cons { padding-left: .5rem; }
.legend { color: var(--muted); font-size: .8em; text-align: center; margin-top: 3rem; }
</style>
<style>
/* Alternatives inside one slot (e.g. two communion antiphons): a row of buttons, first one selected */
.alt-btns { display: flex; flex-wrap: wrap; gap: .1rem .9rem; margin: .4rem 0 .1rem; }
.alt-btn { font: .72em var(--f-cap); letter-spacing: .06em; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: .1rem 0; cursor: pointer; }
.alt-btn[aria-pressed="true"] { color: var(--rubric); border-bottom-color: var(--rubric); }
.alt-btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.notice { max-width: 36rem; margin: 1rem auto 0; padding: .6rem .8rem; background: var(--chip); border-radius: 10px; font-size: .85em; color: var(--muted); text-align: center; }
.status { text-align: center; color: var(--muted); margin: 4rem 0; }
/* Date picker: only days that have a Mass text can be chosen */
#cal { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); padding: 1rem; width: min(22rem, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#cal::backdrop { background: rgba(0,0,0,.35); }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .6rem; }
.cal-head strong { font-family: var(--f-cap); color: var(--rubric); letter-spacing: .05em; font-weight: 700; }
.cal-head button, .cal-close { font: 600 16px var(--f-body); color: var(--rubric); background: none; border: 1px solid var(--line); border-radius: 8px; width: 2.2rem; height: 2rem; cursor: pointer; }
.cal-head button:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .25rem; text-align: center; }
.cal-grid .wd { font-family: var(--f-cap); font-size: 13px; color: var(--muted); padding-bottom: .2rem; }
.cal-grid button { font: 16px var(--f-body); aspect-ratio: 1; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--muted); opacity: .45; padding: 0; }
.cal-grid button.has { opacity: 1; color: var(--fg); background: var(--chip); cursor: pointer; font-weight: 700; }
.cal-grid button.today { border-color: var(--rubric); }
.cal-grid button.cur { background: var(--rubric); color: var(--bg); }
.cal-grid button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.cal-title { min-height: 2.6em; margin: .7rem 0 .4rem; font-size: .85em; text-align: center; color: var(--muted); }
.cal-foot { display: flex; justify-content: flex-end; }
.cal-close { width: auto; padding: 0 .9rem; font-family: var(--f-cap); font-size: 14px; }
</style>
<button class="menu-fab" id="menu-fab" type="button" aria-label="Menü megnyitása" aria-controls="parts-nav" aria-expanded="false">☰</button>
</head>
<body>
<nav class="parts" id="parts-nav" aria-label="A mise részei">
  <span class="tools"><button id="pick-date" type="button" aria-label="Másik nap választása" title="Másik nap">📅</button><button id="smaller" type="button" aria-label="Kisebb betű">A−</button><button id="bigger" type="button" aria-label="Nagyobb betű">A+</button><button id="theme-toggle" type="button" aria-label="Sötét mód">☾</button><button id="reload" type="button" aria-label="Frissítés" title="Frissítés">↻</button></span>
  <a href="#r1">Bevezetés</a><a href="#r2">Igeliturgia</a><a href="#r3">Eucharisztia</a><a href="#r4">Áldozás</a><a href="#r5">Befejezés</a><a href="#latin">Latin</a>
</nav>
<dialog id="cal" aria-labelledby="cal-month">
  <div class="cal-head"><button type="button" id="cal-prev" aria-label="Előző hónap">‹</button><strong id="cal-month"></strong><button type="button" id="cal-next" aria-label="Következő hónap">›</button></div>
  <div class="cal-grid" id="cal-grid"></div>
  <p class="cal-title" id="cal-title"></p>
  <div class="cal-foot"><button type="button" class="cal-close" id="cal-close">Bezárás</button></div>
</dialog>
<main class="wrap">
  <header class="top" id="top">
    <p class="date" id="m-date"></p>
    <h1 id="m-title">Napi szentmise</h1>
    <p class="rank" id="m-rank"></p>
    <p class="meta" id="m-meta"></p>
  </header>
  <p class="notice" id="notice" hidden></p>
  <p class="jump" id="jump-latin"><a class="btn" href="#latin">Latin–magyar szöveg ↓</a></p>
  <div id="mass"><p class="status">Betöltés…</p></div>
  <p class="legend">A félkövér szöveget a hívek mondják.</p>
</main>
<script>
(function () {
  var root = document.documentElement, KEY = 'mise-size';
  function $(id) { return document.getElementById(id); }
  function apply(px) { px = Math.max(15, Math.min(28, px)); root.style.setProperty('--size', px + 'px'); try { localStorage.setItem(KEY, px); } catch (e) {} return px; }
  var size = 19; try { var s = parseInt(localStorage.getItem(KEY), 10); if (s) size = s; } catch (e) {}
  size = apply(size);
  $('bigger').addEventListener('click', function () { size = apply(size + 1); });
  $('smaller').addEventListener('click', function () { size = apply(size - 1); });
  // Hidden top bar, opened by the floating button; closes after choosing a section or tapping the text
  var fab = $('menu-fab'), bar = $('parts-nav');
  function setMenu(open) { bar.classList.toggle('open', open); fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    fab.textContent = open ? '✕' : '☰'; fab.setAttribute('aria-label', open ? 'Menü bezárása' : 'Menü megnyitása'); }
  fab.addEventListener('click', function (e) { e.stopPropagation(); setMenu(!bar.classList.contains('open')); });
  bar.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setMenu(false); }); });
  document.addEventListener('click', function (e) { if (bar.classList.contains('open') && !bar.contains(e.target) && e.target !== fab && !cal.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
  // Refresh: drop the offline copy (installed app) and load the newest text
  $('reload').addEventListener('click', function () {
    var go = function () { location.reload(); };
    try { if (window.caches) { caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(go, go); return; } } catch (e) {}
    go();
  });
  // Dark / light mode toggle (remembered on this device)
  var THEME = 'mise-theme', tbtn = $('theme-toggle');
  function isDark() { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function label() { var d = isDark(); tbtn.textContent = d ? '☀' : '☾'; tbtn.setAttribute('aria-label', d ? 'Világos mód' : 'Sötét mód'); tbtn.title = d ? 'Világos mód' : 'Sötét mód'; }
  try { var st = localStorage.getItem(THEME); if (st === 'dark' || st === 'light') root.setAttribute('data-theme', st); } catch (e) {}
  label();
  tbtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME, next); } catch (e) {}
    label();
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', label); } catch (e) {}

  // ---------- Mass database: data/calendar.json lists the dates, data/masses/<date>.json holds each Mass ----------
  var MONTHS = ['január', 'február', 'március', 'április', 'május', 'június', 'július', 'augusztus', 'szeptember', 'október', 'november', 'december'];
  var dates = [], titles = {}, current = null;
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function short(s) { var p = s.split('-'); return MONTHS[+p[1] - 1] + ' ' + (+p[2]) + '.'; }
  var today = iso(new Date());
  function getJSON(url) { return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }

  function wire(box) {
    // Preface and Eucharistic prayer dropdowns: show only the selected variant
    box.querySelectorAll('select[data-sel]').forEach(function (sel) {
      // the same choice drives the Hungarian text and the Latin–Hungarian section
      var groups = box.querySelectorAll('.variants[data-group="' + sel.dataset.sel + '"]');
      function show() { groups.forEach(function (g) { g.querySelectorAll(':scope > .variant').forEach(function (v) { v.hidden = v.dataset.opt !== sel.value; }); }); }
      sel.addEventListener('change', show); show();
    });
    // EP IV may only be said with its own preface
    var ep = box.querySelector('#sel-ep'), pref = box.querySelector('#sel-pref');
    if (ep && pref) ep.addEventListener('change', function () { if (ep.value === '4' && pref.value !== 'ep4') { pref.value = 'ep4'; pref.dispatchEvent(new Event('change')); } });
    // Alternative texts: row of buttons, one panel visible
    box.querySelectorAll('.alts').forEach(function (alts) {
      var btns = alts.querySelectorAll('.alt-btn'), panels = alts.querySelectorAll(':scope > .alt');
      btns.forEach(function (b) { b.addEventListener('click', function () {
        btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        panels.forEach(function (p) { p.hidden = p.dataset.i !== b.dataset.i; });
      }); });
    });
  }

  function show(date, note) {
    current = date;
    return getJSON('data/masses/' + date + '.json').then(function (m) {
      $('m-date').textContent = m.dateLabel; $('m-title').textContent = m.title; $('m-rank').textContent = m.rank;
      var meta = $('m-meta'); meta.textContent = '';
      m.meta.filter(Boolean).forEach(function (line, i) { if (i) meta.appendChild(document.createElement('br')); meta.appendChild(document.createTextNode(line)); });
      document.title = m.title + ' – Napi szentmise';
      var box = $('mass'); box.innerHTML = m.html; wire(box);
      var n = $('notice'); n.hidden = !note; n.textContent = note || '';
      window.scrollTo(0, 0);
    }).catch(function () { $('mass').innerHTML = '<p class="status">A miseszöveg nem tölthető be. Ellenőrizd az internetkapcsolatot, majd frissíts (↻).</p>'; });
  }

  function choose(date) {
    try { history.replaceState(null, '', date === today ? location.pathname : '?d=' + date); } catch (e) {}
    show(date);
  }

  // Date picker
  var cal = $('cal'), view = null;
  function monthOf(s) { return s.slice(0, 7); }
  function renderCal() {
    var y = +view.slice(0, 4), mo = +view.slice(5, 7), grid = $('cal-grid');
    $('cal-month').textContent = y + '. ' + MONTHS[mo - 1];
    grid.textContent = '';
    ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'].forEach(function (w) { var e = document.createElement('span'); e.className = 'wd'; e.textContent = w; grid.appendChild(e); });
    var first = new Date(y, mo - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, mo, 0).getDate();
    for (var i = 0; i < lead; i++) grid.appendChild(document.createElement('span'));
    for (var d = 1; d <= days; d++) {
      var s = view + '-' + ('0' + d).slice(-2), b = document.createElement('button');
      b.type = 'button'; b.textContent = d; b.dataset.date = s;
      if (titles[s]) { b.className = 'has'; b.setAttribute('aria-label', short(s) + ' – ' + titles[s]); } else { b.disabled = true; }
      if (s === today) b.classList.add('today');
      if (s === current) { b.classList.add('cur'); b.setAttribute('aria-current', 'date'); }
      grid.appendChild(b);
    }
    var months = dates.map(monthOf);
    $('cal-prev').disabled = !months.some(function (m) { return m < view; });
    $('cal-next').disabled = !months.some(function (m) { return m > view; });
    $('cal-title').textContent = current ? short(current) + ': ' + titles[current] : '';
  }
  function step(dir) {
    var months = dates.map(monthOf).filter(function (m, i, a) { return a.indexOf(m) === i; }).sort();
    var cand = dir < 0 ? months.filter(function (m) { return m < view; }).pop() : months.filter(function (m) { return m > view; })[0];
    if (cand) { view = cand; renderCal(); }
  }
  $('cal-prev').addEventListener('click', function () { step(-1); });
  $('cal-next').addEventListener('click', function () { step(1); });
  $('cal-grid').addEventListener('click', function (e) {
    var b = e.target.closest('button.has'); if (!b) return;
    cal.close(); choose(b.dataset.date);
  });
  $('cal-grid').addEventListener('mouseover', function (e) { var b = e.target.closest('button.has'); if (b) $('cal-title').textContent = short(b.dataset.date) + ': ' + titles[b.dataset.date]; });
  $('cal-close').addEventListener('click', function () { cal.close(); });
  cal.addEventListener('click', function (e) { if (e.target === cal) cal.close(); });
  $('pick-date').addEventListener('click', function () {
    if (!dates.length) return;
    setMenu(false);
    view = monthOf(current || today); renderCal();
    if (cal.showModal) cal.showModal(); else cal.setAttribute('open', '');
  });

  getJSON('data/calendar.json').then(function (c) {
    c.masses.forEach(function (m) { titles[m.date] = m.title; });
    dates = Object.keys(titles).sort();
    var want = new URLSearchParams(location.search).get('d');
    if (want && titles[want]) return show(want);
    if (titles[today]) return show(today);
    // No text for today: show the nearest earlier Mass (or the first one), and say so
    var past = dates.filter(function (d) { return d < today; }), pick = past.length ? past[past.length - 1] : dates[0];
    if (!pick) { $('mass').innerHTML = '<p class="status">Még nincs feltöltött miseszöveg.</p>'; return; }
    show(pick, 'A mai napra (' + short(today) + ') még nincs miseszöveg. A ' + short(pick) + ' mise látható; a 📅 gombbal másik nap választható.');
  }).catch(function () { $('mass').innerHTML = '<p class="status">A naptár nem tölthető be. Ellenőrizd az internetkapcsolatot, majd frissíts (↻).</p>'; });

  // Keep the screen on while reading during Mass, where the browser allows it.
  var lock = null;
  function wake() { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {}); }
  document.addEventListener('visibilitychange', wake); document.addEventListener('click', wake, { once: true }); wake();
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () {}); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }); }); }
</script>
</body>
</html>
