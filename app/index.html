<title>Napi szentmise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one reading column like a missal page, sticky part-nav, rubric red for labels */
:root {
  --bg: #fdfcfa; --fg: #1e1a1a; --muted: #6b6262; --rubric: #a3171b; --line: #e8e1df; --chip: #f4eeec;
  --f-body: "Alegreya", Georgia, "Times New Roman", serif;
  --f-cap: "Alegreya SC", "Alegreya", Georgia, serif;
  --size: 19px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161314; --fg: #ece6e3; --muted: #a59c99; --rubric: #e8736f; --line: #2e2829; --chip: #241f20; color-scheme: dark; } }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { --bg: #161314; --fg: #ece6e3; --muted: #a59c99; --rubric: #e8736f; --line: #2e2829; --chip: #241f20; color-scheme: dark; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: var(--size); line-height: 1.32; }
.wrap { max-width: 52rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 4rem; }
main.wrap > section:not(.bilingual), header.top, .legend { max-width: 36rem; margin-left: auto; margin-right: auto; }
header.top { text-align: center; padding-block: 2rem 1.25rem; }
header.top .logo { display: block; width: 28px; height: 28px; border-radius: 7px; margin: 0 auto .6rem; }
.date { font-family: var(--f-cap); color: var(--rubric); letter-spacing: .06em; font-size: .9em; margin: 0; }
h1 { font-weight: 700; font-size: 1.5em; line-height: 1.2; margin: .4rem 0 .2rem; text-wrap: balance; }
.rank { font-style: italic; margin: 0; }
.meta { color: var(--muted); font-size: .85em; margin: .9rem 0 0; }
/* Menu: a vertical panel just above the floating button (bottom right), within reach of the thumb */
nav.parts { position: fixed; z-index: 20; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
  width: min(15.5rem, calc(100vw - 24px)); max-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 80px); overflow-y: auto;
  box-sizing: border-box; display: flex; flex-direction: column; gap: .15rem; padding: .45rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  transform-origin: bottom right; transform: translateY(8px) scale(.96); opacity: 0; visibility: hidden;
  transition: transform .18s ease, opacity .18s ease, visibility 0s linear .18s; }
nav.parts.open { transform: none; opacity: 1; visibility: visible; transition: transform .18s ease, opacity .18s ease; }
.menu-fab { position: fixed; z-index: 21; right: calc(env(safe-area-inset-right, 0px) + 12px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--rubric);
  font-size: 18px; line-height: 1; cursor: pointer; opacity: .55; box-shadow: 0 1px 6px rgba(0,0,0,.15); transition: opacity .2s; }
.menu-fab:hover, .menu-fab:focus-visible, .menu-fab[aria-expanded="true"] { opacity: 1; }
@media (prefers-reduced-motion: reduce) { nav.parts, nav.parts.open { transition: none; } }
.menu-item { display: flex; align-items: center; gap: .6rem; width: 100%; box-sizing: border-box; text-align: left; cursor: pointer;
  font: 16px var(--f-body); color: var(--fg); background: none; border: 0; border-radius: 10px; padding: .55rem .6rem; }
@media (hover: hover) { .menu-item:hover, .toc-list button:hover { background: var(--chip); } }
.menu-item .ic { width: 1.4rem; text-align: center; color: var(--rubric); font-weight: 600; flex: none; }
.menu-item .go { margin-left: auto; color: var(--rubric); font-size: 1.2em; line-height: 1; }
.menu-item.nav { font-family: var(--f-cap); letter-spacing: .03em; background: var(--chip); }
.menu-item.nav + .menu-item.nav { margin-top: .15rem; }
.menu-row { display: flex; align-items: center; gap: .6rem; padding: .3rem .6rem; font-size: 16px; }
.menu-row .ic { width: 1.4rem; text-align: center; color: var(--rubric); flex: none; }
.menu-row button { font: 600 15px var(--f-body); color: var(--rubric); background: none; border: 1px solid var(--line); border-radius: 8px; width: 2.4rem; height: 2rem; cursor: pointer; }
.menu-row button:first-of-type { margin-left: auto; }
.menu-sep { border: 0; border-top: 1px solid var(--line); margin: .3rem .2rem; }
nav.parts button:focus-visible, button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
/* Jump list ("Magyar" / "Latin–magyar"): a sheet at the bottom of the screen listing every part of the Mass */
/* sizes in em of the text size (A−/A+): the list grows with the reading text */
#toc { font-size: var(--size); border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--fg); padding: 0; box-sizing: border-box;
  width: min(34em, calc(100vw - 24px)); max-height: min(82vh, 46rem); margin: auto auto calc(env(safe-area-inset-bottom, 0px) + 12px);
  box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#toc[open] { display: flex; flex-direction: column; }
#toc::backdrop { background: rgba(0,0,0,.35); }
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .8rem 1rem .6rem; border-bottom: 1px solid var(--line); }
.toc-head strong { font-size: .9em; min-width: 0; font-family: var(--f-cap); color: var(--rubric); letter-spacing: .05em; font-weight: 700; }
.toc-seg { display: flex; flex: 1 1 auto; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
.toc-seg button { flex: 1 1 50%; font: .8em var(--f-cap); letter-spacing: .03em; color: var(--rubric); background: none; border: 0; border-radius: 999px; padding: .35rem .5rem; cursor: pointer; }
.toc-seg button[aria-pressed="true"] { background: var(--rubric); color: var(--bg); }
#toc .toc-foot { justify-content: space-between; gap: .5rem; }
.toc-list { list-style: none; margin: 0; padding: .3rem .5rem; overflow-y: auto; flex: 1 1 auto; overscroll-behavior: contain; }
.toc-list button { display: flex; align-items: baseline; gap: .5rem; width: 100%; text-align: left; cursor: pointer; font: 1em/1.25 var(--f-body);
  color: var(--fg); background: none; border: 0; border-radius: 8px; padding: .42rem .5rem .42rem 1.1rem; }
.toc-list .lv2 button { font-family: var(--f-cap); font-weight: 700; color: var(--rubric); letter-spacing: .04em; padding-left: .5rem; margin-top: .45rem; }
.toc-list .lv4 button { padding-left: 2rem; font-size: .94em; color: var(--muted); }
.toc-list button[aria-current="true"] { background: var(--chip); box-shadow: inset 3px 0 0 var(--rubric); }
.toc-list .t { flex: 1 1 auto; min-width: 0; }
.toc-list .la { display: block; font-size: .8em; font-style: italic; color: var(--muted); font-family: var(--f-body); font-weight: 400; letter-spacing: 0; }
#toc-close, #toc-top { font-size: .8em; height: 2.4em; }
/* Update log (menu → Napló) */
#log { border: 1px solid var(--line); border-radius: 16px; background: var(--bg); color: var(--fg); padding: 0; box-sizing: border-box;
  width: min(40rem, calc(100vw - 24px)); max-height: min(82vh, 46rem); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#log[open] { display: flex; flex-direction: column; }
#log::backdrop { background: rgba(0,0,0,.35); }
#log-text { margin: 0; padding: .6rem 1rem; overflow: auto; flex: 1 1 auto; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; color: var(--fg); }
#log .toc-foot { gap: .5rem; }
/* A newer version arrived while reading: a small button at the top, never a reload under the reader's finger */
.update { position: fixed; z-index: 19; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 8px); display: flex; justify-content: center; pointer-events: none; }
.update .btn { pointer-events: auto; background: var(--bg); box-shadow: 0 2px 10px rgba(0,0,0,.18); font-size: 15px; }
.toc-foot { display: flex; justify-content: flex-end; padding: .5rem 1rem .8rem; border-top: 1px solid var(--line); }
section { padding-top: .5rem; }
h2.part { font-family: var(--f-cap); font-weight: 700; color: var(--rubric); text-align: center; font-size: 1.15em; letter-spacing: .05em;
  margin: 2.2rem 0 .4rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line); text-wrap: balance; }
h3 { font-family: var(--f-cap); font-weight: 500; color: var(--rubric); font-size: .9em; letter-spacing: .07em; margin: 1.6rem 0 .35rem; text-wrap: balance; }
p { margin: .65rem 0; }
.resp { font-weight: 700; }
.verse { padding-left: .9rem; }
.rub, .sub { font-style: italic; color: var(--rubric); }
.cite { text-align: right; font-style: italic; color: var(--muted); font-size: .8em; margin-top: .1rem; }
.cons { font-weight: 700; padding-left: .9rem; border-left: 2px solid var(--rubric); margin: .8rem 0; }
.choice { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .6rem; margin: .6rem 0 .4rem; }
.choice label { font-family: var(--f-cap); color: var(--muted); font-size: .72em; letter-spacing: .06em; }
.choice select { flex: 1 1 12rem; min-width: 0; font: inherit; font-size: .78em; color: var(--rubric); background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: .15rem 0; }
.choice select:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.jump { text-align: center; margin: 1rem 0; }
.jump { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
button.btn { background: none; cursor: pointer; }
.btn { display: inline-block; font-family: var(--f-cap); letter-spacing: .04em; font-size: .85em; color: var(--rubric); text-decoration: none; border: 1px solid var(--rubric); border-radius: 999px; padding: .4rem 1rem; }
.btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.bilingual { margin-top: 3rem; border-top: 2px solid var(--line); }
.bi-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 1rem; font-size: .9em; }
.bi-grid p, .bi-grid h2, .bi-grid h3 { min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.bi-l { grid-column: 1; }
.bi-r { grid-column: 2; }
/* preface / EP wrappers must not break the two-column grid */
.bi-grid .variants, .bi-grid .variant, .bi-grid .day-readings-la { display: contents; }
.bi-full { grid-column: 1 / -1; }
/* No Latin for this text (or not uploaded yet): the Latin cell stays blank, with a small note on the first line */
.bi-grid .la-note { font-size: .78em; font-style: italic; color: var(--muted); }
.bi-lab { font-family: var(--f-cap); color: var(--muted); font-size: .8em; letter-spacing: .08em; border-bottom: 1px solid var(--line); padding-bottom: .2rem; }
.bi-grid h3 { margin-top: 1.4rem; }
.bi-grid .verse, .bi-grid .cons { padding-left: .5rem; }
/* Portrait phones: one language at a time, each column exactly one screen wide (the two side by side
   are twice the screen); swipe sideways, or tap the arrow fixed at the middle of the left edge (easy
   to reach; user, 2026-10-30), to go to the other one. In landscape both columns are shown side by side. */
@media (orientation: portrait) and (max-width: 700px) {
  .bi-grid { --colw: calc(100vw - 2 * max(16px, env(safe-area-inset-left, 0px))); grid-template-columns: var(--colw) var(--colw); column-gap: 32px;
    overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: .5rem; }
  .bi-grid::-webkit-scrollbar { display: none; }
  .bi-grid .bi-l, .bi-grid .bi-r { scroll-snap-align: start; }
  .bi-grid .bi-full { position: sticky; left: 0; width: var(--colw); box-sizing: border-box; }
}
.bi-switch { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  .bi-switch.on { display: flex; top: 50%; }
}
/* Side buttons on the left edge: the column arrow (portrait Latin–magyar) and "next paragraph" at 75% */
.bi-switch.on, .next-para { position: fixed; z-index: 18; transform: translateY(-50%); left: calc(env(safe-area-inset-left, 0px) + 4px);
  align-items: center; justify-content: center; width: 30px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 15px;
  background: var(--bg); color: var(--rubric); font: 20px/1 var(--f-body); opacity: .5; cursor: pointer; box-shadow: 0 1px 5px rgba(0,0,0,.12); }
/* "next paragraph": a round chip without a frame, unlike the framed column arrow above it */
.next-para { display: flex; top: 75%; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--chip); box-shadow: none;
  font-size: 18px; padding-bottom: 6px; box-sizing: border-box; opacity: .6; }
.bi-switch.on:focus-visible, .next-para:focus-visible { opacity: 1; }
body.empty .next-para { display: none; }
.legend { color: var(--muted); font-size: .8em; text-align: center; margin-top: 3rem; }
</style>
<style>
/* Alternatives inside one slot (e.g. two communion antiphons): a row of buttons, first one selected */
.alt-btns { display: flex; flex-wrap: wrap; gap: .1rem .9rem; margin: .4rem 0 .1rem; }
.alt-btn { font: .72em var(--f-cap); letter-spacing: .06em; color: var(--muted); background: none; border: 0; border-bottom: 1px solid transparent; padding: .1rem 0; cursor: pointer; }
.alt-btn[aria-pressed="true"] { color: var(--rubric); border-bottom-color: var(--rubric); }
.alt-btn:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.notice .jump { margin: .6rem 0 0; }
.notice { max-width: 36rem; margin: 1rem auto 0; padding: .6rem .8rem; background: var(--chip); border-radius: 10px; font-size: .85em; color: var(--muted); text-align: center; }
.status { text-align: center; color: var(--muted); margin: 4rem 0; }
/* No Mass for today: logo + reload */
body.empty #top, body.empty #jump-latin, body.empty #notice, body.empty .legend { display: none; }
.empty-day { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
.empty-day img { width: 112px; height: 112px; border-radius: 24px; margin-bottom: 1rem; }
/* Date picker: only days that have a Mass text can be chosen */
#cal { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); padding: 1rem; width: min(22rem, calc(100vw - 32px)); box-sizing: border-box; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
#cal::backdrop { background: rgba(0,0,0,.35); }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .6rem; }
.cal-head strong { font-family: var(--f-cap); color: var(--rubric); letter-spacing: .05em; font-weight: 700; }
.cal-head button, .cal-close { font: 600 16px var(--f-body); color: var(--rubric); background: none; border: 1px solid var(--line); border-radius: 8px; width: 2.2rem; height: 2rem; cursor: pointer; }
.cal-head button:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .25rem; text-align: center; }
.cal-grid .wd { font-family: var(--f-cap); font-size: 13px; color: var(--muted); padding-bottom: .2rem; }
.cal-grid button { font: 16px var(--f-body); aspect-ratio: 1; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--muted); opacity: .45; padding: 0; }
.cal-grid button.has { opacity: 1; color: var(--fg); background: var(--chip); cursor: pointer; font-weight: 700; }
.cal-grid button.today { border-color: var(--rubric); }
.cal-grid button.cur { background: var(--rubric); color: var(--bg); }
.cal-grid button:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }
.cal-title { min-height: 2.6em; margin: .7rem 0 .4rem; font-size: .85em; text-align: center; color: var(--muted); }
.cal-foot { display: flex; justify-content: flex-end; }
.cal-close { width: auto; padding: 0 .9rem; font-family: var(--f-cap); font-size: 14px; }
</style>
<button class="bi-switch" id="bi-switch" type="button" aria-label="A magyar oszlop">›</button>
<button class="next-para" id="next-para" type="button" aria-label="Következő bekezdés" title="Következő bekezdés">⌄</button>
<button class="menu-fab" id="menu-fab" type="button" aria-label="Menü megnyitása" aria-controls="parts-nav" aria-expanded="false">☰</button>
</head>
<body>
<nav class="parts" id="parts-nav" aria-label="Menü">
  <button type="button" class="menu-item" id="pick-date" aria-label="Másik nap választása"><span class="ic">📅</span>Másik nap</button>
  <div class="menu-row"><span class="ic">A</span>Betűméret<button id="smaller" type="button" aria-label="Kisebb betű">A−</button><button id="bigger" type="button" aria-label="Nagyobb betű">A+</button></div>
  <button type="button" class="menu-item" id="theme-toggle"><span class="ic">☾</span><span class="lab">Sötét mód</span></button>
  <button type="button" class="menu-item" id="reload" aria-label="Frissítés"><span class="ic">↻</span>Frissítés</button>
  <button type="button" class="menu-item" id="show-log"><span class="ic">ⓘ</span>Napló</button>
  <button type="button" class="menu-item" id="go-top"><span class="ic">⌂</span>Az elejére</button>
  <hr class="menu-sep">
  <button type="button" class="menu-item nav" id="toc-open" aria-haspopup="dialog">A mise részei<span class="go">›</span></button>
</nav>
<dialog id="log" aria-labelledby="log-head">
  <div class="toc-head"><strong id="log-head"></strong></div>
  <pre id="log-text"></pre>
  <div class="toc-foot"><button type="button" class="cal-close" id="log-clear">Törlés</button><button type="button" class="cal-close" id="log-copy">Másolás</button><button type="button" class="cal-close" id="log-close">Bezárás</button></div>
</dialog>
<div class="update" id="update" hidden><button type="button" class="btn" id="update-btn">↻ Új változat – frissítés</button></div>
<dialog id="toc" aria-label="A mise részei">
  <div class="toc-head"><div class="toc-seg" role="group" aria-label="Szöveg"><button type="button" id="toc-mode-hu" aria-pressed="true">Magyar</button><button type="button" id="toc-mode-la" aria-pressed="false">Latin–magyar</button></div></div>
  <ol class="toc-list" id="toc-list"></ol>
  <div class="toc-foot"><button type="button" class="cal-close" id="toc-top">⌂ Az elejére</button><button type="button" class="cal-close" id="toc-close">Bezárás</button></div>
</dialog>
<dialog id="cal" aria-labelledby="cal-month">
  <div class="cal-head"><button type="button" id="cal-prev" aria-label="Előző hónap">‹</button><strong id="cal-month"></strong><button type="button" id="cal-next" aria-label="Következő hónap">›</button></div>
  <div class="cal-grid" id="cal-grid"></div>
  <p class="cal-title" id="cal-title"></p>
  <div class="cal-foot"><button type="button" class="cal-close" id="cal-close">Bezárás</button></div>
</dialog>
<main class="wrap">
  <header class="top" id="top">
    <img class="logo" src="icon-192.png" alt="" width="28" height="28">
    <p class="date" id="m-date"></p>
    <h1 id="m-title">Napi szentmise</h1>
    <p class="rank" id="m-rank"></p>
    <p class="meta" id="m-meta"></p>
  </header>
  <div class="notice" id="notice" hidden></div>
  <p class="jump" id="jump-latin"><a class="btn" href="#latin">Latin–magyar szöveg ↓</a></p>
  <div id="mass"><p class="status">Betöltés…</p></div>
  <p class="legend">A félkövér szöveget a hívek mondják.</p>
</main>
<script>
(function () {
  var root = document.documentElement, KEY = 'mise-size';
  function $(id) { return document.getElementById(id); }
  function apply(px) { px = Math.max(15, Math.min(28, px)); root.style.setProperty('--size', px + 'px'); try { localStorage.setItem(KEY, px); } catch (e) {} return px; }
  var size = 19; try { var s = parseInt(localStorage.getItem(KEY), 10); if (s) size = s; } catch (e) {}
  size = apply(size);
  $('bigger').addEventListener('click', function () { size = apply(size + 1); });
  $('smaller').addEventListener('click', function () { size = apply(size - 1); });
  // Hidden top bar, opened by the floating button; closes after choosing a section or tapping the text
  var fab = $('menu-fab'), bar = $('parts-nav');
  function setMenu(open) { bar.classList.toggle('open', open); fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    fab.textContent = open ? '✕' : '☰'; fab.setAttribute('aria-label', open ? 'Menü bezárása' : 'Menü megnyitása'); }

  // ---------- Automatic update ----------
  // The build writes the same stamp into <meta name="build"> (the version this page runs) and into
  // version.json (the version on the server). At launch and whenever the app comes back to the screen
  // (visibilitychange, or a page restored from memory: pageshow), the page fetches version.json —
  // with a changing query parameter, so neither the browser nor GitHub Pages' CDN can answer with an
  // old copy. If it differs, it drops its offline copy and reloads, keeping the day and the scroll
  // position. Rules that keep it safe:
  // - if the reader has already touched the page since it opened or came back, it does not reload
  //   under their finger: a small "Új változat" button appears instead (and the next return reloads);
  // - offline (version.json not loadable) nothing happens;
  // - at most one automatic reload per server version per 15 minutes, marked in this tab's
  //   sessionStorage: if the old page is still served after the reload, it does not loop.
  //   Without sessionStorage it never reloads by itself (the button still works).
  var BUILD = document.querySelector('meta[name="build"]').content, UPDATED = 'mise-frissites', BACK = 'mise-vissza';
  var RETRY = 15 * 60 * 1000, touched = false, lastCheck = 0, offered = null;

    try { var b = JSON.parse(sessionStorage.getItem(BACK)); sessionStorage.removeItem(BACK); return b; } catch (e) { return null; }
  }
  function update() {
    store(BACK, JSON.stringify({ date: current, y: window.scrollY }));

  function offer(v) { offered = v; $('update').hidden = false; }
  // counts as this version's reload: the reloaded page does not reload again by itself for 15 minutes
  $('update-btn').addEventListener('click', function () {
    log('frissítés gombbal');
    if (offered) store(UPDATED, JSON.stringify({ v: offered, t: Date.now() }));
    update();
  });
  function checkUpdate(why) {
    var now = Date.now();
    if (now - lastCheck < 1000 && now >= lastCheck) return;     // visibilitychange + pageshow together: one check
    lastCheck = now;

      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (v) {
      if (!v || !v.build || !BUILD) { log(why + ': nincs verzióadat'); return; }
      if (v.build === BUILD) { log(why + ': ' + BUILD + ', naprakész'); return; }
      if (touched) { log(why + ': új ' + v.build + ' (ez ' + BUILD + '), olvasás közben → gomb'); offer(v.build); return; }
      var last;
      try { last = JSON.parse(sessionStorage.getItem(UPDATED)); } catch (e) { log(why + ': új ' + v.build + ', nincs sessionStorage → gomb'); offer(v.build); return; }
      // within 15 minutes either way: a clock that went back a little (or was set back) must not cause a second reload
      if (last && last.v === v.build && Math.abs(now - last.t) < RETRY) {
        log(why + ': új ' + v.build + ', de ' + Math.round(Math.abs(now - last.t) / 60000) + ' perce már újratöltött → gomb'); offer(v.build); return;
      }
      if (!store(UPDATED, JSON.stringify({ v: v.build, t: now }))) { log(why + ': új ' + v.build + ', nincs sessionStorage → gomb'); offer(v.build); return; }
      log(why + ': új ' + v.build + ' (ez ' + BUILD + ') → újratöltés');
      update();
    }).catch(function (e) { log(why + ': nem elérhető (' + (e && e.message || e) + ')'); });
  }

  (function () {
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
    log('indulás ' + BUILD + ' (' + (nav.type || '?') + (document.wasDiscarded ? ', eldobott lap' : '') +
        (navigator.serviceWorker && navigator.serviceWorker.controller ? ', SW' : ', SW nélkül') + ')');
  })();
  start(takeBack());
  checkUpdate('indulás');

  // Installed app: the phone often resumes it instead of starting it again. When it comes back on a
  // new day (or after 19:30, when the app's day becomes tomorrow) and was showing that day's Mass (or
  // the Order of Mass), move on to the new day; and look for a newer version.
  function resumed(why) {
    touched = false;
    var now = massDay();
    if (now !== today) {
      var wasToday = current === null || current === today;
      log(why + ': új nap ' + now);
      today = now;
      if (wasToday) start();
    }
    checkUpdate(why);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resumed('visszatérés'); });
  // a page restored from memory (back/forward cache) gets pageshow, not always visibilitychange
  window.addEventListener('pageshow', function (e) { if (e.persisted) resumed('visszaállítás'); });

  // Keep the screen on while reading during Mass, where the browser allows it.
  var lock = null;
  function wake() { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(function (l) { lock = l; }).catch(function () {}); }
  document.addEventListener('visibilitychange', wake); document.addEventListener('click', wake, { once: true }); wake();
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); }).catch(function () {}); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }); }); }
</script>
</body>
