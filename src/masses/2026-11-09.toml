Isten az erőnk és menedékünk,
biztos segítségünk, mikor minket szorongatnak.
Ezért nem félünk, ha megrendül a föld alattunk,
és a hegyek elmerülnek a mély tengerbe.
''',
'''
A folyók ágai vidítják Isten városát,
