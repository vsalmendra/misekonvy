# Readings: of the feast (igenaptár 2026-11-09; src/cycle/fix-11-09.json). On a weekday only ONE reading
# before the gospel, "bármelyiket választva": the first one offered, Ez 47 (the cycle file has 1Kor 3).
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Die 9 novembris, pp. 763-766.
[reading1]
label = "Olvasmány"
sub = "Ezekiel próféta könyvéből"
summary = "Láttam a templomból fakadt vizet, és akikhez eljutott ez a víz, meggyógyultak."
cite = "Ez 47,1-2.8-9.12"
la_sub = "Lectio libri Ezechielis prophetae"
text = '''
Száműzetésünk huszonötödik esztendejében az Úr eljött isteni látomásban, és egy angyal odavezetett a jeruzsálemi templom kapuja elé. Láttam, hogy a küszöb alól víz fakadt, a ház keleti oldalán, keletre nézett ugyanis a templom főbejárata. A víz az épülettől jobbra folyt le, az oltártól dél felé. Azután az angyal kivitt az északi kapun, s a külső kapun kívül fekvő útra vezetett, amely keletre visz. És íme, jobbról forrás tört elő!

Kísérőm így szólt: „A keleti vidék felé indul ez a víz, tehát keletre, onnét majd lehömpölyög a sivatag felé; a sivatagtól zúg tovább le a Holt-tengerig. Ez a víz a sós tengervizet is egészségessé teszi. Amerre árad e folyó, minden lény élni fog! Ahová eljut ez a víz, igen sok lesz a hal; amit csak öntöz e folyó, minden virulni fog! A folyó mentén mindkét parton sok gyümölcsfa nő: lombjuk le nem hull, és gyümölcsük nem fogy el. Havonként érik friss gyümölcsük, mert vizük a szentélyből fakad, gyümölcsük étel, lombjuk pedig orvosság lesz.”
'''
la = '''
In diebus illis: Convertit me angelus ad portam domus Domini, et ecce aquae egrediebantur subter limen domus ad orientem; facies enim domus respiciebat ad orientem, aquae autem descendebant in latus templi dextrum ad meridiem altaris. Et eduxit me per viam portae aquilonis, et convertit me ad viam foras portam exteriorem, viam quae respiciebat ad orientem; et ecce aquae redundantes a latere dextro.

Et ait ad me: «Aquae istae, quae egrediuntur ad tumulos sabuli orientalis, et descendunt ad plana deserti, intrabunt mare; et exibunt, et sanabuntur aquae: et omnis anima vivens quae serpit, quocumque venerit torrens, vivet, et erunt pisces multi satis, postquam venerint illuc aquae istae, et sanabuntur et vivent omnia ad quae venerit torrens. Et super torrentem orietur in ripis eius ex utraque parte omne lignum pomiferum; non defluet folium ex eo, et non deficiet fructus eius; per singulos menses afferet primitiva, quia aquae eius de sanctuario egredientur, et erunt fructus eius in cibum, et folia eius ad medicinam».
'''

