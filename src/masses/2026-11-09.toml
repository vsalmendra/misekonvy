[gospel]
book = "Szent János"
la_book = "Ioannem"
summary = "Jézus saját teste templomáról beszélt."
cite = "Jn 2,13-22"
text = '''
Abban az időben mivel közel volt a zsidók húsvétja, Jézus fölment Jeruzsálembe. A templomban árusokat talált, akik ökröt, juhot és galambot árultak, valamint pénzváltókat, akik ott ültek. Ekkor kötelekből ostort font, és kikergette mindnyájukat a templomból, ugyanígy a juhokat és az ökröket is, a pénzváltók pénzét pedig szétszórta. Az asztalokat felforgatta, a galambárusoknak meg azt mondta: „Vigyétek innét ezeket, ne tegyétek Atyám házát vásárcsarnokká!” Tanítványainak eszébe jutott, hogy írva van: „Emészt a házadért való buzgóság.”

A zsidók erre így szóltak: „Miféle csodajelet mutatsz, hogy ezeket teszed?”

Jézus azt válaszolta: „Romboljátok le ezt a templomot, és én három nap alatt fölépítem!”

A zsidók azt felelték: „Negyvenhat esztendeig épült ez a templom, és te három nap alatt fölépíted azt?”

Ő azonban testének templomáról beszélt. Amikor feltámadt a halálból, tanítványainak eszébe jutott, hogy ezt mondta, s hittek az írásnak és Jézus szavainak.
'''
la = '''
Prope erat Pascha Iudaeorum, et ascendit Hierosolymam Iesus; et invenit in templo vendentes boves et oves et columbas, et nummularios sedentes. Et, cum fecisset flagellum de funiculis, omnes eiecit de templo, oves quoque et boves, et nummulariorum effudit aes, et mensas subvertit. Et his qui columbas vendebant dixit: «Auferte ista hinc; nolite facere domum Patris mei domum negotiationis». Recordati sunt discipuli eius quia scriptum est: «Zelus domus tuae comedet me».

Responderunt ergo Iudaei et dixerunt ei: «Quod signum ostendis nobis, quia haec facis?»

Respondit Iesus et dixit eis: «Solvite templum hoc, et in tribus diebus excitabo illud».

Dixerunt ergo Iudaei: «Quadraginta et sex annis aedificatum est templum hoc, et tu tribus diebus excitabis illud?»

Ille autem dicebat de templo corporis sui. Cum ergo resurrexisset a mortuis, recordati sunt discipuli eius quia hoc dicebat, et crediderunt Scripturae et sermoni quem dixit Iesus.
'''

# Prayer of the faithful: igenaptár 2026-11-09 ("27. Templomszentelésről és templombúcsúra"); "N. pápáért"
# -> "Leó pápáért"; petition 4 is in brackets there (optional) -> rubric.
[faithful]
intro = "Testvéreim! Egy szívvel-lélekkel kérjük mennyei Atyánkat, hogy legyen minden szent hajlék az ő kegyelmeinek forrása, ahonnét áldást merít az ő szent népe!"
response = "Kérünk téged, hallgass meg minket!"
petitions = [
  "Imádkozunk, Urunk, Leó pápáért, püspökeinkért és papjainkért, tartsd meg kegyelmedben egyházmegyénket és egyházközségeinket!",
  "Imádkozunk Hazánkért, egész népünkért és azokért, akik fölöttünk a közhatalmat gyakorolják: Adj nekik, Urunk, jó szándékot és bölcsességet, minket pedig segíts boldogulásunkban!",
  "Imádkozunk mindazokért, akik adományaikkal és munkájukkal áldozatot hoznak templomainkért: Nagylelkűségükért jutalmazd meg őket, Urunk, bőkezűen!",
  { note = "Tetszés szerint:", text = "Imádkozunk a jelenlévő vendégekért, zarándokokért és egyházközségünk minden tagjáért: Lakjék szívükben szeretet, és vigyék haza otthonukba a békesség, a boldogság, a tisztelettudás és a becsület kincseit!" },
  "Imádkozunk a szenvedőkért, az elhagyatottakért, az öregekért, a betegekért és a szomorkodókért: Nyerjenek erőt, oltalmat, gyógyulást és vigasztalást!",
  "Imádkozunk elhunyt szeretteinkért is: Legyen osztályrészük az örök boldogság és a dicsőséges feltámadás!",
]
conclusion = "Urunk, Istenünk! Figyelj irgalmasan családod könyörgésére. Ezen a szent napon egész szívvel újra átadjuk magunkat szolgálatodra. Segíts és oltalmazz, hogy elteljünk áldásod bőségével! Krisztus, a mi Urunk által."
