# The new missal (Római Misekönyv, 3rd ed. 2021), November 13, p. 745: "Szentek általános miséi: több
# szent, 829. o." + own collect. Common: "I. Minden szent, A. Több szent, 1" (pp. 829-830), in the new
# missal's wording ("(H. i. alleluja)" dropped outside Eastertime). Latin of the common: Missale Romanum,
# editio typica tertia (2002), Commune sanctorum, A. Pro pluribus Sanctis 1 (same wording as 1977).
[entrance]
cite = "Vö. Zsolt 144,10-11"
text = '''
Magasztaljon téged, Uram, minden műved,
és szentjeid áldjanak!
Hirdessék országod dicsőséges,
és hatalmadról beszéljenek!
'''
la = '''
Confiteántur tibi, Dómine, ómnia ópera tua,
et Sancti tui benedícant tibi:
glóriam regni tui dicent,
et poténtiam tuam loquéntur.
'''

# A Hungarian proper: no Latin.
[collect]
source = "Római Misekönyv, 3. kiadás (2021), november 13., 745. o."
hu_only = true
text = '''
Mindenható, örök Isten, te megadtad,
hogy egy napon ünnepeljük
a magyar szentek és boldogok dicsőségét.
Kérünk, hogy sokszoros közbenjárásukra
áraszd bőven reánk nagy irgalmadat.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''

[offertory]
text = '''
Kérünk, Urunk, Istenünk,
fogadd jó szívvel könyörgéseinket,
és hogy oltárod szolgálatára méltók legyünk,
a szentek közbenjárásával segíts és oltalmazz minket.
Krisztus, a mi Urunk által.
'''
la = '''
Preces nostras, Dómine, quǽsumus, propitiátus admítte,
et, ut digne tuis famulémur altáribus,
Sanctórum tuórum nos intercessióne custódi.
Per Christum Dóminum nostrum.
'''

[[communion]]
cite = "Vö. Zsolt 67,4"
text = '''
Örvendenek és ujjonganak
az igazak Isten színe előtt.
'''
la = '''
Iusti epuléntur, et exsúltent in conspéctu Dei,
et delecténtur in lætítia.
'''

[[communion]]
cite = "Lk 12,37"
text = '''
Boldogok azok a szolgák,
akiket az Úr ébren talál, amikor megérkezik.
Bizony mondom nektek,
felövezi magát, asztalhoz ülteti őket,
aztán megy, és kiszolgálja őket.
'''
la = '''
Beáti servi illi, quos, cum vénerit Dóminus,
invénerit vigilántes.
Amen dico vobis, quod præcínget se,
et fáciet illos discúmbere,
et tránsiens ministrábit illis.
'''

[postcommunion]
text = '''
Mindenható, örök Isten,
minden vigasztalás és béke Atyja,
add, hogy házad népe, mely szentjeid ünnepén
neved dicséretére összegyűlt,
egyszülött Fiad misztériumaiban részesedve
elnyerje az örök élet zálogát.
Krisztus, a mi Urunk által.
'''
la = '''
Omnípotens sempitérne Deus,
Pater totíus consolatiónis et pacis,
præsta famíliæ tuæ in celebritáte Sanctórum
ad laudem tui nóminis congregátæ,
ut, per Unigéniti tui sumpta mystéria,
pignus accípiat redemptiónis ætérnæ.
Per Christum Dóminum nostrum.
'''

[reading1]
label = "Szentlecke"
sub = "Szent János apostol második leveléből"
summary = "Aki hűségesen kitart Krisztus tanítása mellett, az kegyelmi kapcsolatban él Istennel."
cite = "2Jn 4-9"
la_sub = "Lectio Epistolae secundae beati Ioannis apostoli"
text = '''
Testvéreim!

Igen örültem, hogy olyanokat találtam köztetek, akik az igazság útján járnak, amint az Atya parancsolta nekünk. Most arra kérlek titeket, a közösség tagjait, hogy szeressük egymást. Ezzel nem új parancsot írok nektek, hanem azt, amit már kezdetben kaptunk. A szeretet abban áll, hogy az Úr parancsai szerint cselekedjünk. Parancsa pedig az, amit kezdettől fogva hallottatok: szeretetben éljetek!

Sok hamis tanító lépett fel a világban. Ezek nem vallják, hogy Jézus Krisztus emberi testben jött el közénk. Az ilyen ember: hamis tanító és antikrisztus. Vigyázzatok magatokra, hogy amit már elértetek, el ne veszítsétek, hogy teljes jutalmat kapjatok! Aki eltér Krisztus tanításától, és nem tart ki mellette, az nem mondhatja magáénak Istent. Aki viszont kitart a tanítás mellett, abban él az Atya is, meg a Fiú is.
'''
la = '''
Electa domina, gavisus sum valde quoniam inveni de filiis tuis ambulantes in veritate, sicut mandatum accepimus a Patre. Et nunc rogo te, domina, non tamquam mandatum novum scribens tibi, sed quod habuimus ab initio, ut diligamus alterutrum. Et haec est caritas, ut ambulemus secundum mandata eius; hoc mandatum est, quemadmodum audistis ab initio, ut in eo ambuletis.

Quoniam multi seductores prodierunt in mundum, qui non confitentur Iesum Christum venientem in carnem; hic est seductor et Antichristus. Videte vosmetipsos, ne perdatis quae operati sumus, sed ut mercedem plenam accipiatis. Omnis qui ultra procedit et non manet in doctrina Christi, Deum non habet; qui permanet in doctrina, hic et Patrem et Filium habet.
'''

[psalm]
cite = "Zsolt 118,1.2.10.11.17.18"
response = "Boldogok, akik Isten útján járnak, és törvényét követik."
la_response = "Beati qui ambulant in lege Domini."
verses = [
'''
Azok a boldogok, akiknek tökéletes az útjuk,
akik az Úr törvénye szerint élnek.
Azok a boldogok, akik intelmeit megfogadják,
és, akik őt keresik teljes szívvel.
''', '''
Buzgó szívvel csak téged kereslek,
ne engedd, hogy parancsaidtól eltérjek.
Beírtam szívem rejtekébe intéseidet,
