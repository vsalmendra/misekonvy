''']

[alleluia]
cite = "Lk 21,28"
text = "Nézzetek föl, és emeljétek föl fejeteket, mert elérkezett megváltástok ideje."
la = "Respicite et levate capita vestra, quoniam appropinquat redemptio vestra."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jézus második eljövetele mindenkit személyesen érint."
cite = "Lk 17,26-37"
text = '''
Jézus így beszélt tanítványaihoz második eljöveteléről: „Mint ahogy Noé korában történt, úgy lesz az Emberfia napjaiban is. Ettek, ittak, házasodtak, férjhez mentek addig a napig, amíg Noé be nem szállt a bárkába. Akkor jött a vízözön, és elpusztította valamennyit.

Ugyanígy történt Lót napjaiban is. Ettek és ittak, adtak és vettek, ültettek és építettek. De amelyik napon Lót elhagyta Szodomát, kénköves tűzeső hullott az égből, és elpusztította valamennyit. Ugyanígy lesz azon a napon is, amikor az Emberfia megjelenik.

Aki abban az órában a háztetőn tartózkodik, és holmija van lenn a házban, le ne jöjjön érte, hogy elvigye! Aki a mezőn lesz, haza ne jöjjön! Emlékezzetek Lót feleségére! Aki meg akarja menteni életét, elveszíti azt; aki pedig elveszíti, megmenti azt az (örök) életre.

Mondom nektek; azon az éjszakán ketten lesznek egy fekvőhelyen; az egyiket felveszik, a másikat otthagyják. Két asszony együtt őröl; az egyiket felveszik, a másikat otthagyják. Ketten lesznek a mezőn; az egyiket felveszik, a másikat otthagyják.”

A tanítványok megkérdezték: „Hol lesz ez, Uram?” Azt felelte: „Ahol a holttest van, odagyűlnek a sasok.”
'''
la = '''
In illo tempore: Ait Iesus ad discipulos suos: «Sicut factum est in diebus Noe, ita erit et in diebus Filii hominis: edebant, bibebant, uxores ducebant, dabantur ad nuptias, usque in diem qua intravit Noe in arcam, et venit diluvium et perdidit omnes.

Similiter sicut factum est in diebus Lot: edebant, bibebant, emebant, vendebant, plantabant, aedificabant; qua die autem exiit Lot a Sodomis, pluit ignem et sulphur de caelo et omnes perdidit. Secundum haec erit qua die Filius hominis revelabitur.

In illa die qui fuerit in tecto et vasa eius in domo, ne descendat tollere illa, et qui in agro similiter non redeat retro. Memores estote uxoris Lot. Quicumque quaesierit animam suam salvam facere, perdet illam, et quicumque perdiderit illam, vivificabit eam.

Dico vobis: Illa nocte erunt duo in lecto uno, unus assumetur et alter relinquetur; duae erunt molentes in unum, una assumetur et altera relinquetur».

Respondentes dicunt illi: «Ubi, Domine?» Qui dixit eis: «Ubicumque fuerit corpus, illuc congregabuntur et aquilae».
'''

