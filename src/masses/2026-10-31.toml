# Readings: of the day (30. évközi hét szombat, II. év), from src/cycle/evkozi-30-6-II.json (igenaptár).
[reading1]
label = "Szentlecke"
sub = "Szent Pál apostolnak a filippiekhez írt leveléből"
summary = "A keresztény ember számára az élet Krisztus, a halál pedig nyereség."
cite = "Fil 1,18b-26"
la_sub = "Lectio Epistolae beati Pauli apostoli ad Philippenses"
text = '''
Testvéreim!

Mindig örülök, és ezután is örülni fogok, ha azt hallom, hogy valaki Krisztust hirdeti. Tudom ugyanis, hogy ez (az igehirdetés) a ti imádságtok által és Jézus Krisztus Lelkének segítségével üdvösségemre válik.

Abban bízom és remélek, hogy semmiben sem vallok szégyent. Sőt nyíltan megmondom, hogy Krisztus most is, mint mindig, megdicsőül testemben, akkor is, ha élek, akkor is, ha meghalok. Hiszen számomra az élet Krisztus, a halál pedig nyereség. Ha viszont tovább kell élnem, az gyümölcsöző munkát jelent.

Nem tudom tehát, mit válasszak, mert mind a kettő vonz: Szeretnék elköltözni (e világból), hogy Krisztussal legyek, mert ez mindennél jobb volna. De hogy értetek életben maradjak, arra nagyobb szükség van. Ebben a meggyőződésben biztosra veszem, hogy életben maradok, sőt előrehaladástokra és hitből fakadó örömötökre maradok meg, mindnyájatok javára. Így még több okotok lesz arra, hogy Krisztusban örüljetek, ha majd elmegyek hozzátok.
'''
la = '''
Fratres:

Dum omni modo, sive sub obtentu, sive in veritate, Christus annuntiatur, et in hoc gaudeo; sed et gaudebo, scio enim quia hoc mihi proveniet in salutem per vestram orationem et subministrationem Spiritus Iesu Christi,

secundum exspectationem et spem meam quia in nullo confundar, sed in omni fiducia sicut semper et nunc magnificabitur Christus in corpore meo, sive per vitam sive per mortem. Mihi enim vivere Christus est et mori lucrum. Quod si vivere in carne, hic mihi fructus operis est;

et quid eligam ignoro. Coartor autem ex his duobus, desiderium habens dissolvi et cum Christo esse, multo magis melius; permanere autem in carne magis necessarium est propter vos. Et hoc confidens, scio quia manebo et permanebo omnibus vobis ad profectum vestrum et gaudium fidei, ut gloriatio vestra abundet in Christo Iesu in me per meum adventum iterum ad vos.
'''

