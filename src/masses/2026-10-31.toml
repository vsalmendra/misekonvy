[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "A kevélyt megalázzák, az alázatost dicsőségre emelik."
cite = "Lk 14,1.7-11"
text = '''
Az egyik szombaton Jézus betért egy vezető farizeus házába, hogy nála étkezzék. Amikor észrevette, hogy a meghívottak válogatják az első helyeket, egy példabeszédet mondott nekik.

„Amikor lakodalomra hívnak, ne ülj az első helyre, mert akadhat a hivatalosak közt nálad előkelőbb is. Ha ez megérkezik, odajön, aki meghívott titeket, és felszólít: »Add át a helyedet neki!« És akkor szégyenszemre az utolsó helyet kell elfoglalnod.

Ha tehát hivatalos vagy valahova, menj el, és foglald el az utolsó helyet, hogy amikor a házigazda odajön, így szóljon hozzád: »Barátom, menj följebb!« Milyen kitüntetés lesz ez számodra a többi vendég előtt! Mert mindazt, aki magát felmagasztalja, megalázzák, aki pedig magát megalázza, azt felmagasztalják.”
'''
la = '''
In illo tempore: Factum est, cum intraret Iesus in domum cuiusdam principis Pharisaeorum sabbato manducare panem, et ipsi observabant eum. Dicebat autem ad invitatos parabolam, intendens quomodo primos accubitus eligerent, dicens ad illos:

«Cum invitatus fueris ab aliquo ad nuptias, non discumbas in primo loco, ne forte honoratior te sit invitatus ab eo, et veniens is qui te et illum vocavit, dicat tibi: "Da huic locum"; et tunc incipias cum rubore novissimum locum tenere.

Sed cum vocatus fueris, vade, recumbe in novissimo loco, ut cum venerit qui te invitavit, dicat tibi: "Amice, ascende superius": tunc erit tibi gloria coram omnibus simul discumbentibus. Quia omnis qui se exaltat humiliabitur; et qui se humiliat exaltabitur».
'''

