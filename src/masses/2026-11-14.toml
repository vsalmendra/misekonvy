# Readings: of the day (32. évközi hét szombat, II. év), igenaptár = src/cycle/evkozi-32-6-II.json.
[reading1]
label = "Szentlecke"
sub = "Szent János apostol harmadik leveléből"
summary = "Akik az evangélium hirdetőit segítik, együttműködnek velük az igazság szolgálatában."
cite = "3Jn 5-8"
la_sub = "Lectio Epistolae tertiae beati Ioannis apostoli"
text = '''
Kedvesem!

Helyesen teszed mindazt, amit a testvéreinkkel, főleg az úton levőkkel cselekszel. Ezek dicsérték szeretetedet a hívek közössége előtt. Jól teszed, ha Istenünkhöz méltóan ezentúl is gondoskodol a továbbutazókról. Hiszen az Úr nevéért keltek útra, és semmit sem fogadnak el a pogányoktól.

Nekünk kell tehát befogadnunk őket, hogy együttműködjünk velük az igazság szolgálatában.
'''
la = '''
Carissime:

Fideliter facis quidquid operaris in fratres et hoc in peregrinos, qui testimonium reddiderunt caritati tuae in conspectu Ecclesiae, bene facies subveniens illis in via digne Deo; pro Nomine enim profecti sunt, nihil accipientes a gentilibus.

Nos ergo debemus sublevare huiusmodi, ut cooperatores simus veritatis.
'''

[psalm]
cite = "Zsolt 111,1-6"
response = "Boldog az az ember, aki az Urat féli. – Vagy: Alleluja."
la_response = "Beatus vir qui timet Dominum."
verses = [
'''
Boldog ember, aki féli az Urat,
aki az Úr törvényében örömét leli.
Hatalmas lesz ivadéka a földön,
áldott lesz az igazak nemzetsége.
''', '''
Dicsőség és gazdagság tölti be házát,
igazsága örökre megmarad.
Az igaz világít, mint fény a sötétségben,
igazságos, jóságos és irgalmas.
''', '''
Boldog ember, aki irgalmas, és szívesen ad kölcsön,
aki a törvény szerint intézi minden dolgát.
Nem tántorodik meg soha,
az igaz emléke örökké megmarad.
''']
la_verses = [
'''
Beatus vir qui timet Dominum,
in mandatis eius cupit nimis.
Potens in terra erit semen eius,
generatio rectorum benedicetur.
''', '''
Gloria et divitiae in domo eius,
et iustitia eius manet in saeculum saeculi.
Exortum est in tenebris lumen rectis,
misericors et miserator et iustus.
''', '''
Iucundus homo qui miseretur et commodat,
disponet res suas in iudicio,
quia in aeternum non commovebitur.
In memoria aeterna erit iustus.
''']

[alleluia]
cite = "2Tessz 2,14"
text = "Az evangéliumban Isten meghívott minket, hogy Urunk, Jézus Krisztus dicsőségéből részt adjon nékünk."
la = "Deus vocavit nos per Evangelium, in acquisitionem gloriae Domini nostri Iesu Christi."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Isten meghallgatja azokat, akik őt állhatatosan kérik."
cite = "Lk 18,1-8"
text = '''
Abban az időben: Jézus példabeszédet mondott arról, hogy szüntelenül kell imádkoznunk és nem szabad belefáradnunk. Így szólt: „Az egyik városban élt egy bíró, aki Istentől nem félt és embertől nem tartott. Élt abban a városban egy özvegyasszony is. Ez elment hozzá, és kérte: »Szolgáltass nekem igazságot ellenfelemmel szemben.«

A bíró egy ideig vonakodott, aztán mégis így szólt magában: »Noha Istentől nem félek, embertől nem tartok, de ez az özvegy annyira terhemre van, hogy igazságot szolgáltatok neki, mert a végén még nekem jön és megver.«”

Az Úr így szólt: „Hallottátok, hogy mit mond az igazságtalan bíró. Vajon Isten nem szolgáltat igazságot választottjainak, akik éjjel-nappal hozzá folyamodnak? Talán megvárakoztatja őket? Mondom nektek, hamarosan igazságot szolgáltat nekik. Csak az a kérdés, hogy amikor az Emberfia eljön, talál-e hitet a földön?”
'''
la = '''
In illo tempore: Dicebat Iesus parabolam ad discipulos suos, quoniam oportet semper orare et non deficere, dicens: «Iudex quidam erat in quadam civitate, qui Deum non timebat et hominem non reverebatur. Vidua autem erat in civitate illa et veniebat ad eum dicens: “Vindica me de adversario meo”.

Et nolebat per multum tempus; post haec autem dixit intra se: “Et si Deum non timeo nec hominem revereor, tamen quia molesta est mihi haec vidua, vindicabo illam, ne in novissimo veniens suggillet me”».

Ait autem Dominus: «Audite quid iudex iniquitatis dicit; Deus autem non faciet vindictam electorum suorum clamantium ad se die ac nocte, et patientiam habebit in illis? Dico vobis: Cito faciet vindictam illorum. Verumtamen Filius hominis veniens, putas, inveniet fidem in terra?»
'''

