[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jeruzsálem pusztulása után kibontakozik majd az Isten országa."
cite = "Lk 21,29-33"
text = '''
Abban az időben Jézus a következő hasonlatot mondta tanítványainak:

„Nézzétek a fügefát és a többi fákat! Amikor látjátok, hogy már hajtanak, tudjátok, hogy közel van a nyár. Ugyanígy ti is, amikor látjátok, hogy mindez bekövetkezik, tudjátok meg, hogy közel van az Isten országa.

Bizony, mondom nektek: Nem múlik el ez a nemzedék, amíg mindez meg nem történik. Ég és föld elmúlnak, de az én igéim el nem múlnak.”
'''
la = '''
In illo tempore: Dixit Iesus discipulis suis similitudinem:

«Videte ficulneam et omnes arbores: cum iam germinaverint videntes vosmetipsi scitis quia iam prope est aestas. Ita et vos, cum videritis haec fieri, scitote quoniam prope est Regnum Dei.

Amen dico vobis: Non praeteribit generatio haec donec omnia fiant. Caelum et terra transibunt, verba autem mea non transibunt».
