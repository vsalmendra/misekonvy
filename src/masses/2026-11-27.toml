# Readings: of the day (34. évközi hét péntek, II. év), igenaptár = src/cycle/evkozi-34-5-II.json.
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Feria sexta, Anno secundo, pp. 555-557
# (OCR corrected by hand; Vulgate numbering).
[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "Miután Isten mindenkit megítélt tettei szerint, választottainak új eget és új földet ad."
cite = "Jel 20,1-4.11-21,2"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásban láttam, hogy egy angyal szállt le a mennyből, akinél az alvilág kulcsa volt. Kezében pedig nagy láncot tartott. Megragadta a sárkányt, az őskígyót, aki nem más, mint az ördög, a sátán, és ezer esztendőre megbilincselte. Letaszította az alvilágba, bezárta és lepecsételte, hogy félre ne vezesse a nemzeteket, amíg el nem telik az ezer esztendő. Azután rövid időre szabadon engedik.

Akkor trónokat láttam. Azok ültek rajtuk, akikre az ítéletet bízták. Továbbá láttam azok lelkeit, akiket Jézus tanúsága és Isten igéje miatt lefejeztek: akik nem imádták a vadállatot és bálványképét, és jelét sem viselték a homlokukon és a kezükön. Ezek életre keltek, és Krisztussal ezer esztendeig uralkodtak.

Aztán nagy ragyogó trónt láttam. A rajta ülőnek tekintete elől menekült a föld és az ég, és nem maradt számukra hely. Láttam, hogy (Isten) trónja előtt állnak azok, akik egykor meghaltak. Ott állnak nagyok és kicsinyek egyaránt. Azután kinyitották a könyveket. Kinyitottak egy másik könyvet is, az élet könyvét. A holtakat megítélték tetteik szerint, amint a könyvekben fel volt jegyezve. A tenger visszaadta a beléveszett holtakat, a halál és az alvilág is visszaadta halottjait. Valamennyit megítélték tetteik alapján. A halált és az alvilágot tüzes tóba vetették. Ez a tüzes tó a második halál. Aki nem volt feljegyezve az élet könyvébe, azt a tüzes tóba vetették.

Akkor láttam az új eget és az új földet. Az első ég és az első föld elmúlt, és a tenger sem volt többé. Ezután láttam a szent várost, az új Jeruzsálemet leszállni a mennyből, az Istentől. Szép volt, mint a vőlegényének felékesített menyasszony.
'''
la = '''
Ego, Ioannes, vidi Angelum descendentem de caelo habentem clavem Abyssi et catenam magnam in manu sua. Et apprehendit Draconem, Serpentem antiquum, qui est Diabolus et Satanas, et ligavit eum per annos mille, et misit eum in Abyssum et clausit et signavit super illum ut non seducat amplius gentes donec consummentur mille anni: post haec oportet illum solvi modico tempore.

Et vidi thronos, et sederunt super eos et iudicium datum est illis, et animas decollatorum propter testimonium Iesu et propter verbum Dei, et qui non adoraverunt Bestiam neque imaginem eius nec acceperunt characterem eius in frontibus et in manibus suis: et vixerunt et regnaverunt cum Christo mille annis.

Et vidi thronum magnum candidum et Sedentem super eum, a cuius aspectu fugit terra et caelum, et locus non est inventus eis. Et vidi mortuos, magnos et pusillos, stantes in conspectu throni, et libri aperti sunt: et alius liber apertus est, qui est vitae: et iudicati sunt mortui ex his quae scripta erant in libris secundum opera ipsorum. Et dedit Mare mortuos qui in eo erant, et Mors et Infernus dederunt mortuos qui in ipsis erant, et iudicati sunt singuli secundum opera ipsorum. Et Mors et Infernus proiecti sunt in stagnum ignis. Haec Mors secunda est, stagnum ignis. Et si quis non est inventus in libro vitae scriptus, missus est in stagnum ignis.

Et vidi Caelum novum et Terram novam: primum enim caelum et prima terra abierunt, et mare iam non est. Et Civitatem sanctam Ierusalem novam vidi descendentem de caelo a Deo, paratam sicut sponsam ornatam viro suo.
'''

