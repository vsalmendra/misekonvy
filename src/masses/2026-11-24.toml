[alleluia]
cite = "Jel 2,10c"
text = "Légy hű mindhalálig – mondja az Úr, az élet koronáját adom néked!"
la = "Esto fidelis usque ad mortem, dicit Dominus, et dabo tibi coronam vitae."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Semmi sem maradandó ezen a földön. Nem marad kő kövön a jeruzsálemi templomból sem."
cite = "Lk 21,5-11"
text = '''
Abban az időben amikor némelyek megjegyezték, hogy milyen szép kövekkel és díszes fogadalmi ajándékokkal van díszítve a (jeruzsálemi) templom, Jézus ezt mondta: „Jönnek majd napok, amikor abból, amit most itt láttok, kő kövön nem marad, mindent lerombolnak.”

Erre megkérdezték tőle: „Mester, mikor történik mindez? És milyen jelek előzik meg?”

Ő így válaszolt: „Vigyázzatok, nehogy félrevezessenek titeket! Sokan jönnek az én nevemben s mondják: »Én vagyok!« És: »Elérkezett az idő!« Ne kövessétek őket! Amikor háborúkról és lázadásokról hallotok, ne rémüldözzetek. Mindennek előbb meg kell történnie, de ezzel még nincs itt a vég!” Aztán így folytatta: „Nemzet nemzet ellen és ország ország ellen támad. Nagy földrengés lesz itt is, ott is, éhínség és dögvész. Félelmetes tünemények és rendkívüli jelek tűnnek fel az égen.”
'''
la = '''
In illo tempore: Quibusdam dicentibus de templo quod lapidibus bonis et donis ornatum esset, dixit Iesus: «Haec quae videtis, venient dies in quibus non relinquetur lapis super lapidem qui non destruatur».

Interrogaverunt autem illum dicentes: «Praeceptor, quando ergo haec erunt, et quod signum cum fieri incipient?»

Qui dixit: «Videte ne seducamini; multi enim venient in nomine meo dicentes: "Ego sum"; et "Tempus appropinquavit"; nolite ergo ire post illos. Cum autem audieritis proelia et seditiones, nolite terreri; oportet enim primum haec fieri, sed non statim finis». Tunc dicebat illis: «Surget gens contra gentem et regnum adversus regnum, et terrae motus magni et per loca fames et pestilentiae erunt, terroresque et de caelo signa magna erunt».
'''

