summary = "A rossz szolga csak annyit tesz, amennyi a kötelessége."
cite = "Lk 17,7-10"
text = '''
Abban az időben Jézus így szólt tanítványaihoz:

Melyiktek mondja béresének vagy bojtárjának, amikor a mezőről hazajön: „Gyere ide tüstént, és ülj asztalhoz.” Nem ezt mondja-e inkább: „Készíts nekem vacsorát, övezd fel magadat, és szolgálj ki, amíg eszem és iszom! Aztán majd ehetsz és ihatsz te is?” S talán megköszöni a szolgának, hogy teljesítette parancsait? Így ti is, amikor megteszitek, amit parancsoltak nektek, mondjátok: haszontalan szolgák vagyunk, hiszen csak azt tettük, ami a kötelességünk volt.
'''
la = '''
In illo tempore: Dixit Dominus:

«Quis vestrum habens servum arantem aut pascentem, qui regresso de agro dicet illi: “Statim transi, recumbe”, et non dicet ei: “Para quod cenem, et praecinge te et ministra mihi donec manducem et bibam, et post haec tu manducabis et bibes?” Numquid gratiam habet servo illi, quia fecit quae praecepta sunt? Sic et vos, cum feceritis omnia quae praecepta sunt vobis, dicite: “Servi inutiles sumus, quod debuimus facere, fecimus”».
