date = "2026-10-21"
title = "Boldog IV. Károly király"
day = "29. évközi hét szerdája · választható emléknap"
rank = "fehér színben"
gloria = false
creed = false
eucharistic_prayer = 3
prefaces = ["szentek-1", "szentek-2"]
mass_type = "Szentek általános miséje (1) · saját könyörgéssel"

# Common: Szentek általános miséi, formula 1 (always the first formula of the common).
entrance = "@szentek-altalanos/1"
offertory = "@szentek-altalanos/1"
communion = "@szentek-altalanos/1"
postcommunion = "@szentek-altalanos/1"

# Collect: the proper first; the common's as second option, for celebration missals without the new proper.
[[collect]]
label = "Saját"
source = "Saját könyörgés: ferencesekzeg.hu (Jézus Szíve Ferences Plébánia), egyezik a Magyar Kurír szövegével (ott: „viszontagságos úton a földi királyságból”)"
latin_note = "Boldog Károly saját könyörgése csak magyarul van meg; latinul a közös mise (Szentek általános miséi 1) könyörgése áll."
text = '''
Istenünk,
aki Boldog Károlyt a földi királyságból
viszontagságos úton a te országodba vezetted,
és mennyei koronával jutalmaztad,
az ő közbenjárására add meg nekünk,
hogy Szent Fiadat és testvéreinket szolgálva
mi is eljussunk az örök életre.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön-örökké.
'''

[[collect]]
label = "Közös"
ref = "@szentek-altalanos/1"

[reading1]
la_sub = "Lectio Epistolae beati Pauli apostoli ad Ephesios"
la = '''
Fratres:

Si audistis dispensationem gratiae Dei quae data est mihi pro vobis, quoniam secundum revelationem notum mihi factum est mysterium, sicut supra scripsi in brevi, prout potestis legentes intellegere prudentiam meam in mysterio Christi, quod aliis generationibus non innotuit filiis hominum, sicuti nunc revelatum est sanctis Apostolis eius et Prophetis in Spiritu:

esse gentes coheredes et concorporales et comparticipes promissionis in Christo Iesu per Evangelium, cuius factus sum minister secundum donum gratiae Dei quae data est mihi secundum operationem virtutis eius.

Mihi omnium sanctorum minimo data est gratia haec, gentibus evangelizare investigabiles divitias Christi, et illuminare omnes quae sit dispensatio mysterii absconditi a saeculis in Deo, qui omnia creavit, ut innotescat nunc Principatibus et Potestatibus in caelestibus per Ecclesiam multiformis sapientia Dei, secundum propositum saeculorum quod fecit in Christo Iesu Domino nostro, in quo habemus fiduciam et accessum in confidentia per fidem eius.
'''
label = "Szentlecke"
sub = "Szent Pál apostolnak az efezusiakhoz írt leveléből"
summary = "Krisztus szeretetének titka: a pogányok is társörökösök, és tagjai az Egyháznak."
cite = "Ef 3,2-12"
text = '''
Testvéreim!

Bizonyára hallottatok Isten kegyelmi adományáról, amelyben a ti javatokra részesültem. Kinyilatkoztatásból megismertem Krisztus titkát, amint föntebb már röviden megírtam. Ha elolvassátok, megértitek, hogy megismertem Krisztus titkát, amelyről korábban nem tudtak az emberek, de most a (Szent)lélek a szent apostoloknak és prófétáknak kinyilatkoztatta.

Eszerint Jézus Krisztusban a pogányok is társörökösök, tagjai az egy testnek, és az evangélium által részesei az ígéreteknek. Ennek lettem szolgája Isten kegyelmi adományából, amelyet hathatós erejével juttatott nekem.

Nekem, az összes szent közül a legkisebbnek jutott osztályrészül az a kegyelem, hogy Krisztus felfoghatatlan gazdagságát hirdessem a pogányoknak, és megvilágosítsak minden embert; hogyan valósult meg ez a titok, amely kezdettől fogva el volt rejtve a mindent teremtő Istenben, hogy most az Egyház által az Isten szerfölött sokrétű bölcsessége nyilvánvalóvá legyen a mennyei fejedelemségek és hatalmasságok előtt. Ez volt az ő örök szándéka, amelyet Krisztus Jézusban, a mi Urunkban megvalósított. A benne való hit által van reményünk és biztonságos utunk Istenhez.
'''

[psalm]
la_response = "Haurietis aquas in gaudio de fontibus Salvatoris."
la_verses = [
'''
Ecce Deus salvator meus,
fiducialiter agam et non timebo,
quia fortitudo mea et laus mea Dominus,
et factus est mihi in salutem.
''',
'''
Confitemini Domino et invocate nomen eius,
notas facite in populis adinventiones eius,
mementote quoniam excelsum est nomen eius.
''',
'''
Cantate Domino, quoniam magnifice fecit,
annuntiate hoc in universa terra.
Exsulta et lauda, habitatio Sion,
quia magnus in medio tui Sanctus Israel.
''']
cite = "Iz 12,2-3.4bcd.5-6"
response = "Örömmel merítsetek vizet az Üdvözítő forrásaiból!"
verses = [
'''
Íme, Isten az én üdvösségem,
bízom benne, és nem félek.
Mert az Úr az én erősségem és dicsőségem,
ő lett nékem szabadulásom.
''', '''
Adjatok hálát az Úrnak,
magasztaljátok az ő nevét.
A népek közt hirdessétek tetteit,
emlékezzetek meg arról, hogy Fölséges az ő neve.
''', '''
Zengjetek dalt az Úrnak, mert csodás dolgokat művelt:
tudja meg az egész világ!
Ujjongjatok és dicséretet mondjatok, Sion lakói,
mert nagy a ti körötökben Izrael szentje.
''']

[alleluia]
la = "Vigilate et estote parati, quia qua nescitis hora Filius hominis venturus est."
cite = "Mt 24,42a.44"
text = "Virrasszatok és álljatok készen, mert nem tudjátok, hogy az Emberfia mikor érkezik!"

[gospel]
la_book = "Lucam"
la = '''
In illo tempore: Dixit Iesus discipulis suis:

«Hoc scitote quia si sciret pater familias qua hora fur veniret, non sineret perfodiri domum suam. Et vos estote parati, quia qua hora non putatis Filius hominis venit».

Ait autem Petrus: «Domine, ad nos dicis hanc parabolam an et ad omnes?»

Et dixit Dominus: «Quis, putas, est fidelis dispensator et prudens, quem constituet dominus super familiam suam ut det illis in tempore tritici mensuram?

Beatus ille servus, quem cum venerit dominus eius invenerit ita facientem. Vere dico vobis: Supra omnia quae possidet constituet illum.

Quod si dixerit servus ille in corde suo: “Moram facit dominus meus venire”, et coeperit percutere pueros et ancillas, et edere et bibere et inebriari, veniet dominus servi illius in die qua non sperat, et hora qua nescit, et dividet eum, partemque eius cum infidelibus ponet.

Ille autem servus, qui cognovit voluntatem domini sui et non praeparavit vel non fecit secundum voluntatem eius, vapulabit multas, qui autem non cognovit et fecit digna plagis, vapulabit paucis.

Omni autem cui multum datum est, multum quaeretur ab eo, et cui commendaverunt multum, plus petent ab eo».
'''
book = "Szent Lukács"
summary = "Sokról kell számot adnia annak, aki sokat kapott."
cite = "Lk 12,39-48"
text = '''
Abban az időben Jézus így szólt tanítványaihoz:

„Gondoljátok meg: Ha tudná a házigazda, hogy melyik órában jön a tolvaj, nem engedné betörni házába. Éberen várjátok tehát az Emberfiát, mert eljön abban az órában, amikor nem is gondoljátok.”

Péter megkérdezte: „Uram, csak nekünk mondod ezt a példabeszédet, vagy mindenkinek?”

Az Úr így válaszolt: „Ki a hű és okos sáfár, akit ura szolgái fölé rendel, hogy ha eljön az ideje, kiadja részüket az élelemből?

Boldog az a szolga, akit hazatérő ura ebben a tevékenységben talál. Bizony, mondom nektek, hogy minden vagyonát rábízza.

De ha a szolga azt mondja magában: »Uram bizonyára késni fog«, és elkezdi verni a többi szolgát és szolgálót, eszik-iszik meg részegeskedik, és megérkezik ennek a szolgának az ura olyan napon, amikor nem is várja, és olyan órában, amikor nem gondolja, bizony kegyetlenül megbünteti, és a hűtlenek sorsára juttatja.

Az a szolga, aki ismeri ura akaratát, de nem áll készen, hogy akarata szerint járjon el, sok verést kap. Aki azonban nem ismeri, s így tesz olyat, amiért büntetést érdemel, csak kevés verést kap.

Mert aki sokat kapott, attól sokat követelnek, és akire sokat bíztak, attól többet kérnek számon.”
'''

