# New missal (Római Misekönyv, 3rd ed. 2021), p. 747, 18 November; Latin: Missale Romanum, editio typica
# tertia (2002), 18 Nov (the user's PDFs, 2026-11-17).
[entrance]
cite = "Vö. Zsolt 44,17-18"
text = '''
Fejedelmekké tetted őket az egész földön,
ezért minden nemzedék megemlékezik rólad,
és dicsérnek téged a népek
mindörökkön örökké.
'''
la = '''
Constítues eos príncipes super omnem terram;
mémores erunt nóminis tui in omni generatióne et generatiónem:
proptérea pópuli confitebúntur tibi in ætérnum
et in sǽculum sǽculi.
'''

[collect]
source = "Római Misekönyv, 3. kiadás (2021), november 18., 747. o.; latin: Missale Romanum, editio typica tertia (2002), 18 nov."
text = '''
Urunk, Istenünk,
Szent Péter és Szent Pál apostol vezetésével
védelmezd Egyházadat,
hogy azok pártfogásával növekedjék
az idők végezetéig hitben és szeretetben,
akik először hirdették neki evangéliumodat.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Ecclésiam tuam, Dómine,
apostólicis defénde præsídiis,
ut, per quos inítium divínæ cognitiónis accépit,
per eos usque in finem sǽculi
cápiat grátiæ cæléstis augméntum.
Per Dóminum nostrum Iesum Christum, Fílium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[offertory]
text = '''
Felajánljuk neked, Istenünk,
hódolatunk adományait, és kérünk,
add kegyelmedet, hogy a Szent Péter
és Szent Pál tanításával kapott igazságot
sértetlenül megőrizzük szívünkben.
Krisztus, a mi Urunk által.
'''
la = '''
Servitútis nostræ tibi, Dómine, múnera offeréntes,
tuam deprecámur cleméntiam,
ut trádita nobis apostolórum Petri et Pauli ministério véritas
in córdibus nostris illibáta persevéret.
Per Christum Dóminum nostrum.
'''

[communion]
cite = "Vö. Jn 6,69.70"
text = '''
Tiéd az örök életet adó tanítás, Urunk.
Mi hittünk, és tudjuk,
hogy te vagy az Isten Szentje.
'''
la = '''
Dómine, verba vitæ ætérnæ habes,
et nos credídimus quia tu es Christus Fílius Dei.
'''

[postcommunion]
text = '''
Urunk, Istenünk,
mennyei kenyérrel tápláltad népedet.
Add, hogy örvendezzünk
Szent Péter és Szent Pál apostoloknak,
akiknek oltalma alá helyezted Egyházad kormányzását.
Krisztus, a mi Urunk által.
'''
la = '''
Pópulus tuus, quǽsumus, Dómine, cælésti pane reféctus,
apostolórum Petri et Pauli commemoratióne lætétur,
quorum donásti patrocínio gubernári.
Per Christum Dóminum nostrum.
'''

