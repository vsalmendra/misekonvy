[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "A huszonnégy vén az Isten országának oszlopait, a pátriárkákat és az apostolokat jelképezi; a négy élőlény pedig az evangélistákat. Mindnyájan az örökkévaló Istent magasztalják."
cite = "Jel 4,1-11"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásban láttam, hogy kapu nyílt az égen. És hangot hallottam, amely olyan volt, mint a harsona hangja. Így szólt: „Jöjj fel ide! Megmutatom neked, aminek ezután kell megtörténnie.”

Nyomban elragadtatásba estem. Íme, egy trón állt a mennyben, és a trónon ült valaki. Az ott ülőnek tekintete a jáspis és a karneol drágakő ragyogásához hasonlított. A trón felett smaragd színéhez hasonló szivárvány ívelt.

A trón körül huszonnégy szék volt, a székeken huszonnégy vén ült fehér ruhába öltözve, fejükön aranykorona. A trónból villám és mennydörgő szózat tört elő. Hét fáklya égett a trón előtt: Isten hét szelleme. A trón előtt kristályhoz hasonló, üvegként csillogó tenger terült el.

Középen a trón előtt és a trón körül négy élőlény, elöl-hátul csupa szem. Az első élőlény oroszlánhoz hasonlított, a második tulokhoz, a harmadiknak emberhez hasonló arca volt, a negyedik szárnyaló sashoz hasonlított. Mind a négy élőlénynek hat-hat szárnya volt, körös-körül és belül csupa szem. Éjjel-nappal szüntelenül kiáltották: „Szent, szent, szent az Úr, a mindenható Isten, aki volt, aki van, és aki eljön!”

Miközben az élőlények dicsőséget, tiszteletet és áldást zengtek a trónon ülőnek, az örökkön-örökké élőnek, a huszonnégy vén leborult a trónon ülő előtt, és imádta az örökkön-örökké élőt. Letették koronájukat a trón elé, és így kiáltottak: „Méltó vagy, Urunk, Istenünk, hogy tiéd legyen a dicsőség, a tisztelet és a hatalom, mert te alkottad a mindenséget; akaratod hívott létre és teremtett mindent.”
'''
la = '''
Ego, Ioannes, vidi, et ecce ostium apertum in caelo, et vox prima quam audivi tamquam tubae loquentis mecum dicens: «Ascende huc, et ostendam tibi quae oportet fieri post haec».

Statim fui in spiritu: et ecce thronus positus erat in caelo, et supra thronum Sedens, et qui sedebat similis erat aspectu lapidi iaspidi et sardino, et iris erat in circuitu throni, aspectu similis smaragdo.

Et in circuitu throni, viginti quattuor thronos et super thronos viginti quattuor Seniores sedentes circumamictos vestimentis albis, et super capita eorum coronas aureas. Et de throno procedunt fulgura et voces et tonitrua: et septem lampades ignis ardentes ante thronum, quae sunt septem Spiritus Dei, et in conspectu throni tamquam mare vitreum simile crystallo.

Et in medio throni et in circuitu throni quattuor Animalia plena oculis ante et retro: et Animal primum simile leoni, et secundum Animal simile vitulo, et tertium Animal habens faciem quasi hominis, et quartum Animal simile aquilae volanti. Et quattuor Animalia singula eorum habebant alas senas, in circuitu et intus plena sunt oculis: et requiem non habent die et nocte dicentia: «Sanctus, Sanctus, Sanctus Dominus Deus omnipotens, qui erat et qui est et qui venturus est».

Et cum darent illa Animalia gloriam et honorem et gratiarum actionem Sedenti super thronum Viventi in saecula saeculorum, procidebant viginti quattuor Seniores ante Sedentem in throno et adorabant Viventem in saecula saeculorum et mittebant coronas suas ante Thronum dicentes: «Dignus es, Domine et Deus noster, accipere gloriam et honorem et virtutem, quia tu creasti omnia, et propter voluntatem tuam erant et creata sunt».
'''

