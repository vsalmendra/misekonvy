# New missal (Római Misekönyv, 3rd ed. 2021), Különféle szükségletekben, 49. Hálaadás Istennek, pp. 990-991:
# A (own antiphons and prayers) and B (egyéb könyörgések: collect, offerings, after communion). Latin: Missale
# Romanum, editio typica tertia (2002), Missae ad diversa, 49. Pro gratiis Deo reddendis, A and B.
# The parentheses of the book (optional words) are kept as plain text.
[entrance]
cite = "Ef 5,19-20"
text = '''
Énekeljetek és zsoltárt zengjetek szívetekben az Úrnak.
Adjatok hálát mindenkor mindenért a mi Urunk,
Jézus Krisztus nevében az Istennek, és Atyának.
'''
la = '''
Cantáte et psállite in córdibus vestris Dómino,
grátias agéntes semper pro ómnibus
in nómine Dómini nostri Iesu Christi Deo et Patri.
'''

[[collect]]
label = "A"
source = "Római Misekönyv, 3. kiadás (2021), 49. Hálaadás Istennek, A, 990. o.; latin: Missale Romanum, editio typica tertia (2002), 49. A"
text = '''
Istenünk, aki megpróbáltatások között élő
gyermekeidet mindig irgalmasan meghallgatod,
hálát adunk jóságodért, és kérve kérünk,
hogy minden baj nélkül
örömmel szolgálhassunk neked.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Deus, qui fámulos tuos in tribulatióne pósitos
semper miserátus exáudis,
pro benignitáte tua grátias agéntes,
te súpplices deprecámur,
ut, líberi a malis ómnibus,
in gáudio tibi iúgiter serviámus.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[[collect]]
label = "B"
source = "Római Misekönyv, 3. kiadás (2021), 49. Hálaadás Istennek, B (egyéb könyörgések), 991. o.; latin: Missale Romanum 2002, 49. B"
text = '''
Istenünk, minden ajándék Atyja,
hittel valljuk, hogy amik vagyunk és amink van,
az mind tőled származik.
Taníts meg minket, hogy felismerjük
végtelen atyai jóságod ajándékait,
és téged őszinte szívvel, minden erőnkből szeressünk.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Deus, Pater donórum ómnium,
a quo descéndere confitémur
quidquid habémus aut sumus,
benefícia doce nos imménsæ tuæ pietátis agnóscere,
ac te sincéro corde totáque nostra virtúte dilígere.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[[offertory]]
text = '''
Urunk, Istenünk, te szent Fiadat adtad nekünk,
hogy minket a haláltól és minden bajtól
jóságosan megszabadítson.
Kérünk, fogadd el ezt az áldozatot,
amelyet gyötrelmeinktől megszabadulva
hálaadásként neked felajánlunk.
Krisztus, a mi Urunk által.
'''
la = '''
Dómine, qui Fílium tuum dedísti nobis,
ut nos a morte omníque malo benígnus eríperet,
quǽsumus, ut hoc sacrifícium cleménter accípias,
quod ab ærúmnis líberi tibi in gratiárum offérimus actiónem.
Per Christum Dóminum nostrum.
'''

[[offertory]]
text = '''
Felajánljuk neked, Istenünk, a tőled kapott
ajándékokért ezt a dicsérő áldozatot.
Könyörögve kérünk,
hogy amit érdemünk nélkül juttattál nekünk,
azt neved dicsőségére fordítsuk.
Krisztus, a mi Urunk által.
'''
la = '''
Pro collátis donis sacrifícium tibi, Dómine, laudis offérimus,
supplíciter deprecántes,
ut, quod imméritis contulísti,
ad nóminis tui glóriam referámus.
Per Christum Dóminum nostrum.
'''

[[communion]]
cite = "Zsolt 137,1"
text = '''
Hálát adok neked, Uram, teljes szívemből,
mert meghallgattad ajkaim szavát.
'''
la = '''
Confitébor tibi, Dómine, in toto corde meo,
quóniam audísti verba oris mei.
'''

[[communion]]
cite = "Zsolt 115,12-13"
text = '''
Mivel viszonozzam az Úrnak mindazt,
amit ő nekem juttatott?
Fölemelem az üdvösség kelyhét,
és segítségül hívom az Úr nevét.
'''
la = '''
Quid retríbuam Dómino pro ómnibus quæ retríbuit mihi?
Cálicem salutáris accípiam,
et nomen Dómini invocábo.
'''

[[postcommunion]]
text = '''
Mindenható Istenünk, te az élet kenyere által
gyermekeidet a bűn kötelékétől megszabadítod,
és életerejüket megújítod.
Add meg nekünk, hogy mindig jobban
előre haladjunk az örök dicsőség reményében.
Krisztus, a mi Urunk által.
'''
la = '''
Omnípotens Deus, qui per hunc panem vitæ
fámulos tuos et peccáti vínculo liberáre
et vires eórum dignáris tua pietáte refícere,
da nobis in spem glóriæ sine intermissióne profícere.
Per Christum Dóminum nostrum.
'''

[[postcommunion]]
text = '''
Istenünk, te lelki eledelül adtad nekünk
Fiad üdvösségszerző szentségét,
amelyet most hálaadásul felajánlottunk.
Szilárdítsanak meg minket
ezek az erőt adó és örömet szerző ajándékaid,
hogy egyre nagyobb odaadással szolgálhassunk neked,
és újabb jótéteményeket nyerjünk tőled.
Krisztus, a mi Urunk által.
'''
la = '''
Deus, qui nobis in cibum spiritálem reddidísti
Fílii tui sacraméntum salutáre,
quod tibi in actiónem obtúlimus gratiárum,
da nobis ita virtútis et gáudii munéribus confirmári,
ut tibi servíre devótius et nova benefícia cónsequi mereámur.
Per Christum Dóminum nostrum.
'''

# Readings: the lectionary's "26. Hálaadás Istennek" (user's photos of the Hungarian lectionary, 2026-11-27):
# 1. olvasmány 1Kir 8,55-61; 1. válaszos zsoltár 1Krón 29,10bc.11.12 (response 13b); 4. alleluja (Vö. Lk 1,49);
# 4. evangélium Lk 1,39-55. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Pro gratiis Deo reddendis,
# pp. 1604-1614 (OCR corrected by hand; Vulgate numbering).
[reading1]
label = "Olvasmány"
sub = "a Királyok első könyvéből"
summary = "Áldott legyen az Úr, aki nyugalmat adott népének."
cite = "1Kir 8,55-61"
la_sub = "Lectio libri primi Regum"
text = '''
A templomszentelés ünnepén Salamon király felállt, és hangos szóval megáldotta a választott nép egész gyülekezetét:

„Áldott legyen az Úr, aki nyugalmat adott népének, Izraelnek, amint megígérte! Egyetlen szó se hiúsult meg mindazokból az ígéretekből, amelyeket szolgája, Mózes által mondott. Legyen velünk az Úr, a mi Istenünk, mint atyáinkkal volt. Ne hagyjon el és ne taszítson el bennünket, hanem hajlítsa magához szívünket, hogy mindig az ő útjain járjunk, s megtartsuk parancsolatait, rendelkezéseit és törvényeit, amelyeket atyáinknak meghagyott. Ezek a szavaim, amelyekkel az Úr színe előtt könyörögtem, legyenek éjjel és nappal közel az Úrhoz, a mi Istenünkhöz, hogy szolgáltasson mindenkor igazságot az ő szolgájának és választott népének, Izraelnek. Hadd tudja meg a föld minden népe, hogy az Úr az Isten és kívüle nincs más Isten! Szívetek pedig legyen egészen az Úrral, a mi Istenünkkel, hogy rendeletei szerint járjatok, és megtartsátok parancsait, éppen úgy, mint a mai napon.”
'''
la = '''
In diebus illis: Stetit Salomon rex et benedixit omni ecclesiae Israel voce magna, dicens:

«Benedictus Dominus, qui dedit requiem populo suo Israel, iuxta omnia quae locutus est; non cecidit ne unus quidem sermo ex omnibus bonis, quae locutus est per Moysen servum suum. Sit Dominus Deus noster nobiscum, sicut fuit cum patribus nostris, non derelinquens nos neque proiciens; sed inclinet corda nostra ad se, ut ambulemus in universis viis eius, et custodiamus mandata eius et caeremonias eius et iudicia, quaecumque mandavit patribus nostris. Et sint sermones mei isti, quibus deprecatus sum coram Domino, appropinquantes Domino Deo nostro die ac nocte, ut faciat iudicium servo suo et populo suo Israel per singulos dies, ut sciant omnes populi terrae quia Dominus ipse est Deus et non est ultra absque eo. Sit quoque cor nostrum perfectum cum Domino Deo nostro, ut ambulemus in decretis eius, et custodiamus mandata eius sicut et hodie».
'''

[psalm]
cite = "1Krón 29,10bc.11.12"
response = "Urunk, Istenünk, dicső nevedet magasztaljuk!"
la_response = "Laudamus nomen tuum inclitum, Domine."
verses = [
'''
Áldott vagy, Urunk, atyánknak, Izraelnek Istene,
mindörökkön örökké.
Tiéd, Uram, a fölség és a hatalom,
a dicsőség, a fényesség és a méltóság.
''',
'''
Minden a tiéd a mennyben és a földön,
tiéd, Uram, a királyság,
te vagy az Ura mindeneknek.
Tiéd a gazdagság és a dicsőség,
te uralkodsz mindenen.
''',
'''
Kezedben van az erő és a hatalom,
a te kezed tehet mindent naggyá és erőssé.
''']
la_verses = [
'''
Benedictus es, Domine Deus Israel patris nostri,
ab aeterno in aeternum.
Tua est, Domine, magnificentia et potentia
et gloria atque victoria, et tibi laus;
''',
'''
cuncta enim, quae in caelo sunt et in terra, tua sunt.
Tuum, Domine, regnum,
et tu es super omnes principes.
Tuae divitiae et tua est gloria;
tu dominaris omnium,
''',
'''
in manu tua virtus et potentia,
in manu tua magnitudo et imperium omnium.
''']

[alleluia]
cite = "Vö. Lk 1,49"
text = "Nagyot művelt velem ő, aki Hatalmas, ő, akit Szentnek hívunk."
la = "Fecit mihi magna qui potens est, et sanctum nomen eius."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Magasztalja lelkem az Urat."
cite = "Lk 1,39-55"
text = '''
Azokban a napokban Mária útra kelt, és a hegyek közé, Júda egyik városába sietett. Belépett Zakariás házába, és köszöntötte Erzsébetet.

Amikor Erzsébet meghallotta Mária köszöntését, szíve alatt megmozdult a magzat, és a Szentlélek betöltötte Erzsébetet. Hangos szóval így kiáltott: „Áldott vagy te az asszonyok között, és áldott a te méhednek gyümölcse! De hogyan lehet az, hogy Uramnak anyja látogat el hozzám? Mert íme, amikor fülembe csendült köszöntésed szava, örvendezve felujjongott méhemben a magzat! Boldog, aki hitt annak beteljesedésében, amit az Úr mondott neki!”

Mária megszólalt: „Magasztalja lelkem az Urat, és szívem ujjong megváltó Istenemben! Mert tekintetre méltatta alázatos szolgálóleányát, lám, ezentúl boldognak hirdet engem minden nemzedék. Nagy dolgokat művelt velem a Hatalmas, szentséges az ő neve! Irgalma nemzedékről nemzedékre száll, mindazokra, akik félik őt. Nagyszerű dolgot tett karja ereje, széjjelszórta mind a gőgös szívűeket. Lesöpörte trónjukról a hatalmasokat, és felmagasztalta az alázatosakat. Az éhezőket elhalmozta minden jóval, de a gazdagokat elküldte üres kézzel. Felkarolta gyermekét, Izraelt, megemlékezve irgalmasságáról, amint atyáinknak megígérte: Ábrahámnak és utódainak mindörökre!”
'''
la = '''
Exsurgens Maria in diebus illis abiit in montana cum festinatione, in civitatem Iudae. Et intravit in domum Zachariae et salutavit Elisabeth.

Et factum est, ut audivit salutationem Mariae Elisabeth, exsultavit infans in utero eius, et repleta est Spiritu Sancto Elisabeth, et exclamavit voce magna, et dixit: «Benedicta tu inter mulieres, et benedictus fructus ventris tui. Et unde hoc mihi, ut veniat mater Domini mei ad me? Ecce enim, ut facta est vox salutationis tuae in auribus meis, exsultavit in gaudio infans in utero meo. Et beata quae credidit, quoniam perficientur ea quae dicta sunt ei a Domino».

Et ait Maria: «Magnificat anima mea Dominum, et exsultavit spiritus meus in Deo Salvatori meo, quia respexit humilitatem ancillae suae. Ecce enim ex hoc beatam me dicent omnes generationes: quia fecit mihi magna qui potens est, et sanctum Nomen eius, et misericordia eius in progenies et progenies timentibus eum. Fecit potentiam in bracchio suo, dispersit superbos mente cordis sui, deposuit potentes de sede et exaltavit humiles, esurientes implevit bonis et divites dimisit inanes. Suscepit Israel puerum suum, memorari misericordiae, sicut locutus est ad patres nostros, Abraham et semini eius in saecula».
'''

# igenaptár 2026-11-28 (the day's set: Saturday of Mary).
