petitions = [
  "Irgalmasság Atyja, köszönjük, hogy a Boldogságos Szűz Máriában égi édesanyát adtál nekünk; add, hogy mindig gyermeki szeretettel ragaszkodjunk hozzá!",
  "Szűz Mária tanulékony lélekkel figyelt Jézus szavára; add, hogy példája szerint mi is szívünkbe fogadjuk szent Fiad igéit!",
  "A kereszt alatt álló Máriát megerősítetted a fájdalmak elviselésére; az ő közbenjárására adj erőt nekünk is a kereszt hordozására!",
  "Szent Fiad feltámadása által örömmel töltötted el Szűz Mária szívét; tölts el minket is a feltámadás reménységével!",
  "Szűz Máriát testével-lelkével felvetted a mennyei dicsőségbe; földi életünk után add meg nekünk is az örök életet!",
  { note = "Ha a szentmisét elhunytért mutatják be:", text = "A Boldogságos Szűz Mária a mennyország királynője; az ő közbenjárására fogadd be elhunyt testvéreinket is az örök élet boldogságába!" },
