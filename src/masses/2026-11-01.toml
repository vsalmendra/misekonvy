[reading1]
label = "Olvasmány"
sub = "a Jelenések könyvéből"
summary = "Akkora sereget láttam, hogy meg sem lehetett számlálni."
cite = "Jel 7,2-4.9-14"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János láttam, hogy napkelet felől egy másik angyal száll fel. Nála volt az élő Isten pecsétje. Hangos szóval így kiáltott a négy angyalnak, akiknek hatalmuk volt arra, hogy ártsanak a földnek és a tengernek: „Ne ártsatok se a földnek, se a tengernek, se a fáknak, míg meg nem jelöljük homlokukon Istenünk szolgáit!”

Ekkor hallottam a megjelöltek számát: száznegyvennégyezren voltak Izrael fiainak minden törzséből.

Ezután akkora sereget láttam, hogy meg sem lehetett számlálni. Minden nemzetből és törzsből, népből és nyelvből álltak ott a trón és a Bárány előtt. Fehér ruhában voltak, a kezükben pálmaággal. Hangos szóval kiáltották: „Üdv Istenünknek, aki a trónon ül, és a Báránynak!”

Az angyalok mind a trón, a vének és a négy élőlény körül álltak. Arcra borultak a trón előtt, és imádták az Istent: „Ámen. Áldás, dicsőség, bölcsesség, hála, tisztelet, hatalom és erő a mi Istenünknek örökkön-örökké! Ámen.”

Ekkor a vének közül az egyik megszólított, és megkérdezte tőlem. „Kik ezek a fehér ruhások és honnan jöttek?” Ezt feleltem: „Te tudod, uram!” Erre ő azt mondta: „Ezek a nagy szorongattatásból jöttek. Ruhájukat fehérre mosták a Bárány vérében.”
'''
la = '''
Ego Ioannes vidi alterum angelum ascendentem ab ortu solis, habentem sigillum Dei vivi; et clamavit voce magna quattuor angelis, quibus datum est nocere terrae et mari, dicens: «Nolite nocere terrae et mari neque arboribus, quoadusque signemus servos Dei nostri in frontibus eorum».

Et audivi numerum signatorum: centum quadraginta quattuor milia signati, ex omni tribu filiorum Israel.

Post haec vidi: et ecce turba magna, quam dinumerare nemo poterat, ex omnibus gentibus et tribubus et populis et linguis, stantes ante thronum et in conspectu Agni, amicti stolas albas et palmae in manibus eorum, et clamant voce magna dicentes: «Salus Deo nostro, qui sedet super thronum, et Agno».

Et omnes angeli stabant in circuitu throni et Seniorum et quattuor Animalium; et ceciderunt in conspectu throni in facies suas, et adoraverunt Deum dicentes: «Amen. Benedictio et gloria et sapientia et gratiarum actio, honor et virtus et fortitudo Deo nostro in saecula saeculorum. Amen».

Et respondit unus de Senioribus dicens mihi: «Hi, qui amicti sunt stolis albis, qui sunt et unde venerunt?» Et dixi illi: «Domine mi, tu scis». Et dixit mihi: «Hi sunt qui veniunt de tribulatione magna, et laverunt stolas suas et dealbaverunt eas in sanguine Agni».
'''

