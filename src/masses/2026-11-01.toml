# Recipe: src/masses/2026-11-01.md
date = "2026-11-01"
title = "Mindenszentek"
day = "Főünnep · az évközi 31. vasárnap helyett"
rank = "fehér színben"
gloria = true
creed = true
eucharistic_prayer = 1
prefaces = ["mindenszentek"]
mass_type = "A főünnep saját miséje"

[entrance]
source = "Római Misekönyv 1991 (PPEK 335), november 1., 620. o."
text = '''
Örvendezzünk mindnyájan az Úrban
Mindenszenteket ünnepelve,
akiknek ünnepén ujjonganak az angyalok,
és magasztalják Isten Fiát.
'''
la = '''
Gaudeamus omnes in Domino,
diem festum celebrantes
sub honore Sanctorum omnium,
de quorum sollemnitate gaudent Angeli,
et collaudant Filium Dei.
'''

[collect]
source = "Római Misekönyv 1991 (PPEK 335), november 1., 620. o."
text = '''
Mindenható, örök Isten, te megadtad,
hogy egy napon ünnepeljük minden szented dicsőségét.
Kérünk, hogy sokszoros közbenjárásukra
bőven áraszd reánk nagy irgalmadat.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön-örökké.
'''
la = '''
Omnipotens sempiterne Deus,
qui nos omnium Sanctorum tuorum merita
sub una tribuisti celebritate venerari, quaesumus,
ut desideratam nobis tuae propitiationis abundantiam,
multiplicatis intercessoribus, largiaris.
Per Dominum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitate Spiritus Sancti,
Deus, per omnia saecula saeculorum.
'''

[offertory]
source = "Római Misekönyv 1991 (PPEK 335), november 1., 620. o."
text = '''
Urunk, Istenünk, fogadd tetszéssel áldozati adományainkat,
amelyeket minden szented tiszteletére felajánlunk.
Hisszük, hogy ők már eljutottak a boldog halhatatlanságba;
engedd éreznünk, hogy közbenjárnak üdvösségünkért.
Krisztus, a mi Urunk által.
'''
la = '''
Grata tibi sint, Domine, munera,
quae pro cunctorum offerimus honore Sanctorum,
et concede,
ut, quos iam credimus de sua immortalitate securos,
sentiamus de nostra salute sollicitos.
Per Christum Dominum nostrum.
'''

[communion]
cite = "Mt 5,8-10"
source = "Római Misekönyv 1991 (PPEK 335), november 1., 621. o."
text = '''
Boldogok a tiszta szívűek, mert meglátják az Istent.
Boldogok a békességben élők, mert Isten fiainak hívják majd őket.
Boldogok, akik üldözést szenvednek az igazságért,
mert övék a mennyek országa.
'''
la = '''
Beati mundo corde, quoniam ipsi Deum videbunt;
beati pacifici, quoniam filii Dei vocabuntur;
beati qui persecutionem patiuntur propter iustitiam,
quoniam ipsorum est regnum caelorum.
'''

[postcommunion]
source = "Római Misekönyv 1991 (PPEK 335), november 1., 621. o."
text = '''
Mindenható Istenünk,
a te végtelen szentségedet csodáljuk és tiszteljük minden szentedben.
Add kegyelmedet,
hogy szentté legyünk szereteted teljességében,
és innét, a földi zarándokok asztalától eljussunk a mennyei haza lakomájára.
Krisztus, a mi Urunk által.
'''
la = '''
Mirabilem te, Deus,
et unum Sanctum in omnibus Sanctis tuis adorantes,
tuam gratiam imploramus, qua,
sanctificationem in tui amoris plenitudine consummantes,
ex hac mensa peregrinantium
ad caelestis patriae convivium transeamus.
Per Christum Dominum nostrum.
'''

