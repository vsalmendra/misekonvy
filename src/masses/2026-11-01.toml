summary = "Örüljetek és ujjongjatok, mert nagy lesz a ti jutalmatok az égben."
cite = "Mt 5,1-12a"
text = '''
Abban az időben: Jézus látva a tömeget, fölment a hegyre, leült, tanítványai pedig köréje gyűltek. Akkor szólásra nyitotta ajkát, és így tanította őket:

„Boldogok a lélekben szegények, mert övék a mennyek országa.

Boldogok, akik sírnak, mert ők vigasztalást nyernek.

Boldogok a szelídek, mert ők öröklik a földet.

Boldogok, akik éhezik és szomjazzák az igazságot, mert ők kielégítést nyernek.

Boldogok az irgalmasok, mert nekik is irgalmaznak.

Boldogok a tiszta szívűek, mert ők meglátják Istent.

Boldogok a békességszerzők, mert őket Isten fiainak fogják hívni.

Boldogok, akiket üldöznek az igazságért, mert övék a mennyek országa.

Boldogok vagytok, ha miattam gyaláznak titeket és üldöznek, ha hazudozva mindenféle gonoszsággal vádolnak titeket. Örüljetek és ujjongjatok, mert nagy lesz a ti jutalmatok az égben.”
'''
la = '''
In illo tempore: Videns Iesus turbas, ascendit in montem; et cum sedisset, accesserunt ad eum discipuli eius. Et aperiens os suum, docebat eos dicens:

«Beati pauperes spiritu, quoniam ipsorum est Regnum caelorum.

Beati qui lugent, quoniam ipsi consolabuntur.

Beati mites, quoniam ipsi possidebunt terram.

Beati qui esuriunt et sitiunt iustitiam, quoniam ipsi saturabuntur.

Beati misericordes, quia ipsi misericordiam consequentur.

Beati mundo corde, quoniam ipsi Deum videbunt.

Beati pacifici, quoniam filii Dei vocabuntur.

Beati qui persecutionem patiuntur propter iustitiam, quoniam ipsorum est Regnum caelorum.

Beati estis, cum maledixerint vobis, et persecuti vos fuerint, et dixerint omne malum adversum vos, mentientes, propter me: gaudete et exsultate, quoniam merces vestra copiosa est in caelis».
'''

[faithful]
