[reading2]
label = "Szentlecke"
sub = "Szent János apostol első leveléből"
summary = "Látni fogjuk Istent úgy, amint van."
cite = "1Jn 3,1-3"
la_sub = "Lectio Epistolae primae beati Ioannis apostoli"
text = '''
Szeretteim!

Nézzétek, mekkora szeretettel van irántunk az Atya: Isten gyermekeinek hívnak minket, és azok is vagyunk. A világ azért nem ismer minket, mert őt sem ismeri. Szeretteim, most Isten gyermekei vagyunk, de hogy mik leszünk, az még nem nyilvánvaló. Azt tudjuk, hogy ha ő megjelenik, hasonlók leszünk hozzá, mert látni fogjuk őt úgy, amint van. És mindenki, aki benne reménykedik, szentté lesz, ahogyan szent ő maga is.
'''
la = '''
Carissimi:

Videte qualem caritatem dedit nobis Pater, ut filii Dei nominemur: et sumus! Propter hoc mundus non cognoscit nos, quia non cognovit eum. Carissimi, nunc filii Dei sumus, et nondum manifestatum est quid erimus. Scimus quoniam, cum ipse apparuerit, similes ei erimus; quoniam videbimus eum sicuti est. Et omnis qui habet spem hanc in eo, castificat se, sicut ille castus est.
'''

