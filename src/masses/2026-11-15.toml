[reading2]
label = "Szentlecke"
sub = "Szent Pál apostolnak a tesszaloniki hívekhez írt első leveléből"
summary = "Ne lepjen meg titeket az a nap, mint a tolvaj!"
cite = "1Tessz 5,1-6"
la_sub = "Lectio Epistolae primae beati Pauli apostoli ad Thessalonicenses"
text = '''
Testvéreim!

Ami az Úr eljövetelének idejét és óráját illeti, arról nem szükséges írnom. Hiszen jól tudjátok ti is, hogy az Úr napja úgy érkezik el, mint éjjel a tolvaj. Amikor azt mondogatják: „Béke és biztonság”, akkor éri őket hirtelen a pusztulás, akárcsak a várandós asszonyt a fájdalom. És nem lesz menekvés számukra!

De ti, testvérek, nem jártok sötétségben, hogy az a nap tolvaj módjára meglephetne titeket. Hiszen mindnyájan a világosság és a nappal fiai vagytok. Nem vagyunk az éjszakáé, sem a sötétségé. Ne aludjunk hát, mint a többiek, hanem legyünk éberek és józanok!
'''
la = '''
—

De temporibus et momentis, fratres, non indigetis ut scribatur vobis, ipsi enim diligenter scitis quia dies Domini sicut fur in nocte ita veniet. Cum enim dixerint: «Pax et securitas», tunc repentinus eis superveniet interitus sicut dolor in utero habenti, et non effugient.

Vos autem, fratres, non estis in tenebris, ut vos dies ille tamquam fur comprehendat: omnes enim vos filii lucis estis et filii diei. Non sumus noctis neque tenebrarum: igitur non dormiamus sicut ceteri, sed vigilemus et sobrii simus.
'''

[alleluia]
cite = "Jn 15,4a.5b"
text = "Maradjatok bennem és én bennetek maradok, mondja a mi Urunk, aki bennem marad, az bő termést hoz."
la = "Manete in me, et ego in vobis, dicit Dominus; qui manet in me fert fructum multum."

[gospel]
book = "Szent Máté"
la_book = "Matthaeum"
summary = "Mivel a kevésben hű voltál, menj be Urad örömébe!"
cite = "Mt 25,14-30"
text = '''
Abban az időben Jézus a következő példabeszédet mondta tanítványainak:

Egy ember egyszer idegenbe készült, ezért összehívta szolgáit, és rájuk bízta vagyonát. Az egyiknek öt talentumot adott, a másiknak kettőt, a harmadiknak pedig egyet, kinek-kinek rátermettsége szerint, aztán útra kelt.

Aki öt talentumot kapott, menten elkezdett vele kereskedni, és másik ötöt nyert rajta. Ugyanígy az is, aki kettőt kapott: másik kettőt szerzett. Az pedig, aki csak egyet kapott, elment, ásott egy gödröt, és elrejtette a földbe urának ezüstjét.

Hosszú idő elteltével megjött a szolgák ura, és számadást tartott velük. Jött az, aki öt talentumot kapott: hozott másik ötöt is, és így szólt: „Uram, öt talentumot adtál nekem, nézd, másik ötöt nyertem rajta.” Az úr így válaszolt: „Jól van, te derék és hűséges szolga! A kevésben hű voltál, sokat bízok rád: Menj be urad örömébe!” Jött az is, aki két talentumot kapott, és így szólt: „Uram, két talentumot adtál nekem, nézd, másik kettőt nyertem rajta.” Az úr így válaszolt: „Jól van, te derék és hűséges szolga! A kevésben hű voltál, sokat bízok rád: Menj be urad örömébe!”

Végül jött az is, aki csak egy talentumot kapott. Így szólt: „Uram! Tudtam, hogy kemény ember vagy, ott is aratsz, ahová nem vetettél, és onnan is szüretelsz, ahová nem ültettél. Félelmemben elmentem hát és elástam a földbe a talentumodat. Nézd, ami a tied, visszaadom neked!” Válaszul az úr ezt mondta neki: „Te gonosz és lusta szolga! Ha tudtad, hogy aratok ott is, ahová nem vetettem, és szüretelek onnan is, ahová nem ültettem, ezüstjeimet a pénzváltóknak kellett volna adnod, hogy ha megjövök, kamatostul kapjam vissza! Vegyétek csak el tőle a talentumot és adjátok oda annak, akinek tíz talentuma van! Mert akinek van, annak még adnak, hogy bővelkedjék; és akinek nincs, attól még azt is elveszik, amije van! Ezt a hasznavehetetlen szolgát pedig vessétek ki a külső sötétségre! Ott sírás lesz és fogcsikorgatás!”
'''
la = '''
In illo tempore: Dixit Iesus discipulis suis parabolam hanc:

«Homo peregre proficiscens vocavit servos suos et tradidit illis bona sua et uni dedit quinque talenta, alii autem duo, alii vero unum, unicuique secundum propriam virtutem, et profectus est.

Statim abiit qui quinque talenta acceperat et operatus est in eis et lucratus est alia quinque; similiter qui duo acceperat lucratus est alia duo. Qui autem unum acceperat, abiens fodit in terra et abscondit pecuniam domini sui.

Post multum vero temporis venit dominus servorum illorum et ponit rationem cum eis. Et accedens qui quinque talenta acceperat, obtulit alia quinque talenta dicens: “Domine, quinque talenta tradidisti mihi: ecce alia quinque superlucratus sum”. Ait illi dominus eius: “Euge, serve bone et fidelis, super pauca fuisti fidelis, super multa te constituam: intra in gaudium domini tui”. Accessit autem et qui duo talenta acceperat, et ait: “Domine, duo talenta tradidisti mihi: ecce alia duo lucratus sum”. Ait illi dominus eius: “Euge, serve bone et fidelis, super pauca fuisti fidelis, supra multa te constituam: intra in gaudium domini tui”.

Accedens autem et qui unum talentum acceperat, ait: “Domine, novi te quia homo durus es, metis ubi non seminasti et congregas ubi non sparsisti; et timens abii et abscondi talentum tuum in terra; ecce habes quod tuum est”. Respondens autem dominus eius dixit ei: “Serve male et piger, sciebas quia meto ubi non seminavi et congrego ubi non sparsi? Oportuit ergo te mittere pecuniam meam nummulariis, et veniens ego recepissem quod meum est cum usura. Tollite itaque ab eo talentum et date ei qui habet decem talenta: omni enim habenti dabitur, et abundabit; ei autem qui non habet et quod habet auferetur ab eo. Et inutilem servum eicite in tenebras exteriores: illic erit fletus et stridor dentium”».
'''

