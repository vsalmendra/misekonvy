# Propers: the new missal (Római Misekönyv, 3rd ed. 2021, Évközi XXXIII. vasárnap, pp. 399-400; checked
# against igenaptár 2026-11-15: same words). Latin: Missale Romanum, editio typica tertia (2002), Dominica
# XXXIII "per annum".

[entrance]
cite = "Vö. Jer 29,11.12.14"
text = '''
Így szól az Úr:
Az én gondolatom a békesség gondolata
és nem a nyomorúságé;
hívjatok engem, és meghallgatlak titeket,
és hazavezetlek fogságotokból, bárhol is éltek.
'''
la = '''
Dicit Dóminus: Ego cógito cogitatiónes pacis et non afflictiónis;
invocábitis me, et ego exáudiam vos,
et redúcam captivitátem vestram de cunctis locis.
'''

[collect]
source = "Római Misekönyv, 3. kiadás (2021), Évközi XXXIII. vasárnap, 399. o.; latin: Missale Romanum, editio typica tertia (2002)"
text = '''
Urunk, Istenünk,
add, hogy örvendezve mindig neked éljünk,
mert soha meg nem fogyatkozó és teljes öröm az,
ha szüntelenül szolgálhatunk neked,
minden javak szerzőjének.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Da nobis, quǽsumus, Dómine Deus noster,
in tua semper devotióne gaudére,
quia perpétua est et plena felícitas,
si bonórum ómnium iúgiter serviámus auctóri.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[offertory]
text = '''
Kérünk, Urunk, Istenünk,
hogy a Fölségednek bemutatott áldozati adomány
szerezze meg nekünk a szívbéli odaadás kegyelmét,
és vezessen el az örök életre.
Krisztus, a mi Urunk által.
'''
la = '''
Concéde, quǽsumus, Dómine,
ut óculis tuæ maiestátis munus oblátum
et grátiam nobis devotiónis obtíneat,
et efféctum beátæ perennitátis acquírat.
Per Christum Dóminum nostrum.
'''

# Communion: two antiphons ("Vagy"), both offered, the first selected.
[[communion]]
cite = "Zsolt 72,28"
text = '''
Jó nekem az Istenhez ragaszkodnom:
az Úristenbe helyezni reményemet.
'''
la = '''
Mihi autem adhærére Deo bonum est,
pónere in Dómino Deo spem meam.
'''

[[communion]]
cite = "Mk 11,23-24"
text = '''
Bizony mondom nektek,
hogy mindazt, amit imádkozva kértek,
higgyétek, hogy megkapjátok,
és akkor valóban teljesül kérésetek – mondja az Úr.
'''
la = '''
Amen dico vobis, quidquid orántes pétitis,
crédite quia accipiétis, et fiet vobis, dicit Dóminus.
'''

[postcommunion]
text = '''
Urunk, Istenünk,
magunkhoz vettük a szent áldozat ajándékait.
Alázattal kérünk, hogy amit szent Fiad
az ő emlékezetére cselekednünk rendelt,
növelje szeretetünket.
Krisztus, a mi Urunk által.
'''
la = '''
Súmpsimus, Dómine, sacri dona mystérii,
humíliter deprecántes,
ut, quæ in sui commemoratiónem nos Fílius tuus fácere præcépit,
in nostræ profíciant caritátis augméntum.
Per Christum Dóminum nostrum.
'''

