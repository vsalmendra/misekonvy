[reading1]
label = "Olvasmány"
sub = "a Példabeszédek könyvéből"
summary = "A derék asszony mindent beszerez ügyes kézzel."
cite = "Péld 31,10-13.19-20.30-31"
la_sub = "Lectio libri Proverbiorum"
text = '''
Derék asszonyt ki talál? Értéke a gyöngyét messze meghaladja. Férje egész szívével ráhagyatkozik, és nem jár rosszul vele. Mindig javára van, sohasem kárára, életének minden napján. Előteremti a gyapjút és a kendert, és mindent beszerez ügyes kézzel.

Kinyújtja karját a guzsaly után, és kezével megfogja az orsót. Kiterjeszti kezét az elnyomott fölé, a szűkölködőnek meg karját nyújtja.

Csalfa dolog a báj, a szépség mulandó, de az istenfélő asszony dicséretet érdemel. Magasztaljátok keze munkájáért, és a városkapuknál dicsérjétek tetteit.
'''
la = '''
Mulierem fortem quis inveniet? Procul et de ultimis finibus pretium eius. Confidit in ea cor viri sui, et spoliis non indigebit; reddet ei bonum et non malum omnibus diebus vitae suae; quaesivit lanam et linum, et operata est consilio manuum suarum.

Manum suam misit ad fortia, et digiti eius apprehenderunt fusum; manum suam aperuit inopi, et palmas suas extendit ad pauperem.

Fallax gratia et vana est pulchritudo, mulier timens Dominum ipsa laudabitur. Date ei de fructu manuum suarum, et laudent eam in portis opera eius.
'''

