[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Az Emberfia azért jött, hogy megkeresse és üdvözítse, ami elveszett."
cite = "Lk 19,1-10"
text = '''
Abban az időben: Jézus Jerikó városán haladt át. Élt ott egy Zakeus nevű gazdag ember, aki a vámosok feje volt. Szerette volna látni és megismerni Jézust, de a tömeg miatt nem láthatta, mert alacsony termetű volt. Így hát előrefutott, felmászott egy vadfügefára, hogy láthassa, mert Jézusnak arra kellett elhaladnia.

Amikor Jézus odaért, felnézett és megszólította: „Zakeus, gyere le gyorsan, mert ma a te házadban kell megszállnom.”

Erre ő sietve lejött, és örömmel fogadta Jézust. Akik ezt látták, méltatlankodva megjegyezték: „Bűnös embernél száll meg.”

Zakeus azonban odaállt az Úr elé, és így szólt: „Nézd, Uram, vagyonom felét a szegényeknek adom, és ha valakit valamiben megkárosítottam, négy annyit adok helyette.”

Jézus kijelentette: „Ma üdvösség köszöntött erre a házra, hiszen ő is Ábrahám fia. Az Emberfia azért jött, hogy megkeresse és üdvözítse, ami elveszett.”
'''
la = '''
In illo tempore: Ingressus Iesus perambulabat Iericho. Et ecce vir nomine Zacchaeus, et hic erat princeps publicanorum et ipse dives. Et quaerebat videre Iesum quis esset, et non poterat prae turba quia statura pusillus erat. Et praecurrens ascendit in arborem sycomorum ut videret illum, quia inde erat transiturus.

Et cum venisset ad locum, suspiciens Iesus dixit ad eum: «Zacchaee, festinans descende, nam hodie in domo tua oportet me manere».

Et festinans descendit, et excepit illum gaudens. Et cum viderent omnes murmurabant, dicentes: «Ad hominem peccatorem devertit».

Stans autem Zacchaeus dixit ad Dominum: «Ecce dimidium bonorum meorum, Domine, do pauperibus et si quid aliquem defraudavi, reddo quadruplum».

Ait autem Iesus ad eum: «Hodie salus domui huic facta est, eo quod et ipse filius sit Abrahae: venit enim Filius hominis quaerere et salvum facere quod perierat».
'''

