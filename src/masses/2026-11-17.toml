[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "Ha az Úr szavát halljuk, nyissuk ki lelkünk ajtaját; és a kegyelem fehér ruhájában várjuk az Úr érkezését!"
cite = "Jel 3,1-6.14-22"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásom közben hallottam, amint az Úr ezt mondta nekem:

„A szárdeszi egyház elöljárójának írd meg! Így szól, akié Isten hét ajándékú lelke és a hét csillag: »Ismerem tetteidet. Tudom, hogy élőnek neveznek, de halott vagy. Ébredj fel, és önts erőt a többiekbe is, akik közel vannak a (lelki) halálhoz! Tetteidet nem találom tökéletesnek Istenem előtt. Jusson eszedbe tehát, hogyan kaptad és hallottad a tanítást! Tarts ki mellette, és térj meg! Ha nem várakozol rám, mint a tolvaj jövök (hozzád), és nem fogod tudni, melyik órában érkezem. De vannak néhányan Szárdeszben, akik nem szennyezték be ruhájukat. Ők velem fognak járni fehér ruhában, mert megérdemlik.

A győztest fehér ruhába öltöztetik. Nevét nem törlöm ki az élet könyvéből, hanem megvallom Atyám és angyalai előtt. Akinek füle van, hallja meg, mit mond a (Szent)lélek az egyházaknak!«

A laodiceai egyház elöljárójának írd meg! Így szól Krisztus, a hűséges és igaz tanú, Isten teremtésének ősforrása: »Ismerem tetteidet. Nem vagy se hideg, se meleg. Bárcsak hideg volnál vagy meleg! De mivel langyos vagy, és se hideg, se meleg, kivetlek a számból. Azt mondod: Gazdag vagyok, dúsgazdag, semmire sincs szükségem! Hát nem tudod, hogy nyomorult vagy és szánalomra méltó, szegény, vak és mezítelen? Tanácsolom néked, végy tőlem tűzben tisztult színaranyat, hogy meggazdagodjál; fehér ruhát, hogy felöltözködjél, és ne lássék szégyenletes mezítelenséged; és kenőcsöt, hogy megkend a szemedet, és láss. Akiket szeretek, azokat korholom és megfenyítem. Buzdulj fel, és tarts bűnbánatot! Nézd, az ajtóban állok, és kopogtatok. Aki meghallja szavamat, és kinyitja az ajtót, ahhoz bemegyek, és vele étkezem, ő meg velem.

A győztest magam mellé ültetem a trónra; amint én is győztem, és Atyámmal együtt ülök a trónon. Akinek füle van, hallja meg, mit mond a (Szent)lélek az egyházaknak!«”
'''
la = '''
Ego, Ioannes, audivi Dominum dicentem mihi:

«Angelo Ecclesiae quae est Sardis scribe: Haec dicit qui habet septem Spiritus Dei et septem stellas: “Scio opera tua, quia nomen habes quod vivas, et mortuus es. Esto vigilans, et confirma cetera quae moritura erant, non enim invenio opera tua plena coram Deo meo: in mente ergo habe qualiter acceperis et audieris, et serva, et paenitentiam age. Si ergo non vigilaveris, veniam tamquam fur, et nescies qua hora veniam ad te. Sed habes pauca nomina in Sardis qui non inquinaverunt vestimenta sua, et ambulabunt mecum in albis, quia digni sunt.

Qui vicerit sic vestietur vestimentis albis, et non delebo nomen eius de libro vitae et confitebor nomen eius coram Patre meo et coram angelis eius. Qui habet aurem audiat quid Spiritus dicat Ecclesiis.

Et Angelo Ecclesiae quae est Laodiciae scribe: Haec dicit Amen, Testis fidelis et verus, Principium creaturae Dei: “Scio opera tua, quia neque frigidus es neque calidus. Utinam frigidus esses aut calidus. Sic quia tepidus es et nec calidus nec frigidus, incipiam te evomere ex ore meo. Quia dicis: ‘Dives sum et locupletatus et nullius egeo’, et nescis quia tu es miser et miserabilis et pauper et caecus et nudus, suadeo tibi emere a me aurum igne probatum ut locuples fias et vestimentis albis induaris et non appareat confusio nuditatis tuae, et collyrium ad inunguendum oculos tuos ut videas. Ego quos amo arguo et castigo: aemulare ergo et paenitentiam age. Ecce sto ad ostium et pulso: si quis audierit vocem meam et aperuerit ianuam, introibo ad illum et cenabo cum illo et ipse mecum.

Qui vicerit, dabo ei sedere mecum in throno meo, sicut et ego vici et sedi cum Patre meo in throno eius”. Qui habet aurem audiat quid Spiritus dicat Ecclesiis».
'''

