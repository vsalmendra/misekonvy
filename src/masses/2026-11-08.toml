# Propers: igenaptár 2026-11-08 (wins over the 1991 missal where they differ; see the recipe).
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Dominica XXXII per annum, pp. 438-448.

[entrance]
cite = "Vö. Zsolt 87,3"
source = "igenaptár 2026-11-08 (1991: Római Misekönyv, PPEK 335, Évközi 32. vasárnap, 341. o.: „hajlítsd füledet”)"
text = '''
Imádságom jusson színed elé, Uram,
hajtsd füledet kérésemre!
'''
la = '''
Intret oratio mea in conspectu tuo;
inclina aurem tuam ad precem meam, Domine.
'''

[collect]
source = "igenaptár 2026-11-08 = Római Misekönyv 1991 (PPEK 335), Évközi 32. vasárnap, 341. o."
text = '''
Mindenható, irgalmas Isten,
kegyelmeddel tarts távol tőlünk minden rosszat.
Add, hogy minden testi-lelki erőnkkel szolgálatodra álljunk,
és készségesen teljesítsük szent akaratodat.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Omnipotens et misericors Deus,
universa nobis adversantia propitiatus exclude,
ut, mente et corpore pariter expediti,
quae tua sunt liberis mentibus exsequamur.
Per Dominum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitate Spiritus Sancti,
Deus, per omnia saecula saeculorum.
'''

[offertory]
source = "igenaptár 2026-11-08 (eltér az 1991-es Római Misekönyvtől, PPEK 335, 341. o.)"
text = '''
Kérünk, Urunk, Istenünk,
tekints megengesztelődve erre az áldozatra,
hogy amit Fiad szenvedésére emlékezve ünneplünk,
azt szívünk odaadásával elérjük.
Krisztus, a mi Urunk által.
'''
la = '''
Sacrificiis praesentibus, Domine,
quaesumus, intende placatus,
ut, quod passionis Filii tui mysterio gerimus,
pio consequamur affectu.
Per Christum Dominum nostrum.
'''

[communion]
cite = "Vö. Zsolt 22,1-2"
source = "igenaptár 2026-11-08, az első antifóna (1991: Római Misekönyv, PPEK 335, 341. o.: „és csöndes vizekhez vezet”)"
text = '''
Az Úr az én pásztorom, nincs is semmiben hiányom:
zöldellő mezőkön terelget engem,
csöndes folyóvizek mellett nevelt föl engem!
'''
la = '''
Dominus regit me, et nihil mihi deerit;
in loco pascuae ibi me collocavit,
super aquam refectionis educavit me.
'''

[postcommunion]
source = "igenaptár 2026-11-08 (1991: Római Misekönyv, PPEK 335, 341. o.: „Hálát adunk, Istenünk, / hogy szentségi ajándékoddal”)"
text = '''
Hálát adunk, Urunk, Istenünk,
hogy szent ajándékoddal tápláltál minket.
Kérjük, hogy Szentlelked kiáradása által
maradjon meg az igazlelkűség kegyelme mindazokban,
akikben mennyei erőd működni kezdett.
Krisztus, a mi Urunk által.
'''
la = '''
Gratias tibi, Domine,
referimus sacro munere vegetati,
tuam clementiam implorantes,
ut, per infusionem Spiritus tui,
in quibus caelestis virtus introivit,
sinceritatis gratia perseveret.
Per Christum Dominum nostrum.
'''

