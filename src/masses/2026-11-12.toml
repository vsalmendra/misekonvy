# The new missal (Római Misekönyv, 3rd ed. 2021, pp. 744-745): the whole Mass is proper - own
# antiphons too (the 1991 edition sent to the martyrs' common for them). Latin: Missale Romanum,
# editio typica tertia (2002), 12 November (the user's PDF, 2026-11-12) for every proper of the day.
[entrance]
cite = ""
text = '''
Az Úr szövetségéért és az atyák törvényeiért
Isten szentjei kitartottak a testvéri szeretetben:
mert egy szívvel-lélekkel egyek voltak a hitben.
'''
la = '''
Propter testaméntum Dómini et leges patérnas,
Sancti Dei perstitérunt in amore fratérnitatis:
quia unus fuit semper spíritus in eis, et una fides.
'''

[communion]
cite = "Mt 10,39"
text = '''
Aki elveszíti életét énértem – mondja az Úr –,
megtalálja azt.
'''
la = '''
Qui perdíderit ánimam suam propter me,
dicit Dóminus,
invéniet eam in ætérnum.
'''

[collect]
source = "Római Misekönyv, 3. kiadás (2021), november 12., 744. o.; latin: Missale Romanum, editio typica tertia (2002), 12 nov."
text = '''
Urunk, Istenünk,
add, hogy elevenen munkálkodjék Egyházadban a Szentlélek,
akivel betelve Szent Jozafát püspök
életét adta övéiért.
Közbenjárására erősíts meg minket is Szentlelkeddel,
hogy készséggel adjuk akár életünket is testvéreinkért.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Excita, quǽsumus, Dómine, in Ecclésia tua Spíritum,
quo replétus beátus Iósaphat ánimam suam pro óvibus pósuit,
ut, eo intercedénte, nos quoque eódem Spíritu roboráti,
ánimam nostram pro frátribus pónere non vereámur.
Per Dóminum nostrum Iesum Christum, Fílium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[offertory]
text = '''
Jóságos Istenünk, add áldásodat felajánlott adományainkra,
és erősíts meg minket abban a hitben,
amelyet Szent Jozafát püspök vére hullásával megpecsételt.
Krisztus, a mi Urunk által.
'''
la = '''
Clementíssime Deus,
múnera hæc tua benedictióne perfúnde,
et nos in tua fide confírma,
quam sanctus Iósaphat effúso sánguine asséruit.
Per Christum Dóminum nostrum.
'''

[postcommunion]
text = '''
Urunk, Istenünk,
adja meg nekünk ez a mennyei asztal
a lelki erősséget és a békés lelkületet,
hogy Szent Jozafát püspök példájára
életünket készségesen áldozzuk
az Egyház becsületéért és egységéért.
Krisztus, a mi Urunk által.
'''
la = '''
Spíritum, Dómine, fortitúdinis et pacis
hæc nobis tríbuat mensa cæléstis,
ut, sancti Iósaphat exémplo, vitam nostram
ad honórem et unitátem Ecclésiæ
libénter impendámus.
Per Christum Dóminum nostrum.
'''

[reading1]
label = "Szentlecke"
sub = "Szent Pál apostolnak Filemonhoz írt leveléből"
summary = "Az apostol arra kéri Filemont, hogy szökött rabszolgáját, aki időközben keresztény lett, úgy fogadja, mint szeretett testvérét."
cite = "Filem 7-20"
la_sub = "Lectio Epistolae beati Pauli apostoli ad Philemonem"
text = '''
Szeretett Testvérem!

Nagy örömmel és vigasztalással töltött el, amit szeretetedről hallottam, mert megnyugvást szereztél a hívek szívének. Ezért – bár Jézus Krisztusra hivatkozva meg is parancsolhatnám azt, ami úgyis kötelességed, mégis – a szeretet alapján inkább kérlek, én, az öreg Pál, aki most Krisztus Jézusért fogságot szenvedek. Fiamért, Onezimuszért könyörgök, akinek bilincseimben én adtam életet (Krisztusban). Egykor haszontalan volt számodra, most azonban számodra is, számomra is hasznos. Úgy küldöm vissza hozzád, mint saját szívemet. Szerettem volna magam mellett tartani, hogy helyetted szolgáljon nekem fogságomban, amelyet az evangéliumért viselek.

Beleegyezésed nélkül azonban mégsem teszem, hogy jótéteményed ne kényszerből fakadjon, hanem önként vállald. Talán éppen azért hagyott ott egy időre, hogy egyszer s mindenkorra visszakapjad, de már nem mint szolgát, hanem többet: mint szeretett testvért. Mert nekem teljesen az, de neked még inkább: test szerint is, az Úrban is.

Ha tehát együtt érzel velem, fogadd őt úgy, mint engem. Amennyiben pedig megkárosított vagy tartozik valamivel, írd az én terhemre. Én, Pál – saját kezűleg írom – én térítem meg. Arról nem is szólok, hogy önmagaddal is nekem tartozol. Bizony, így van ez, testvér! Szeretném, ha örömömre szolgálnál az Úrban. Teljesítsd hát szívem vágyát Krisztusban!
'''
la = '''
Carissime:

Gaudium magnum habui et consolationem in caritate tua, quia viscera sanctorum requieverunt per te, frater. Propter quod multam fiduciam habens in Christo imperandi tibi quod ad rem pertinet, propter caritatem magis obsecro, cum sim talis ut Paulus senex, nunc autem et vinctus Christi Iesu. Obsecro te de meo filio, quem genui in vinculis, Onesimo, qui tibi aliquando inutilis fuit, nunc autem et tibi et mihi utilis, quem remisi tibi, eum, hoc est viscera mea; quem ego volueram mecum detinere, ut pro te mihi ministraret in vinculis Evangelii.

Sine consilio autem tuo nihil volui facere, uti ne velut ex necessitate bonum tuum esset sed voluntarium. Forsitan enim ideo discessit ad horam ut aeternum illum reciperes, iam non ut servum sed plus servo, carissimum fratrem, maxime mihi, quanto autem magis tibi et in carne et in Domino.

Si ergo habes me socium, suscipe illum sicut me. Si autem aliquid nocuit tibi aut debet, hoc mihi imputa; ego Paulus scripsi mea manu, ego reddam; ut non dicam tibi quod et te ipsum mihi debes. Ita, frater, ego te fruar in Domino; refice viscera mea in Christo.
'''

