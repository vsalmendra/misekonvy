[alleluia]
cite = "Vö. Jn 15,5"
text = "Jézus mondja: „Én vagyok a szőlőtő, ti pedig a szőlővesszők. Aki bennem marad, és én őbenne, az bő termést hoz.”"
la = "Ego sum vitis, vos palmites, dicit Dominus. Qui manet in me, et ego in eo, hic fert fructum multum."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Isten országa bennünk jön el."
cite = "Lk 17,20-25"
text = '''
A farizeusok egyszer megkérdezték Jézustól, mikor jön el az Isten országa. Ő ezt válaszolta: „Isten országa nem jön el szembetűnő módon. Nem lehet azt mondani: »Nézd itt van, vagy amott!« Isten országa köztetek van.”

Azután tanítványaihoz fordult: „Jönnek napok, amikor az Emberfiának egyetlen napját is szívesen látnátok, de nem látjátok. Mondják majd nektek: »Nézzétek, itt van, vagy amott!« Oda ne menjetek, és ne higgyétek! Mert ahogy a cikázó villám az ég egyik felétől a másikig villan, úgy jön el azon a napon az Emberfia is. Előbb azonban sokat kell szenvednie, és megvetésben kell részesülnie ettől a nemzedéktől.”
'''
la = '''
In illo tempore: Interrogatus Iesus a Pharisaeis, quando venit Regnum Dei, respondit eis et dixit: «Non venit Regnum Dei cum observatione, neque dicent: “Ecce hic” aut: “Illic”; ecce enim Regnum Dei intra vos est».

Et ait ad discipulos: «Venient dies, quando desideretis videre unum diem Filii hominis et non videbitis. Et dicent vobis: “Ecce hic, ecce illic”; nolite ire neque sectemini. Nam sicut fulgur coruscans de sub caelo in ea quae sub caelo sunt fulget, ita erit Filius hominis in die sua. Primum autem oportet illum multa pati et reprobari a generatione hac».
'''

