# Collect: the saint's own (CDW 2011, Latin on vatican.va; Hungarian as quoted by Vatican News from
# the Roman Missal) first, the common's (pápák) second.
[[collect]]
label = "Saját"
source = "Latin: vatican.va, CDW 2011 (De Communi pastorum: pro papa, collecta propria); magyar: Vatican News, 2021-10-22, a Római Misekönyvből idézve"
text = '''
Irgalomban gazdag Istenünk,
aki az egész Egyház vezetésére hívtad
Szent II. János Pál pápát,
add meg nekünk,
hogy tanításától megerősítve
bizalommal megnyissuk a szívünket
Krisztus üdvözítő kegyelmének,
az ember egyetlen Megváltójának.
Aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön-örökké.
'''
la = '''
Deus, dives in misericórdia,
qui beátum Ioánnem Paulum, papam,
univérsae Ecclésiae tuae praeésse voluísti,
praesta, quaésumus, ut, eius institútis edócti,
corda nostra salutíferae grátiae Christi,
uníus redemptóris hóminis, fidénter aperiámus.
Qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia saécula saeculórum.
'''

[[collect]]
label = "Közös"
ref = "@lelkipasztorok/papak-puspokok-1"

[reading1]
label = "Szentlecke"
sub = "Szent Pál apostolnak az efezusiakhoz írt leveléből"
summary = "Életünk alapja legyen a szeretet; hogy így Krisztusban megkapjuk a megváltás kegyelmének kincseit."
cite = "Ef 3,14-21"
la_sub = "Lectio Epistolae beati Pauli apostoli ad Ephesios"
text = '''
Testvéreim!

Meghajtom térdemet az Atya előtt: tőle származik ugyanis minden közösség az égben és a földön. Adja meg nektek dicsőségének gazdagsága szerint, hogy Lelke által megerősödjetek benső emberré, hogy a hittel Krisztus lakjék szívetekben, s gyökeret verjetek és alapot vessetek a szeretetben. Akkor majd fel tudjátok fogni az összes szenttel együtt, mi a szélesség és a hosszúság, a magasság és a mélység; megismeritek Krisztusnak minden értelmet meghaladó szeretetét, és beteltek az Isten egész teljességével.

A végtelenül hatalmas Istennek pedig, aki hatalmával bennünk működik, és mindent megtehet azon felül is, amit kérünk vagy megértünk, legyen dicsőség az Egyházban és Jézus Krisztusban minden nemzedéken át mindörökké. Ámen.
'''
la = '''
Fratres:

Flecto genua mea ad Patrem, ex quo omnis paternitas in caelis et in terra nominatur, ut det vobis secundum divitias gloriae suae virtute corroborari per Spiritum eius in interiorem hominem, habitare Christum per fidem in cordibus vestris, in caritate radicati et fundati, ut valeatis comprehendere cum omnibus sanctis quae sit latitudo et longitudo et sublimitas et profundum, scire etiam supereminentem scientiae caritatem Christi, ut impleamini in omnem plenitudinem Dei.

Ei autem qui potens est supra omnia facere superabundanter quam petimus aut intellegimus secundum virtutem quae operatur in nobis, ipsi gloria in Ecclesia et in Christo Iesu in omnes generationes saeculi saeculorum: amen.
'''

[psalm]
cite = "Zsolt 32,1-2.4-5.11-12.18-19"
response = "Kegyes az Isten hozzánk: jóságával eltölt mindent."
la_response = "Misericordia Domini plena est terra."
verses = [
'''
Örvendezzetek, igazak, az Úrban,
a szentekhez dicséret illik.
Dicsérjétek az Urat citerával,
tízhúrú hárfán zengjetek néki.
''', '''
Sziklaszilárd az Úr Igéje,
minden tettét hűség vezeti.
Az igazlelkűséget és a törvényt szereti,
telve van a föld az Úr irgalmával.
''', '''
Az Úr szándéka megmarad örökre,
szívének gondolata nemzedékről nemzedékre.
Boldog az a nemzet, amelynek az Úr az Istene,
a nép, amelyet örökségül választott magának.
''', '''
Az istenfélőkre ügyel az Úr szeme,
akik bíznak az ő irgalmában.
Megmenti lelküket a haláltól,
és táplálja őket éhínség idején.
''']
la_verses = [
'''
Exsultate, iusti, in Domino;
rectos decet collaudatio.
Confitemini Domino in cithara,
in psalterio decem chordarum psallite illi.
''', '''
Quia rectum est verbum Domini,
et omnia opera eius in fide.
Diligit iustitiam et iudicium,
misericordia Domini plena est terra.
''', '''
Consilium autem Domini in aeternum manet,
cogitationes cordis eius in generatione et generationem.
Beata gens, cui Dominus est Deus,
populus, quem elegit in hereditatem sibi.
''', '''
Ecce oculi Domini super metuentes eum,
in eos qui sperant super misericordia eius,
ut eruat a morte animas eorum,
et alat eos in fame.
''']

[alleluia]
cite = "Fil 3,8-9"
text = "Mindent elvetettem, sőt szemétnek tekintek, csakhogy Krisztust elnyerjem, és őhozzá tartozzam."
la = "Omnia detrimentum feci, et arbitror ut stercora, ut Christum lucrifaciam et inveniar in illo."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Krisztus evangéliumának sokan ellene mondanak. Innen támad a sok szakadás és békétlenség a világon."
cite = "Lk 12,49-53"
text = '''
Abban az időben Jézus így szólt tanítványaihoz:

„Azért jöttem, hogy tüzet gyújtsak a földön. Mi mást akarnék, mint hogy lángra lobbanjon. Keresztséggel kell megkereszteltetnem. Mennyire várom, hogy ez beteljesedjék!

Azt gondoljátok, azért jöttem, hogy békét hozzak a földre? Mondom nektek, nem azt, hanem szakadást. Ezentúl, ha öten lesznek egy házban, megoszlanak egymás között: három kettő ellen, és kettő három ellen. Szembekerül apa a fiával és fiú az apjával, anya a lányával és lány az anyjával, anyós a menyével és meny az anyósával.”
'''
la = '''
In illo tempore: Dixit Iesus discipulis suis:

«Ignem veni mittere in terram, et quid volo? Si iam accensus esset! Baptisma autem habeo baptizari, et quomodo coartor usque dum perficiatur!

Putatis quia pacem veni dare in terram? Non, dico vobis, sed separationem. Erunt enim ex hoc quinque in domo una divisi tres in duos et duo in tres, dividentur pater in filium et filius in patrem, mater in filiam et filia in matrem, socrus in nurum suam et nurus in socrum».
'''

[faithful]
intro = "Kérjük, testvéreim, bízó lélekkel az Atyaisten irgalmát magunknak, valamint távol lévő és gondokkal küzdő testvéreinknek!"
response = "Kérünk téged, hallgass meg minket!"
