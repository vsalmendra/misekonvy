# Readings: ferial, 34. évközi hét szerda, II. év (src/cycle/evkozi-34-3-II.json = igenaptár 2026-11-25).
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Feria quarta, Anno secundo, pp. 543-545
# (OCR corrected by hand; Vulgate numbering).
[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "Az Egyiptomból való szabadulás előképe a megváltásnak: az üdvözültek dicsőítő éneket énekelnek."
cite = "Jel 15,1-4"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásban egy csodálatos nagy jelet láttam az égen: hét angyalt, akikre a hét végső csapás volt rábízva. Általuk teljesedik be Isten büntetése. Tűzben játszó, üvegként csillogó tengert láttam. Láttam azokat is, akik legyőzték a (gonoszság) vadállatát, semmibe vették képmását és a nevének számát. Kezükben tartották Isten hárfáját, ott álltak az üvegtengeren. Isten szolgájának, Mózesnek és a Báránynak énekét énekelték: Nagy és csodálatos minden műved, mindenható Urunk, Istenünk. Hűségesek és igazak útjaid, nemzetek Királya! Ki ne félne, tisztelne téged, Urunk, ki ne dicsérné nevedet? Egyedül csak te vagy a Szent, eljön minden nemzet, és színed elé borul, mert nyilvánvalóvá lett, ahogyan ítéltél.
'''
la = '''
Ego, Ioannes, vidi aliud signum in caelo magnum et mirabile: Angelos septem habentes plagas septem novissimas, quoniam in illis consummata est ira Dei. Et vidi tamquam mare vitreum mixtum igne, et eos qui vicerunt Bestiam et imaginem illius et numerum nominis eius stantes supra mare vitreum, habentes citharas Dei. Et cantant Canticum Moysis servi Dei et Canticum Agni dicentes: «Magna et mirabilia opera tua, Domine Deus Omnipotens: iustae et verae viae tuae, Rex gentium. Quis non timebit, Domine, et glorificabit Nomen tuum? Quia solus Sanctus, quoniam omnes gentes venient et adorabunt in conspectu tuo, quoniam iudicia tua manifestata sunt».
'''

[psalm]
cite = "Zsolt 97,1.2-3ab.7-8.9"
response = "Nagy és csodálatos minden műved, mindenható Urunk és Istenünk!"
la_response = "Magna et mirabilia sunt opera tua, Domine Deus omnipotens."
verses = [
'''
Zengjetek az Úrnak új éneket,
csodálatra méltó, amit művelt!
Diadalt aratott jobbjával,
győzelmet Szentséges karjával.
''',
'''
Az Úr megmutatta szabadító erejét,
igazságosságát feltárta a népek előtt.
Emlékezetébe idézte jóságát és hűségét
Izrael népe iránt.
''',
'''
Zúgjon a tenger és mind, ami betölti,
a földkerekség, és akik rajta élnek!
Tapsoljanak a folyamok,
és a hegyek is ujjongjanak az Úr színe előtt!
''',
'''
Mert eljön ítélni a földet, igazságban ítéli az egész világot,
egyenlőképpen minden népet.
''']
la_verses = [
'''
Cantate Domino canticum novum,
quia mirabilia fecit.
