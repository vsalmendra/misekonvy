[alleluia]
cite = "Jel 2,10c"
text = "Légy hű mindhalálig – mondja az Úr, az élet koronáját adom néked!"
la = "Esto fidelis usque ad mortem, dicit Dominus, et dabo tibi coronam vitae."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jézus nevéért gyűlölhetnek minket, de lelkünknek nem árthatnak."
cite = "Lk 21,12-19"
text = '''
Abban az időben Jézus így készítette elő tanítványait a rájuk váró megpróbáltatásokra: „Kezet emelnek rátok, és üldözni fognak benneteket. Kiszolgáltatnak a zsinagógáknak és börtönbe vetnek. Királyok és helytartók elé hurcolnak az én nevemért, azért, hogy tanúságot tegyetek. Véssétek hát szívetekbe: Ne törjétek fejeteket előre, hogyan védekezzetek. Én olyan ékesszólást és bölcsességet adok majd nektek, hogy egyetlen ellenfeletek sem tud ellenállni vagy ellentmondani.

Kiszolgáltatnak benneteket a szülők, testvérek, rokonok és barátok, s közületek némelyeket meg is ölnek. Az én nevemért mindenki gyűlölni fog titeket. De egyetlen hajszál sem vész el a fejetekről. Állhatatossággal őrzitek meg lelketeket.”
'''
la = '''
In illo tempore: Dixit Iesus discipulis suis: «Inicient vobis manus suas et persequentur tradentes in synagogas et custodias, et trahemini ad reges et praesides propter Nomen meum; continget autem vobis in testimonium. Ponite ergo in cordibus vestris non praemeditari quemadmodum respondeatis, ego enim dabo vobis os et sapientiam, cui non poterunt resistere vel contradicere omnes adversarii vestri.

Trademini autem et a parentibus et fratribus et cognatis et amicis, et morte afficient ex vobis, et eritis odio omnibus propter Nomen meum. Et capillus de capite vestro non peribit. In patientia vestra possidebitis animas vestras».
'''

# igenaptár 2026-11-25.
