# The new missal (Római Misekönyv, 3rd ed.), November 25: "Alexandriai Szent Katalin szűz és vértanú — Vértanúk
# miséi: vértanú szűz, 803. o., vagy Szüzek miséi: egy szűz, 825. o." + own collect (p. 752). The martyr virgin's
# common (IV, pp. 803-804). Latin: Missale Romanum 2002, 25 Nov; Commune martyrum IV. Pro virgine martyre.
[[entrance]]
ref = "@vertanuk/vertanu-szuz"
[[entrance]]
ref = "@vertanuk/vertanu-szuz:entrance_b"

[[collect]]
label = "Saját"
source = "Római Misekönyv, 3. kiadás (2021), november 25., 752. o.; latin: Missale Romanum, editio typica tertia (2002), 25 nov."
text = '''
Mindenható, örök Isten,
te Szent Katalin szüzet,
a győzhetetlen vértanút
példaképül állítottad néped elé.
Engedd, hogy az ő közbenjárására
a hitben és az állhatatosságban megerősödjünk,
és az Egyház egységéért fáradhatatlanul
munkálkodjunk.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Omnípotens sempitérne Deus,
qui pópulo tuo beátam Catharínam vírginem
et invíctam mártyrem præstitísti,
concéde, ut, eius intercessióne,
fide et constántia roborémur,
et pro Ecclésiæ unitáte operam tribuámus impénse.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[[collect]]
label = "Közös"
ref = "@vertanuk/vertanu-szuz"

