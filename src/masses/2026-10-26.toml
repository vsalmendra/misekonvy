[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jót mindennap tehetünk: Jézus szombaton is meggyógyítja a beteg asszonyt."
cite = "Lk 13,10-17"
text = '''
Jézus szombatonként a zsinagógában tanított. Volt ott egy asszony, akit a betegség lelke már tizennyolc éve hatalmában tartott. Annyira meggörnyedt, hogy egyáltalán nem tudott felegyenesedni.

Amikor Jézus meglátta, magához hívta, és így szólt hozzá: „Asszony, megszabadultál betegségedtől.” Közben rátette a kezét. Az rögtön felegyenesedett, és dicsőítette az Istent.

A zsinagóga elöljárója méltatlankodott azért, hogy Jézus szombaton gyógyított, és a sokasághoz fordult: „Hat napotok van a munkára. Akkor jöjjetek gyógyulást keresni, ne szombaton!”

Jézus feléje fordult, és megfelelt neki: „Képmutatók! Van-e köztetek egy is, aki nem oldja el a jászoltól ökrét vagy szamarát szombati napon, hogy megitassa? Ábrahámnak ezt a lányát pedig a sátán tartotta megkötözve immár tizennyolc éve. Nem kellett-e őt feloldani kötelékétől akár szombaton is?”

Ellenfelei e szavakra szégyenükben elpirultak. A nép pedig örvendezett, hogy Jézus ilyen csodát művelt.
'''
la = '''
In illo tempore: Erat Iesus docens in una synagogarum sabbatis. Et ecce mulier quae habebat spiritum infirmitatis annis decem et octo, et erat inclinata nec omnino poterat sursum respicere.

Quam cum vidisset Iesus vocavit et ait illi: «Mulier, dimissa es ab infirmitate tua», et imposuit illi manus: et confestim erecta est, et glorificabat Deum.

Respondens autem archisynagogus, indignans quia sabbato curasset Iesus, dicebat turbae: «Sex dies sunt, in quibus oportet operari; in his ergo venite et curamini, et non in die sabbati».

Respondit autem ad illum Dominus et dixit: «Hypocritae, unusquisque vestrum sabbato non solvit bovem suum aut asinum a praesepio et ducit adaquare? Hanc autem filiam Abrahae, quam alligavit Satanas ecce decem et octo annis, non oportuit solvi a vinculo isto die sabbati?»

Et cum haec diceret, erubescebant omnes adversarii eius, et omnis populus gaudebat in universis quae gloriose fiebant ab eo.
'''

