[reading1]
label = "Szentlecke"
sub = "Szent Pál apostolnak az efezusiakhoz írt leveléből"
summary = "Éljünk szeretetben, amint Krisztus is szeretett minket!"
cite = "Ef 4,32–5,8"
la_sub = "Lectio Epistolae beati Pauli apostoli ad Ephesios"
text = '''
Testvéreim!

Legyetek egymás iránt jóindulatúak, könyörületesek, és bocsássatok meg egymásnak, amint Isten is megbocsátott nektek Krisztusban.

Mint Isten kedves gyermekei, legyetek az ő követői, és éljetek szeretetben, ahogy Krisztus is szeretett minket, és odaadta magát értünk Istennek jó illatú áldozati adományként.

Paráznaságról és más tisztátalanságról vagy kapzsiságról szó se essék köztetek! Ez nem illik Krisztus híveihez. Ocsmány, léha vagy kétértelmű szót ne ejtsetek ki! Ez sem illik hozzátok. Ehelyett inkább hálaadással magasztaljátok Istent!

Értsétek meg, és jegyezzétek meg jól magatoknak: Krisztus és Isten országában semmi része sincs annak, aki parázna, tisztátalan vagy kapzsi, és így földi dolgoknak szolgál Isten helyett. Ne engedjétek, hogy hamis beszédekkel a bűn útjára vezessenek titeket! Isten büntetése éri mindazokat, akik nem engedelmeskednek neki. Kerüljétek tehát az ilyen cselekedeteket!

Egykor ti is sötétségben éltetek, de most már eljutottatok a világosságra az Úrban. Úgy éljetek, mint a világosság fiai!
'''
la = '''
Fratres:

Estote invicem benigni, misericordes, donantes invicem sicut et Deus in Christo donavit vobis.

Estote ergo imitatores Dei, sicut filii carissimi, et ambulate in dilectione, sicut et Christus dilexit nos et tradidit se ipsum pro nobis oblationem et hostiam Deo in odorem suavitatis.

Fornicatio autem et omnis immunditia aut avaritia nec nominetur in vobis, sicut decet sanctos, et turpitudo et stultiloquium, aut scurrilitas, quae non decent, sed magis gratiarum actio.

Hoc enim scitote, intellegentes quod omnis fornicator aut immundus aut avarus, id est idolorum cultor, non habet hereditatem in Regno Christi et Dei. Nemo vos decipiat inanibus verbis, propter haec enim venit ira Dei in filios diffidentiae. Nolite ergo effici comparticipes eorum;

eratis enim aliquando tenebrae, nunc autem lux in Domino; ut filii lucis ambulate.
'''

