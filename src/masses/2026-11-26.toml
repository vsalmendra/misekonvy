[alleluia]
cite = "Lk 21,28"
text = "Nézzetek föl, és emeljétek föl fejeteket, mert elérkezett megváltástok ideje."
la = "Respicite et levate capita vestra, quoniam appropinquat redemptio vestra."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jeruzsálem végzete: pogányok tiporják el."
cite = "Lk 21,20-28"
text = '''
Jézus így jövendölt Jeruzsálem pusztulásáról és a saját második eljöveteléről:

Amikor látjátok, hogy Jeruzsálemet hadsereg veszi körül, tudjátok meg, hogy elérkezett a pusztulása! Akkor, akik Júdeában vannak, fussanak a hegyekbe; akik a városban, meneküljenek el; és akik vidéken vannak, vissza ne térjenek! A bosszúállás napjai ezek, hogy beteljesedjék mindaz, amit az írás mond. Jaj, a várandós és szoptatós anyáknak azokban a napokban! Nagy gyötrelem lesz a földön, és az ítélet haragja sújtja ezt a népet. Lesznek, akiket kardélre hánynak. Sokakat fogságba hurcolnak pogány népek közé. Jeruzsálemet pogányok tiporják, amíg idejük be nem telik.

Jelek lesznek a Napban, a Holdban és a csillagokban, a Földön pedig kétségbeesett rettegés támad a népek között a tenger zúgása és a hullámok háborgása miatt. Az emberek megdermednek a rémülettől, miközben várják, hogy mi történik a világgal. A mindenség összetartó erői megrendülnek. Akkor majd meglátják az Emberfiát, amint eljön a felhőkben nagy hatalommal és dicsőséggel.

Amikor mindez beteljesedik, nézzetek fel, és emeljétek föl fejeteket, mert elérkezett megváltásotok.
'''
la = '''
In illo tempore: Dixit Iesus discipulis suis:

«Cum videritis circumdari ab exercitu Ierusalem, tunc scitote quia appropinquavit desolatio eius. Tunc qui in Iudaea sunt, fugiant in montes, et qui in medio eius, discedant, et qui in regionibus, non intrent in eam, quia dies ultionis hi sunt ut impleantur omnia quae scripta sunt. Vae autem praegnantibus et nutrientibus in illis diebus. Erit enim pressura magna super terram et ira populo huic, et cadent in ore gladii et captivi ducentur in omnes gentes, et Ierusalem calcabitur a gentibus, donec impleantur tempora nationum.

Et erunt signa in sole et luna et stellis, et super terram pressura gentium prae confusione sonitus maris et fluctuum, arescentibus hominibus prae timore et exspectatione eorum quae supervenient orbi, nam virtutes caelorum movebuntur. Et tunc videbunt Filium hominis venientem in nube cum potestate et gloria magna.

His autem fieri incipientibus, respicite et levate capita vestra, quoniam appropinquat redemptio vestra».
'''

