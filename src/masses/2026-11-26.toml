# New missal (Római Misekönyv, 3rd ed. 2021), Votív (megemlékező) misék, 5. A Legméltóságosabb Oltáriszentségről,
# pp. 997-998 (white). Latin: Missale Romanum, editio typica tertia (2002), Missae votivae, 5. De sanctissima
# Eucharistia. Prefaces: the book's I. and II. prefáció a Legméltóságosabb Oltáriszentségről (pp. 455-456).
[entrance]
cite = "Zsolt 77,23-25"
text = '''
Megnyitotta az Úr az ég kapuit,
eledelül mannát hullatott nekik,
mennyei kenyeret adott nekik az Úr:
angyalok kenyerét ette az ember.
'''
la = '''
Iánuas cæli apéruit Dóminus,
et pluit illis manna ad manducándum,
et panem cæli dedit eis:
panem angelórum manducávit homo.
'''

[collect]
source = "Római Misekönyv, 3. kiadás (2021), 997. o.; latin: Missale Romanum, editio typica tertia (2002), Missae votivae 5."
text = '''
Istenünk, te az emberek megváltásának művét
egyszülött Fiad húsvéti misztériumával
beteljesítetted.
Add, kérünk, hogy akik Krisztus halálát
és feltámadását a szentségi jelekben
hívő lélekkel ünnepeljük,
üdvözítő kegyelmedben szüntelenül növekedjünk.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Deus, qui humánæ redemptiónis opus
per Unigéniti tui paschále mystérium implevísti,
concéde propítius,
ut, qui Christi mortem et resurrectiónem
in sacramentórum signis annuntiámus fidénter,
salvatiónis tuæ contínuum experiámur augméntum.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

[offertory]
text = '''
Megváltásunk emlékezetét ünnepelve
kérve kérjük, Istenünk,
hogy atyai jóságodnak ez a szentsége
legyen számunkra az egység jele
és a szeretet köteléke.
Krisztus, a mi Urunk által.
'''
la = '''
Salútis nostræ memoriále celebrántes,
cleméntiam tuam, Dómine, supplíciter exorámus,
ut hoc sacraméntum pietátis
fiat nobis signum unitátis et vínculum caritátis.
Per Christum Dóminum nostrum.
'''

[communion]
cite = "Jn 6,51-52"
text = '''
Én vagyok az élő kenyér,
amely a mennyből szállt alá – mondja az Úr:
Ha valaki e kenyérből eszik, örökké él.
A kenyér, amelyet én adok,
az én testem a világ életéért.
'''
la = '''
Ego sum panis vivus, qui de cælo descéndi, dicit Dóminus.
Si quis manducáverit ex hoc pane, vivet in ætérnum;
et panis, quem ego dabo, caro mea est pro mundi vita.
'''

[postcommunion]
text = '''
Kérünk, Istenünk, tégy szentté minket,
akik a mennyei asztalról táplálkoztunk,
hogy Krisztus Teste és Vére mindnyájunkat
igaz testvériségben kössön össze.
Krisztus, a mi Urunk által.
'''
la = '''
Sanctíficet nos, quǽsumus, Dómine,
mensæ cæléstis participátio,
ut, per Corpus et Sánguinem Christi,
fratérnitas cuncta copulétur.
Per Christum Dóminum nostrum.
'''

# Readings: ferial, 34. évközi hét csütörtök, II. év (src/cycle/evkozi-34-4-II.json = igenaptár 2026-11-26).
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Feria quinta, Anno secundo, pp. 549-551
# (OCR corrected by hand; Vulgate numbering).
[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "Isten ítélete elpusztítja a Gonoszság hatalmát, amelyet Babilon és a nagy parázna asszony jelképez. Boldogok, akiket meghív lakomájára Jézus, az Isten Báránya!"
cite = "Jel 18,1-2.21-23;19,1-3.9a"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásomban láttam egy angyalt, amint alászállt az égből. Nagy hatalma volt, és fénye beragyogta a földet. Harsány hangon kiáltotta: „Elesett, elesett a nagy Babilon. Ördögök tanyája lett, minden tisztátalan szellem hajléka, minden tisztátalan lénynek és undok madárnak odúja.”

Ekkor egy erős angyal malomkő nagyságú követ ragadott fel, és a tengerbe dobta e szavakkal: „Ily robajjal dőljön le Babilon, a nagy város, és nyoma se legyen többé! Hárfapengés meg ének, fuvolaszó és harsona ne zengjen többé benned! Ne éljen benned semmilyen mesterség művelője! Ne hallatsszék malomkattogás! Mécses fénye ne villanjon fel benned! Vőlegény és menyasszony ne hallassa szavát! Kereskedőid a föld nagyjai voltak, varázslataid tévútra vezettek minden nemzetet.”

Ezután nagy sereg örömujjongását hallottam a mennyben: „Alleluja! Üdv, dicsőség és hatalom Istenünknek! Igazak és igazságosak ítéletei. Elítélte a nagy parázna asszonyt, aki erkölcstelenségével megrontotta a földet, és számon kérte tőle szolgáinak vérét, amely a kezéhez tapadt.” Majd másodszor is felhangzott: „Alleluja! A bűnös város füstje felszáll örökkön örökké.” Akkor így szólt hozzám az angyal: „Jegyezd fel! Boldogok, akiket meghív menyegzős lakomájára Jézus, az Isten Báránya!”
'''
la = '''
Ego, Ioannes, vidi Angelum descendentem de caelo, habentem potestatem magnam, et terra illuminata est a gloria eius. Et clamavit in forti voce dicens: «Cecidit, cecidit Babylon magna et facta est habitatio daemoniorum et custodia omnis spiritus immundi et custodia omnis bestiae immundae et odibilis».

Et sustulit unus Angelus fortis lapidem quasi molarem magnum et misit in mare dicens: «Impetu sic mittetur Babylon magna illa civitas et ultra iam non invenietur. Et vox citharoedorum et musicorum et tibia canentium et tuba non audietur in te amplius, et omnis artifex omnis artis non invenietur in te amplius, et vox molae non audietur in te amplius, et lux lucernae non lucebit tibi amplius, et vox sponsi et sponsae non audietur in te amplius: quia mercatores tui erant magnates terrae, quia in veneficiis tuis erraverunt omnes gentes».

Post haec audivi quasi vocem magnam turbae multae in caelo dicentium: «Alleluia. Salus et gloria et virtus Deo nostro, quia vera et iusta iudicia eius; quia iudicavit de meretrice magna quae corrupit terram in prostitutione sua, et vindicavit sanguinem servorum suorum de manibus eius». Et iterum dixerunt: «Alleluia. Et fumus eius ascendit in saecula saeculorum». Et dicit mihi: «Scribe: "Beati qui ad cenam nuptiarum Agni vocati sunt"».
'''

