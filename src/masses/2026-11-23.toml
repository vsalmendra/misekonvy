# Readings: ferial, 34. évközi hét hétfő, II. év (src/cycle/evkozi-34-1-II.json = igenaptár 2026-11-23).
# Latin: Missale Romanum cum lectionibus 1977, vol. IV, Feria secunda, Anno secundo, pp. 533-535
# (OCR corrected by hand; Vulgate numbering).
[reading1]
label = "Szentlecke"
sub = "a Jelenések könyvéből"
summary = "János a szentek seregét látja a mennyben, akik Krisztus nevét viselik homlokukon."
cite = "Jel 14,1-3.4b-5"
la_sub = "Lectio libri Apocalypsis beati Ioannis apostoli"
text = '''
Én, János, látomásomban láttam, hogy a Bárány a Sion hegyén állott. Vele volt (az üdvözültek serege), az a száznegyvennégyezer, aki homlokán viselte Jézus nevét és az ő Atyjának nevét.

Szózatot hallottam az égből, mint nagy vizek zúgását és mint erős mennydörgés robaját. A szózat, amelyet hallottam, úgy hangzott, mint amikor a hárfások hárfáikat pengetik. Új éneket énekeltek Isten trónja, a négy élőlény és a vének előtt. Az éneket nem tudta megtanulni senki más, mint az a száznegyvennégyezer, akik meg vannak váltva a földről.

A Bárány nyomában járnak, bárhová megy. Ők a megváltottak az emberek közül, akiket Isten elsőknek választott ki magának és a Báránynak. Ajkukon nincsen hazugság: szeplőtlen tisztán állnak Isten trónja előtt.
'''
la = '''
Ego, Ioannes, vidi, et ecce Agnus stans supra Montem Sion, et cum illo centum quadraginta quattuor milia habentes Nomen eius et Nomen Patris eius scriptum in frontibus suis.

Et audivi vocem de caelo tamquam vocem aquarum multarum et tamquam vocem tonitrui magni, et vox quam audivi sicut citharoedorum citharizantium in citharis suis. Et cantant quasi canticum novum ante thronum et ante quattuor Animalia et Seniores: et nemo poterat discere canticum nisi illa centum quadraginta quattuor milia, qui empti sunt de terra.

Hi qui sequuntur Agnum quocumque abierit. Hi empti sunt ex hominibus primitiae Deo et Agno, et in ore ipsorum non est inventum mendacium: sine macula sunt.
'''

[psalm]
cite = "Zsolt 23,1-4ab.5-6"
response = "Ez az istenkeresők népe, mely látni kívánja arcodat, Urunk."
la_response = "Haec est generatio quaerentium faciem tuam, Domine."
verses = [
'''
Az Úré a föld, és ami betölti,
a földkerekség és minden lakója.
Tengerek fölé ő rakta alapját,
s a vizek árján ő tartja szilárdan.
''',
'''
Ki mehet föl az Úr hegyére,
ki állhat meg az ő szent helyén?
Aki ártatlan kezű, tiszta szívű,
akinek az esze nem jár csaláson.
''',
'''
Az nyer áldást az Úrtól,
és megigazulást üdvözítő Istenétől.
Ez az istenkeresők népe,
amely arcát kutatja Jákob Istenének.
''']
la_verses = [
'''
Domini est terra et plenitudo eius,
orbis terrarum et qui habitant in eo.
Quia ipse super maria fundavit eum,
et super flumina firmavit eum.
''',
'''
Quis ascendet in montem Domini,
aut quis stabit in loco sancto eius?
Innocens manibus et mundo corde,
qui non accepit in vanum nomen eius.
''',
'''
Hic accipiet benedictionem a Domino,
et iustificationem a Deo salutari suo.
Haec est generatio quaerentium eum,
quaerentium faciem Dei Iacob.
''']

[alleluia]
cite = "Mt 24,42a.44"
text = "Virrasszatok és álljatok készen, mert nem tudjátok, hogy az Emberfia mikor érkezik!"
la = "Vigilate et estote parati, quia qua nescitis hora Filius hominis venturus est."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Isten nem az adomány nagyságát, hanem az adakozó lelkét nézi."
cite = "Lk 21,1-4"
text = '''
Jézus egy alkalommal megfigyelte, hogyan dobják a gazdagok adományaikat a templom perselyébe. Közben észrevette, hogy egy szegény özvegyasszony két fillért dobott be. Erre megjegyezte: „Bizony, mondom nektek, ez a szegény özvegy többet dobott be, mint bárki más. A többiek ugyanis abból adakoztak, amiben bővelkednek, ez azonban mindent odaadott, ami szegénységéből telt: egész megélhetését.”
'''
la = '''
In illo tempore: Respiciens Iesus vidit eos qui mittebant munera sua in gazophylacium divites. Vidit autem quamdam viduam pauperculam mittentem illuc minuta duo, et dixit: «Vere dico vobis: Vidua haec pauper plus quam omnes misit. Nam omnes hi ex abundantia sua miserunt in munera, haec autem ex inopia sua omnem victum suum quem habebat misit».
'''

