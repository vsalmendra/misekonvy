[[collect]]
label = "Saját"
source = "Római Misekönyv, 3. kiadás (2021), november 23.; latin: Missale Romanum, editio typica tertia (2002), 23 nov."
text = '''
Szentjeid erőssége, mindenható, örök Isten,
add, hogy örvendező lélekkel üljük meg
Szent Kelemen pápa emléknapját.
Ő Fiad papja és vértanúja volt:
amit a szent áldozatban cselekedett,
azt vére ontásával tanúsította,
amit ajkával hirdetett, azt példájával is megerősítette.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Omnípotens sempitérne Deus,
qui in ómnium sanctórum tuórum es virtúte mirábilis,
da nobis in beáti Cleméntis ánnua commemoratióne lætári,
qui, Fílii tui sacérdos et martyr,
quod mystério gessit, testimónio comprobávit,
et, quod prædicávit ore, confirmávit exémplo.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

