label = "Saját"
source = "Római Misekönyv, 3. kiadás (2021), november 16., 746. o.; latin: Missale Romanum, editio typica tertia (2002), 16 nov."
text = '''
Irgalmas Istenünk,
te Szent Margit szívébe
igen nagy szeretetet adtál a szegények iránt.
Közbenjárására add, hogy példája szerint éljünk,
és bennünk a te jóságodat ismerjék fel az emberek.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Deus, qui beátam Margarítam
exímia in páuperes caritáte mirábilem effecísti,
da, ut, eius intercessióne et exémplo,
imáginem bonitátis tuæ inter hómines referámus.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''

