[entrance]
cite = "Vö. Gal 6,14"
source = "Római Misekönyv 1991 (PPEK 335), szeptember 14., 594. o."
text = '''
Nekünk a mi Urunk, Jézus Krisztus keresztjében kell dicsekednünk,
abban van üdvösségünk, életünk és feltámadásunk,
az váltott meg és szabadított meg minket.
'''
la = '''
Nos autem gloriari oportet
in cruce Domini nostri Iesu Christi,
in quo est salus, vita et resurrectio nostra,
per quem salvati et liberati sumus.
'''

[collect]
source = "Római Misekönyv 1991 (PPEK 335), szeptember 14., 594-595. o."
text = '''
Istenünk, te azt akartad, hogy egyszülött Fiad
a kereszten váltsa meg az emberiséget.
Add, hogy mi,
akik megismertük szeretetének titkát itt a földön,
elnyerjük az üdvösséget a mennyben.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
la = '''
Deus, qui Unigenitum tuum crucem subire voluisti,
ut salvum faceret genus humanum,
praesta, quaesumus,
ut, cuius mysterium in terra cognovimus,
eius redemptionis praemia in caelo consequi mereamur.
Per Dominum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitate Spiritus Sancti,
Deus, per omnia saecula saeculorum.
'''

[offertory]
source = "Római Misekönyv 1991 (PPEK 335), szeptember 14., 595. o."
text = '''
Kérünk, Istenünk,
tisztítson meg minket minden bűnünktől ez az áldozat,
mely a kereszt oltárán az egész világ vétkét eltörölte.
Krisztus, a mi Urunk által.
'''
la = '''
Haec oblatio, Domine, quaesumus,
ab omnibus nos purget offensis,
quae in ara crucis totius mundi tulit offensam.
Per Christum Dominum nostrum.
'''

[communion]
cite = "Jn 12,32"
source = "Római Misekönyv 1991 (PPEK 335), szeptember 14., 595. o."
text = '''
Ha majd fölemelnek a földről,
mindenkit magamhoz vonzok – mondja az Úr.
'''
la = '''
Ego si exaltatus fuero a terra,
omnes traham ad meipsum, dicit Dominus.
'''

[postcommunion]
source = "Római Misekönyv 1991 (PPEK 335), szeptember 14., 595. o."
text = '''
Szent asztalodról tápláltál minket, Urunk, Jézus Krisztus.
Kérve kérünk,
hogy akiket életadó kereszted által megváltottál,
vezesd el azokat a feltámadás dicsőségére.
Aki élsz és uralkodol mindörökkön örökké.
'''
la = '''
Refectione tua sancta enutriti,
Domine Iesu Christe, supplices deprecamur,
ut, quos per lignum crucis vivificae redemisti,
ad resurrectionis gloriam perducas.
Qui vivis et regnas in saecula saeculorum.
'''

# Readings: of the day (30. évközi hét péntek, II. év), from src/cycle/evkozi-30-5-II.json (igenaptár).
[reading1]
label = "Szentlecke"
sub = "Szent Pál apostolnak a filippiekhez írt leveléből"
summary = "Isten, aki meghívott minket az üdvösségre, közreműködésünkkel fogja azt bennünk teljessé tenni."
cite = "Fil 1,1-11"
la_sub = "Initium Epistolae beati Pauli apostoli ad Philippenses"
text = '''
Testvéreim!

Jézus Krisztus szolgái: Pál és Timóteus (üdvözletüket küldik) Jézus Krisztus híveinek, az elöljáróknak és a diakónusoknak, akik Filippiben élnek.

Kegyelem nektek és békesség Atyánktól, az Istentől, és Urunktól, Jézus Krisztustól!

Hálát adok Istennek, valahányszor rátok gondolok. Mindig, minden imádságomban örömmel emlékezem meg mindnyájatokról, mert az első naptól mindmáig közösséget vállaltatok az evangéliummal. Ezért bízom benne, hogy aki megkezdte bennetek a jót, Krisztus Jézus napjára be is fejezi.

Méltányos is, hogy így gondolkodjam mindnyájatokról, mert szívembe zártalak titeket. Hiszen mindnyájan osztoztok velem a kegyelemben: akkor is, amikor bilincseket viselek, és akkor is, amikor az evangéliumot védelmezem és erősítem.

Isten a tanúm, mennyire vágyakozom mindnyájatok után Krisztus Jézus szeretetében. Könyörgök is azért, hogy szeretetetek egyre jobban gyarapodjék a helyes ismeretben és a teljes megértésben, hogy el tudjátok dönteni, mi a helyes.

Akkor tiszták és feddhetetlenek lesztek Krisztus napjára, és bővelkedni fogtok az igaz élet gyümölcseiben, amelyeket Jézus Krisztus szerzett, Isten dicsőségére és tiszteletére.
'''
la = '''
—

Paulus et Timotheus, servi Christi Iesu, omnibus sanctis in Christo Iesu qui sunt Philippis cum episcopis et diaconis:

gratia vobis et pax a Deo Patre nostro et Domino Iesu Christo.

Gratias ago Deo meo in omni memoria vestri, semper in omni oratione mea pro omnibus vobis cum gaudio deprecationem faciens, super communione vestra in Evangelio a prima die usque nunc, confidens hoc ipsum, quia qui coepit in vobis opus bonum perficiet usque in diem Christi Iesu;

sicut est mihi iustum hoc sentire pro omnibus vobis eo quod habeam in corde vos, et in vinculis meis et in defensione et confirmatione Evangelii socios gratiae meae omnes vos esse.

Testis enim mihi Deus, quomodo cupiam omnes vos in visceribus Christi Iesu. Et hoc oro, ut caritas vestra magis ac magis abundet in scientia et omni sensu, ut probetis potiora,

ut sitis sinceri et sine offensa in diem Christi, repleti fructu iustitiae, qui est per Iesum Christum, in gloriam et laudem Dei.
'''

[psalm]
cite = "Zsolt 110,1-2.3-4.5-6"
response = "Urunk és Istenünk, mily nagyszerűek a te műveid!"
la_response = "Magna sunt opera Domini."
