date = "2026-10-30"
title = "Votív mise a szent keresztről"
day = "30. évközi hét péntekje"
rank = "piros színben"
gloria = false
creed = false
eucharistic_prayer = 1
prefaces = ["kereszt", "szenvedes-1"]
