[alleluia]
cite = "Jn 10,27"
text = "Jézus mondja: „Juhaim hallgatnak szavamra; ismerem őket, és ők a nyomomban járnak.”"
la = "Oves meae vocem audiunt, dicit Dominus, et ego cognosco eas, et sequuntur me."

[gospel]
book = "Szent Lukács"
la_book = "Lucam"
summary = "Jézus ura a szombatnak."
cite = "Lk 14,1-6"
text = '''
Az egyik szombaton Jézus betért egy vezető farizeus házába, hogy nála étkezzék. Az ott tartózkodók figyelték őt.

Akkor eléje állt egy vízkóros ember. Jézus megkérdezte a törvénytudókat és farizeusokat: „Szabad-e szombaton gyógyítani?” De azok nem válaszoltak. Erre ő megérintette a beteget, meggyógyította és elbocsátotta.

Azután a jelenlevőkhöz fordult: „Ha valamelyiktek szamara vagy ökre szombaton kútba esik, nem húzza-e ki azonnal?” Azok semmit sem tudtak felelni neki.
'''
la = '''
In illo tempore: Factum est, cum intraret Iesus in domum cuiusdam principis Pharisaeorum sabbato manducare panem, et ipsi observabant eum.

Et ecce homo quidam hydropicus erat ante illum. Et respondens Iesus dixit ad Legis peritos et Pharisaeos dicens: «Licet sabbato curare an non?» At illi tacuerunt. Ipse vero apprehensum sanavit eum ac dimisit.

Et ad illos dixit: «Cuius vestrum filius aut bos in puteum cadet, et non continuo extrahet illum die sabbati?» Et non poterant ad haec respondere illi.
'''

