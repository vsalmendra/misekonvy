  "Add, Urunk, hogy Szentatyánk, püspökeink, papjaink és a szerzetesek a Szent Szűz alázatos lelkületével teljesítsék hivatásukat!",
  "Mutasd meg, Urunk, a világnak, hogy beteljesedett már a prófétai szó, és velünk az Isten!",
  "Erősíts meg minket, Urunk, hogy jó- és balsorsban egyaránt valljuk: „Legyen meg a te akaratod!”",
  "Oltsd lelkünkbe, Urunk, kegyelmedet, hogy Gyümölcsoltó Boldogasszony közbenjárására mi is a jó cselekedetek méltó gyümölcsét teremjük!",
  "Add, Urunk, hogy a szomorkodók és a betegek Isten Boldogságos Anyjánál vigasztalást nyerjenek!",
]
conclusion = "Urunk, Jézus Krisztus, aki érettünk emberi testet öltöttél, add, hogy megtestesülésed szent titka által eljussunk hozzád, a mi Istenünkhöz! Aki élsz és uralkodol mindörökkön örökké."

