seen = "2027-03-19"
intro = "Testvéreim! Szent Józsefnek, a Szent Család gondviselőjének (a munkás élet eszményképének) ünnepén terjesszük kéréseinket mennyei Atyánk elé!"
response = "Kérünk téged, hallgass meg minket!"
petitions = [
  "Szent József közbenjárására oltalmazd meg, Urunk, Egyházadat az egész világon!",
  "Az emberiség vezetői Szent József bölcsességével gondoskodjanak a népek nagy családjáról!",
  "A názáreti otthon békéje és meghitt öröme töltse el családjaink életét!",
  "Szent József hite, egyszerűsége és Istenbe vetett bizalma legyen a családapák eszményképe!",
  "Szent József követésével szenteljük meg mindennapi munkás életünket!",
]
conclusion = "Istenünk! Te Szent Józsefet példaképül adtad nekünk a családi élet megszentelésére. Add, hogy a mi fáradozásunk is a te dicsőségedre, családunk és embertársaink javára váljék! Krisztus, a mi Urunk által."

