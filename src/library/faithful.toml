# Prayer-of-the-faithful sets for categories and feasts (igenaptár's numbered "Egyetemes könyörgések" sets), saved
# 2026-11-24 from igenaptar.katolikus.hu (the pages of 2026-06 … 2027-11; the dates in `seen` are where each was
# found). Texts are verbatim, with "N." left in. Use in a Mass with
#     [[faithful]]
#     ref = "@faithful/vertanuk"
# (add `label = "..."` for the dot's name). Not found on igenaptár in that period: sets 1, 2, 11, 17, 22, 28, 35.

[urunk-bemutatasa]
number = 3
title = "Urunk Bemutatása Ünnepére (Gyertyaszentelő Boldogasszony)"
seen = "2027-02-02"
intro = "Kérjük, testvéreim, hogy a mi Urunkban, Jézus Krisztusban minden ember felismerje a világ Világosságát!"
response = "Kérünk téged, hallgass meg minket!"
petitions = [
  "Urunk, Jézus Krisztus: add, hogy a szentmiseáldozatban – Simeonhoz hasonlóan – találkozhassunk veled, és felismerjünk téged!",
  "Urunk, Jézus Krisztus: add világosságodat Egyházadnak, és add, hogy híveid az isteni élet fényében járjanak!",
  "Urunk, Jézus Krisztus: egyesítsd népedet Szentlelked erejével, és adj neki békességet!",
  "Urunk, Jézus Krisztus: add kegyelmedet, hogy minél több szülő nevelje gyermekét az evangélium világosságának terjesztésére!",
  "Urunk, Jézus Krisztus: add meg nekünk, hogy életünk végén találkozhassunk veled, és a mennyben örökre láthassuk fényességedet!",
]
conclusion = "Gyújtsd fel, Urunk, szívünkben istenséged ismeretének tiszta világosságát, hogy mindig tetszésed szerint éljünk! Mert te vagy lelkünk és testünk megvilágosítója; Krisztus, a mi Istenünk. Téged dicsőítünk Atyáddal és éltető Lelkeddel együtt most és mindörökkön örökké. (A gör. kat. Liturgikonból.)"

[szent-jozsef]
