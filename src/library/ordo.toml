<p>Szabadíts meg, kérünk, Urunk, minden gonosztól; adj kegyesen békét napjainkban, hogy irgalmadból mindenkor bűn és baj nélkül éljünk, míg reménykedve várjuk az örök boldogságot és Üdvözítőnknek, Jézus Krisztusnak dicsőséges eljöttét.</p>
<p class="resp">Mert tiéd az ország, a hatalom és a dicsőség mindörökkön-örökké. Ámen.</p>
