# Szűz Mária közös miséi (Commune beatae Mariae Virginis).
# Hungarian: Római Misekönyv, 1991 Hungarian edition (PPEK 335, Misekonyv_1.pdf), "Szűz Mária miséi",
# pp. 652-659 ("Az alábbi szövegeket mondjuk Szűz Mária szombatján és a Boldogságos Szűz Mária votív
# miséiben."). Formulas 1-3 carry no season (= Tempore per annum); 4 Advent, 5 Christmas, 6 Eastertime,
# then "Egyéb könyörgések". Only formula 1 stored so far (pp. 652-653).
# Formula 1: checked against the new missal and the Missale Romanum 2002 on 2026-11-14 (see its comment);
# its collect_b is the 1991 "Vagy:" — the new missal has no second collect in formula 1.
# Latin (<key>_la): Missale Romanum cum lectionibus 1977, vol. IV, Commune beatae Mariae Virginis 1,
# pp. 800-801 (archive.org, OCR corrected by hand; no accents; "Per Dominum." / "Per Christum." expanded).
# collect_b = the "Vagy:" of the book (not used: only the first prayer is taken).
# Preface: "a Boldogságos Szűz Máriáról I. (votív misékben: és amikor tiszteljük a Boldogságos, mindenkor
# Szűz Máriát), vagy II." -> prefaces.toml maria-1 / maria-2; the Mass file fills maria-1's "N." with
# `names` / `la_names`.

[1]
# Hungarian: the new missal (Római Misekönyv, 3rd ed. 2021), Szűz Mária miséi, I. Évközi időben, 1,
# pp. 776-777 (checked 2026-11-14). Latin: Missale Romanum, editio typica tertia (2002), Commune beatae
# Mariae Virginis, I. Tempore "per annum", 1. offertory = the new missal's first prayer (= MR 2002
# "Suscipe"); offertory_b = its "Vagy" (the 1991 edition's only one; Latin: 1977, p. 800 "Unigeniti").
entrance_cite = "Sedulius"
entrance = '''
Üdvöz légy, Szűzanya! Te szülted a Királyt,
aki az ég és a föld Ura mindörökkön örökké.
'''
collect = '''
Engedd, kérünk, Úristen, hogy mi, a te szolgáid,
folytonos lelki és testi jólétnek örvendhessünk,
és a Boldogságos, mindenkor Szűz Máriának
dicsőséges közbenjárására a jelen szomorúságtól megszabaduljunk,
és örökké tartó örömet élvezzünk.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
collect_b = '''
Urunk, Istenünk, bocsásd meg irgalmasan vétkeinket,
hogy akik saját érdemeinkkel nem dicsekedhetünk,
Fiad szülőanyjának,
a Boldogságos Szűz Máriának közbenjárására üdvözüljünk.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
offertory = '''
Kérünk, Urunk, Istenünk,
fogadd el néped könyörgését
és felajánlott áldozati adományait,
hogy a Boldogságos Szűz Máriának,
Fiad Szülőanyjának közbenjárására
senkinek se legyen eredménytelen az imádsága
és meghallgatás nélküli a kérése.
Krisztus, a mi Urunk által.
'''
offertory_b = '''
Urunk, Istenünk, segítsen minket szent Fiad,
aki emberré lett és Szűztől született.
Ő, aki édesanyjának szűzi épségét nem vette el,
hanem inkább megszentelte, szabadítson meg gyarlóságainktól,
és tegye kedvessé előtted áldozatunkat.
Aki él és uralkodik mindörökkön örökké.
'''
communion_cite = "Vö. Lk 11,27"
communion = '''
Boldog a te méhed, Szűz Mária,
amely magában hordozta az örök Atya Fiát.
'''
postcommunion = '''
Urunk, Istenünk,
magunkhoz vettük az égi kenyeret.
Kérjük kegyelmedet,
hogy akik Szűz Máriát örvendezve ünnepeljük,
őt követve mi is méltók legyünk
a megváltás művét szolgálni.
Krisztus, a mi Urunk által.
'''

entrance_la = '''
Salve, sancta parens, eníxa puérpera Regem,
qui cælum terrámque regit in sǽcula sæculórum.
'''
collect_la = '''
Concéde nos fámulos tuos, quǽsumus, Dómine Deus,
perpétua mentis et córporis sanitáte gaudére,
et, gloriósa beátæ Maríæ semper Vírginis intercessióne,
a præsénti liberári tristítia, et ætérna pérfrui lætítia.
Per Dóminum nostrum Iesum Christum, Fílium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''
collect_b_la = '''
Famulorum tuorum, quaesumus, Domine, delictis ignosce,
ut, qui tibi placere de actibus nostris non valemus,
Genetricis Filii tui Domini nostri intercessione salvemur.
Per Dominum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitate Spiritus Sancti,
Deus, per omnia saecula saeculorum.
'''
offertory_la = '''
Súscipe, quǽsumus, Dómine,
preces pópuli tui cum oblatiónibus hostiárum,
ut, intercedénte beáta María, Fílii tui Genetríce,
nullíus sit írritum votum,
nullíus sit vácua postulátio.
Per Christum Dóminum nostrum.
'''
# The 1977 Latin ends "Per Christum."; the Hungarian "Aki él és uralkodik mindörökkön örökké."
offertory_b_la = '''
Unigeniti tui, Domine, nobis succurrat humanitas,
ut, qui natus de Virgine
Matris integritatem non minuit sed sacravit,
a nostris nos piaculis exuens,
oblationem nostram tibi reddat acceptam.
Per Christum Dominum nostrum.
'''
communion_la = '''
Beáta víscera Maríæ Vírginis,
quæ portavérunt ætérni Patris Fílium.
'''
postcommunion_la = '''
Suméntes, Dómine, cæléstia sacraménta,
quǽsumus cleméntiam tuam,
ut, qui de beátæ Vírginis Maríæ commemoratióne lætámur,
eiúsdem Vírginis imitatióne,
redemptiónis nostræ mystério
digne valeámus famulári.
Per Christum Dóminum nostrum.
'''
