# Vértanúk miséi (Commune martyrum). Only B. Egy vértanú, 1 so far.
# Hungarian: the new missal (Római Misekönyv, 3rd ed. 2021), Vértanúk miséi, B. Egy vértanú, 1, pp. 794-795
# (checked 2026-11-23; the 1991 edition had the same collect and offertories; the new one adds the second
# entrance antiphon and the second communion antiphon and has another prayer after communion).
# Latin: Missale Romanum, editio typica tertia (2002), Commune martyrum, I. Extra tempus paschale, B. Pro uno
# martyre, 1 (accents kept). "<key>_b" = the book's "Vagy / Vel". "Szent N." / "N." is filled per Mass via
# `names` / `la_names` (Latin: accusative "beátum N.", nominative "sanctus N.", genitive "tui N.").

[egy-vertanu-1]
entrance = '''
Ez a szent halálig küzdött Istenének törvényéért,
nem félt a gonoszok szavától,
mert életének alapja szilárd kőszikla volt.
'''
entrance_la = '''
Iste sanctus pro lege Dei sui certávit usque ad mortem,
et a verbis impiórum non tímuit;
fundátus enim erat supra firmam petram.
'''
entrance_b_cite = "Vö. Bölcs 10,12"
entrance_b = '''
A kemény viadalban neki juttatta az Úr a győzelmet,
hogy belássa: a bölcsesség hatalmasabb mindennél.
'''
entrance_b_la = '''
Certámen forte dedit illi Dóminus,
ut víncere sciret,
quóniam ómnium poténtior est sapiéntia.
'''
collect = '''
Mindenható, irgalmas Istenünk,
te Szent N. vértanúnak erőt adtál,
hogy bátor lélekkel kitartson a szenvedés gyötrelmei között.
Dicsőséges vértanúságának napján kérünk,
oltalmazz és segíts győzelemre minket
az ellenség minden cselvetésével szemben.
A mi Urunk, Jézus Krisztus, a te Fiad által,
aki veled él és uralkodik a Szentlélekkel egységben,
Isten mindörökkön örökké.
'''
collect_la = '''
Omnípotens et miséricors Deus,
qui mártyrem tuum beátum N.
passiónis suæ torménta superáre fecísti,
concéde, ut, qui eius triúmphi diem celebrámus,
insuperábiles tua protectióne ab hostis insídiis maneámus.
Per Dóminum nostrum Iesum Christum, Filium tuum,
qui tecum vivit et regnat in unitáte Spíritus Sancti,
Deus, per ómnia sǽcula sæculórum.
'''
offertory = '''
Kérünk, Urunk, Istenünk, áldásoddal
szenteld meg ezeket az áldozati adományokat,
és gyújtsd fel bennünk is szeretetednek tüzét,
amely által Szent N. úrrá lett minden testi gyötrelmen.
Krisztus, a mi Urunk által.
'''
offertory_la = '''
Obláta múnera, quǽsumus, Dómine,
tua benedictióne sanctífica,
quæ, te donánte, nos illa flamma tuæ dilectiónis accéndat,
per quam sanctus N. torménta sui córporis univérsa devícit.
Per Christum Dóminum nostrum.
'''
offertory_b = '''
Kérünk, Urunk, Istenünk,
fogadd jó szívvel ezeket az adományokat,
amelyeket Szent N. vértanúd emlékezetére hoztunk színed elé.
Legyenek kedvesek Fölséged előtt,
ahogy az ő kiomló vérét is értékes áldozatul fogadtad.
Krisztus, a mi Urunk által.
'''
offertory_b_la = '''
Accépta tibi sint, quǽsumus, Dómine, múnera,
quæ in commemoratióne beáti mártyris tui N. deférimus,
ut eo maiestáti tuæ sint plácita,
sicut illíus effúsio sánguinis apud te éxstitit pretiósa.
Per Christum Dóminum nostrum.
'''
communion_cite = "Vö. Mt 16,24"
communion = '''
Aki követni akar, tagadja meg önmagát,
vegye fel keresztjét és kövessen engem – mondja az Úr.
'''
communion_la = '''
Qui vult veníre post me, ábneget semetípsum,
et tollat crucem suam, et sequátur me, dicit Dóminus.
'''
communion_b_cite = "Mt 10,39"
communion_b = '''
Így szól az Úr: aki elveszíti az életét énértem,
megtalálja azt.
'''
communion_b_la = '''
Qui perdíderit ánimam suam propter me, dicit Dóminus,
invéniet eam in ætérnum.
'''
postcommunion = '''
Kérünk, Urunk, Istenünk, hogy a magunkhoz vett
szent misztériumok adják meg nekünk is
azt a lelki erőt, amely Szent N. vértanúdat
szolgálatodban hűségessé,
a szenvedésben pedig diadalmassá tette.
Krisztus, a mi Urunk által.
'''
postcommunion_la = '''
Præstent nobis, quǽsumus, Dómine,
sacra mystéria quæ súmpsimus
eam ánimi fortitúdinem,
quæ beátum N. mártyrem tuum
réddidit in tuo servítio fidélem et in passióne victórem.
Per Christum Dóminum nostrum.
'''
