Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert a te jóságodból ünnepeljük a mai napon a dicsőség városát, a mennyei Jeruzsálemet, mely anyánk és végső célunk, hol megdicsőült testvéreink kórusa mindörökké magasztal téged.

Mi valamennyien, akik a hit fényében a földi élet zarándokútját járjuk, nagy buzgósággal törekszünk e szent városba, és örvendünk, hogy az Egyház tagjait ilyen dicsőség várta, s hogy gyarló embervoltunknak a szentekben adtál pártfogót és példaképet.

