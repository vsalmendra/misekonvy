# Prefaces. Plain text: paragraphs separated by blank lines; optional "sub" = the preface's theme line.
# Every Mass offers its own suggested prefaces first, then always ep2 and ep4 (added by the build).
# Singing aids of the printed missal are stripped (capitals, dashes, "(Mert)", "(És)", "(énekeljük:)" ...).

[angyalok]
la_label = "Praefatio de Angelis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Et in Archángelis Angelísque tuis tua præcónia non tacére, quia ad excelléntiam tuam recúrrit et glóriam quod angélica creatúra tibi probábilis honorétur:

et, cum illa sit amplo decóre digníssima, tu quam sis imménsus et super ómnia præferéndus osténderis, per Christum Dóminum nostrum.

Per quem multitúdo Angelórum tuam célebrat maiestátem, quibus adorántes in exsultatióne coniúngimur, una cum eis laudis voce clamántes:
'''
label = "Prefáció az angyalokról"
source = "Római Misekönyv, az angyalok prefációja"
sub = "Az angyalok tisztelete Isten dicsőségére szolgál"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mi angyalaidban és főangyalaidban is téged áldunk; a te nagyságodnak és dicsőségednek hódolunk, amikor teremtményeidet, a hozzád hűséges angyalokat tiszteljük.

Bár őket is nagy tisztelet illeti, te végtelenül nagyobb vagy náluk; így mindennél fölségesebbnek vallunk téged, Krisztus, a mi Urunk által.

Az angyali seregek őáltala mondanak néked áldást, és téged imádva mi is lelkesen hozzájuk társulunk, velük együtt dicsérünk, és hálás szívvel mondjuk:
'''

[ep2]
la_label = "Praefatio Precis eucharisticæ II"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi, sancte Pater, semper et ubíque grátias ágere per Fílium dilectiónis tuæ Iesum Christum,

Verbum tuum per quod cuncta fecísti: quem misísti nobis Salvatórem et Redemptórem, incarnátum de Spíritu Sancto et ex Vírgine natum. Qui voluntátem tuam adímplens et pópulum tibi sanctum acquírens exténdit manus cum paterétur, ut mortem sólveret et resurrectiónem manifestáret.

Et ídeo cum Angelis et ómnibus Sanctis glóriam tuam prædicámus, una voce dicéntes:
'''
label = "A II. eucharisztikus ima saját prefációja"
source = "Római Misekönyv, II. eucharisztikus ima"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk, Szentséges Atyánk, néked szeretett Fiad, Jézus Krisztus által.

A te örök Igéd ő, általa alkottál mindent, és őt küldted, hogy Üdvözítőnk és Megváltónk legyen: ezért öltött a Szentlélektől testet, és született a Szent Szűztől. Majd akaratodat teljesítve, és szent népet szerezve néked, a keresztfán kitárt karral elszenvedte a kínhalált, hogy feloldja a halálnak átkát, és a feltámadásról bizonyságot adjon nékünk.

Ezért az angyalokkal és minden szenteddel együtt dicsőségedet hirdetjük, és egy szívvel mondjuk:
'''

[ep4]
la_label = "Praefatio Precis eucharisticæ IV"
la = '''
Vere dignum est tibi grátias ágere, vere iustum est te glorificáre, Pater sancte, quia unus es Deus vivus et verus,

qui es ante sǽcula et pérmanes in ætérnum, inaccessíbilem lucem inhábitans; sed et qui unus bonus atque fons vitæ cuncta fecísti, ut creatúras tuas benedictiónibus adimpléres multásque lætificáres tui lúminis claritáte.

Et ídeo coram te innúmeræ astant turbæ angelórum, qui die ac nocte sérviunt tibi et, vultus tui glóriam contemplántes, te incessánter gloríficant.

Cum quibus et nos et, per nostram vocem, omnis quæ sub cælo est creatúra nomen tuum in exsultatióne confitémur, canéntes:
'''
label = "A IV. eucharisztikus ima saját prefációja"
source = "Római Misekönyv, IV. eucharisztikus ima"
text = '''
Valóban méltó, hogy neked hálát adjunk, valóban igazságos, hogy dicsőítsünk, szentséges Atyánk, téged, mert egyedül te vagy az igaz és élő Isten.

Te minden időt megelőzve létezel, mindörökre megmaradsz, és megközelíthetetlen fényben rejtezel. Te, egyetlen jóság és minden élet forrása, azért alkottál mindent, hogy teremtményeidet áldásoddal áraszd el, és mindenkit boldogíts világosságod fénye által.

Az angyalok számtalan serege ezért áll színed előtt, éjjel-nappal szolgál néked, és arcod dicsőségét szemlélve szüntelenül dicsér téged.

Velük együtt mi is, és szavunk által minden teremtmény a világon, ujjongva áldja szent neved és mondja:
'''

[szentek-1]
la_label = "Praefatio I de Sanctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Qui in Sanctórum concílio celebráris, et eórum coronándo mérita tua dona corónas. Qui nobis eórum conversatióne largíris exémplum, et communióne consórtium, et intercessióne subsídium; ut, tantis téstibus confirmáti, ad propósitum certámen currámus invícti et immarcescíbilem cum eis corónam glóriæ consequámur, per Christum Dóminum nostrum.

Et ídeo cum Angelis et Archángelis, cumque multíplici congregatióne Sanctórum, hymnum laudis tibi cánimus, sine fine dicéntes:
'''
label = "Prefáció a szentekről I."
source = "Római Misekönyv 1991 (PPEK 335), 64. prefáció, 395. o. – az új misekönyvvel még nem egyeztetve"
sub = "A szentek és hívek dicsősége"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Kit szentjeidnek serege áld és ünnepel, mert megkoronázod bennük a kegyelmedből szerzett érdemet. Az ő szent életük példakép számunkra, s mert egy családba tartozunk, közbenjárnak értünk nálad: hogy felbátorodva tanúságtételük által, az előttünk álló pályát győzelmesen fussuk végig, és hervadhatatlan koszorút nyerjünk velük együtt Krisztus, a mi Urunk által.

Ezért, miként az angyalok és főangyalok, a szentek hatalmas seregével együtt dicséreted himnuszát zengjük, és vég nélkül mondjuk:
'''

[szentek-2]
la_label = "Praefatio II de Sanctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

Tu enim Sanctórum tuórum confessióne mirábili Ecclésiam tuam nova semper virtúte fecúndas, nobísque certíssima præbes tuæ dilectiónis indícia. Sed étiam, ad mystéria salútis implénda, et ipsórum insígni incitámur exémplo et pia intercessióne perpétuo commendámur.

Unde et nos, Dómine, cum Angelis et Sanctis univérsis tibi confitémur, in exsultatióne dicéntes:
'''
label = "Prefáció a szentekről II."
source = "Római Misekönyv 1991 (PPEK 335), 65. prefáció, 396. o. – az új misekönyvvel még nem egyeztetve"
sub = "A szentek közbenjárnak értünk"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert szentjeidnek példás élete által az Anyaszentegyházat újra meg újra csodás termékenységgel áldod meg, és így bizonyságot teszel arról, hogy mennyire szeretsz és pártolsz minket. S hogy üdvösségünk szent titka valóra váljék bennünk, a szentek nagyszerű példája sarkall minket, de imádsággal is közbenjárnak értünk, jóságod mindenkor kérve.

Ezért, Urunk, az angyalokkal és a szentekkel együtt magasztalunk téged, és ujjongva mondjuk:
'''

[lelkipasztorok]
label = "Prefáció a lelkipásztorokról"
source = "Római Misekönyv 1991 (PPEK 335), 67. prefáció, 398. o. – az új misekönyvvel még nem egyeztetve"
la_label = "Praefatio de sanctis Pastoribus"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

Quia sic tríbuis Ecclésiam tuam sancti N. festivitáte gaudére, ut eam exémplo piæ conversatiónis corróbores, verbo prædicatiónis erúdias, gratáque tibi supplicatióne tueáris.

Et ídeo, cum Angelórum atque Sanctórum turba, hymnum laudis tibi cánimus, sine fine dicéntes:
'''
sub = "A szent lelkipásztorok tevékenysége az Egyházban"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

Mert megadod Egyházadnak, hogy örvendezzék Szent N. ünnepén, és erősödjék buzgóságának példája láttán; igehirdetésével oktatod, és előtted kedves közbenjárására óvod és véded népedet.

Mi ezért az angyalok és szentek kórusával együtt dicséreted himnuszát zengjük, és vég nélkül mondjuk:
'''

[megholtak-1]
la_label = "Praefatio I de defunctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

In quo nobis spes beátæ resurrectiónis effúlsit, ut, quos contrístat certa moriéndi condício, eósdem consolétur futúræ immortalitátis promíssio. Tuis enim fidélibus, Dómine, vita mutátur, non tóllitur, et, dissolúta terréstris huius incolátus domo, ætérna in cælis habitátio comparátur.

Et ídeo cum Angelis et Archángelis, cum Thronis et Dominatiónibus, cumque omni milítia cæléstis exércitus, hymnum glóriæ tuæ cánimus, sine fine dicéntes:
'''
label = "Prefáció a megholtakról I."
source = "Római Misekönyv 1991 (PPEK 335), 75. prefáció, 406. o. – az új misekönyvvel még nem egyeztetve"
sub = "Krisztus a boldog feltámadás reménye"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

A boldog feltámadás reménye benne ragyogott föl nékünk, és így, bár megszomorít a halál kényszere, az ígért örök élet megvigasztal minket. Mert híveid élete, Urunk, megváltozik, de meg nem szűnik, és amikor halandó testünk enyészetnek indul, lelkünket a mennyben örök otthon várja.

Ezért mi is, miként az angyalok és főangyalok, a trónod körül álló hatalmas égi szellemek, és minden seregek a mennyben, dicsőséged himnuszát zengjük, és velük együtt vég nélkül mondjuk:
'''

[megholtak-2]
la_label = "Praefatio II de defunctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

Ipse enim mortem unus accépit, ne omnes nos morerémur; immo unus mori dignátus est, ut omnes tibi perpétuo viverémus.

Et ídeo, choris angélicis sociáti, te laudámus in gáudio confiténtes:
'''
label = "Prefáció a megholtakról II."
source = "Római Misekönyv 1991 (PPEK 335), 76. prefáció, 407. o. – az új misekönyvvel még nem egyeztetve"
sub = "Krisztus meghalt, hogy mi örökre éljünk"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

Mert ő az egyetlen, ki bűneink zsoldját, a halált önként vállalta, hogy örökre meg ne haljunk, és ő az egyetlen, aki önként feláldozta életét, hogy mindnyájan örökké neked éljünk.

Ezért mi is az angyalok kórusához társulunk, dicsőítünk téged, és ujjongva mondjuk:
'''

[megholtak-3]
la_label = "Praefatio III de defunctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum:

Qui est salus mundi, vita hóminum, resurréctio mortuórum.

Per quem maiestátem tuam adórat exércitus Angelórum, ante conspéctum tuum in æternitáte lætántium. Cum quibus et nostras voces ut admítti iúbeas, deprecámur, sócia exsultatióne dicéntes:
'''
label = "Prefáció a megholtakról III."
source = "Római Misekönyv 1991 (PPEK 335), 77. prefáció, 408. o. – az új misekönyvvel még nem egyeztetve"
sub = "Krisztus a mi üdvösségünk és életünk"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

Ő üdvözíti a világot, megújítja az emberiség életét, és feltámaszt minden megholtat.

A te fölségedet őáltala dicsőíti az angyalok hatalmas kórusa: boldogan áldanak, mert mindörökké látnak téged. Add, kérünk, hogy az ő szavukhoz társuljon szózatunk, és velük együtt szüntelen ujjongással mondjuk:
'''

[megholtak-4]
la_label = "Praefatio IV de defunctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Cuius império náscimur, cuius arbítrio régimur, cuius præcépto in terra, de qua sumpti sumus, peccáti lege absólvimur. Et, qui per mortem Fílii tui redémpti sumus, ad ipsíus resurrectiónis glóriam tuo nutu excitámur.

Et ídeo, cum Angelórum atque Sanctórum turba, hymnum laudis tibi cánimus, sine fine dicéntes:
'''
label = "Prefáció a megholtakról IV."
source = "Római Misekönyv 1991 (PPEK 335), 78. prefáció, 409. o. – az új misekönyvvel még nem egyeztetve"
sub = "A földi életből mennyei dicsőségre jutunk"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

A te akaratodból születünk, és gondviselésed kormányoz minket, a bűn miatt testünk a te parancsodra tér vissza a földbe, amelyből vétetett. De Fiad halála megváltott minket, egy intésed felébreszt halálos álmunkból, hogy feltámadva megosszuk ővele dicsőséges életét.

Mi ezért az angyalok és szentek kórusával együtt dicséreted himnuszát zengjük, és vég nélkül mondjuk:
'''

[megholtak-5]
la_label = "Praefatio V de defunctis"
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Quia, etsi nostri est mériti quod perímus, tuæ tamen est pietátis et grátiæ quod, pro peccáto morte consúmpti, per Christi victóriam redémpti, cum ipso revocámur ad vitam.

Et ídeo, cum cælórum Virtútibus, in terris te iúgiter celebrámus, maiestáti tuæ sine fine clamántes:
'''
label = "Prefáció a megholtakról V."
source = "Római Misekönyv 1991 (PPEK 335), 79. prefáció, 410. o. – az új misekönyvvel még nem egyeztetve"
sub = "Krisztus győzelme által mi is feltámadunk"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert megérdemeltük ugyan az elmúlást, de jóságod folytán kegyelmet kaptunk. S ha bűneinkért mégis halált szenvedünk, Krisztus megváltó győzelme által új életre támadunk ővele.

Ezért a mennyei hatalmas angyalokkal együtt a földön mi is szüntelenül magasztalunk téged, fölségedet dicsérjük, és hangos szóval vég nélkül mondjuk:
'''

[apostolok-1]
label = "Prefáció az apostolokról I."
source = "Római Misekönyv 1991 (PPEK 335), 62. prefáció, 393. o. – az új misekönyvvel még nem egyeztetve"
sub = "Az apostolok Isten népének pásztorai"
la_label = "Praefatio I de Apostolis"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert nyájadat, örök Pásztorunk, magára nem hagyod, hanem szent apostolaid által mindvégig őrzöd és óvod, hogy azok kormányozzák hívő népedet, kik rendelésedből állnak nyájad élén Fiad helyett, mint pásztorok.

Ezért mi is, miként az angyalok és főangyalok, a trónod körül álló hatalmas égi szellemek, és minden seregek a mennyben, dicsőséged himnuszát zengjük, és velük együtt vég nélkül mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Qui gregem tuum, Pastor ætérne, non déseris, sed per beátos Apóstolos contínua protectióne custódis, ut iísdem rectóribus gubernétur, quos Fílii tui vicários eídem contulísti præésse pastóres.

Et ídeo cum Angelis et Archángelis, cum Thronis et Dominatiónibus, cumque omni milítia cæléstis exércitus, hymnum glóriæ tuæ cánimus, sine fine dicéntes:
'''

[apostolok-2]
label = "Prefáció az apostolokról II."
source = "Római Misekönyv 1991 (PPEK 335), 63. prefáció, 394. o. – az új misekönyvvel még nem egyeztetve"
sub = "Az Egyház apostoli alapjai és tanúi"
la_label = "Praefatio II de Apostolis"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

Mert megadtad Egyházadnak, hogy az apostolok szilárd alapján álljon, a te szentséged örök jeleként maradjon fenn itt a földön, és tanúságot tegyen a mennynek országáról minden népnek.

Ezért az angyalok egész seregével együtt most és mindörökké zengjük, és hálás szívvel mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

Quóniam Ecclésiam tuam in apostólicis tribuísti consístere fundaméntis, ut signum sanctitátis tuæ in terris manéret ipsa perpétuum, et cæléstia præbéret cunctis homínibus documénta.

Quaprópter nunc et usque in sǽculum cum omni milítia Angelórum devóta tibi mente concínimus, clamántes atque dicéntes:
'''
