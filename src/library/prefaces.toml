source = "Római Misekönyv 1991 (PPEK 335), 51. prefáció, 382. o. (OCR: „igazsákos” → „igazságos”) – az új misekönyvvel még nem egyeztetve. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Ordo Missae, praefatio 51, p. 591 (OCR: „dd te” → „ad te”); hangsúlyjelek a Missale Romanum szokása szerint"
sub = "Az üdvtörténet eseményei Krisztusban"
la_label = "Praefatio IV de dominicis per annum"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten: Krisztus, a mi Urunk által.

Ő születésével újjá alkotta a régi embert, és szenvedésével minden bűnt eltörölt; majd feltámadásával megnyitotta az örök élet útját, és hozzád, Atyjához az égbe szállva, kitárta a mennyország ajtaját.

Mi ezért az angyalok és szentek kórusával együtt dicséreted himnuszát zengjük, és vég nélkül mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus: per Christum Dóminum nostrum.

Ipse enim nascéndo vetustátem hóminum renovávit, patiéndo delévit nostra peccáta, ætérnæ vitæ áditum prǽstitit a mórtuis resurgéndo, ad te Patrem ascendéndo cæléstes iánuas reserávit.

Et ídeo, cum Angelórum atque Sanctórum turba, hymnum laudis tibi cánimus, sine fine dicéntes:
'''

[vasarnap-5]
label = "Prefáció az évközi vasárnapokra V."
source = "Római Misekönyv 1991 (PPEK 335), 52. prefáció, 383. o. – az új misekönyvvel még nem egyeztetve. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Ordo Missae, praefatio 52, p. 592; hangsúlyjelek a Missale Romanum szokása szerint"
sub = "A teremtés"
la_label = "Praefatio V de dominicis per annum"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert te alkottál mindent, amiből a világ épül, az idők járásának te szabtál törvényt. A te képmásodra formáltad az embert, sőt hatalmába adtad mindazt, amit a világban ámulva látunk, hogy helyettesedként uralkodjék minden műveden, és nagy tetteidért szüntelen magasztaljon téged, Krisztus, a mi Urunk által.

Ezért mi is dicsőítünk az összes angyalokkal együtt, vidám lélekkel éneklünk, és hálás szívvel mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Qui ómnia mundi eleménta fecísti, et vices disposuísti témporum variári; hóminem vero formásti ad imáginem tuam, et rerum ei subiecísti univérsa mirácula, ut vicário múnere dominarétur ómnibus quæ creásti, et in óperum tuórum magnálibus iúgiter te laudáret, per Christum Dóminum nostrum.

Unde et nos cum ómnibus Angelis te laudámus, iucúnda celebratióne clamántes:
'''

[vasarnap-6]
label = "Prefáció az évközi vasárnapokra VI."
source = "Római Misekönyv 1991 (PPEK 335), 53. prefáció, 384. o. – az új misekönyvvel még nem egyeztetve. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Ordo Missae, praefatio 53, p. 593; hangsúlyjelek a Missale Romanum szokása szerint"
sub = "Az örök Húsvét záloga a Szentlélek"
la_label = "Praefatio VI de dominicis per annum"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert benned élünk, mozgunk és vagyunk, és földi életünkben nemcsak jóságodat tapasztaljuk napról napra, hanem megkaptuk tőled az örök élet zálogát. A Szentlélek ugyanis, aki életre keltette a halálból Jézust, már elkezdte isteni működését lelkünkben, így reméljük, hogy a Húsvét szent titkában állandóan részesít minket.

Ezért mi is dicsőítünk az összes angyalokkal együtt, vidám lélekkel éneklünk, és hálás szívvel mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

In quo vívimus, movémur et sumus, atque in hoc córpore constitúti non solum pietátis tuæ cotidiános experímur efféctus, sed æternitátis étiam pígnora iam tenémus. Primítias enim Spíritus habéntes, per quem suscitásti Iesum a mórtuis, paschále mystérium sperámus nobis esse perpétuum.

Unde et nos cum ómnibus Angelis te laudámus, iucúnda celebratióne clamántes:
'''

[vasarnap-7]
label = "Prefáció az évközi vasárnapokra VII."
source = "Római Misekönyv 1991 (PPEK 335), 54. prefáció, 385. o. – az új misekönyvvel még nem egyeztetve. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Ordo Missae, praefatio 54, p. 594; hangsúlyjelek a Missale Romanum szokása szerint"
sub = "Krisztus engedelmessége szerezte meg nekünk az üdvösséget"
la_label = "Praefatio VII de dominicis per annum"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

Mert úgy szeretted a világot, irgalmas Istenünk, hogy olyan Megváltót küldtél nékünk, ki akaratod szerint hozzánk hasonlóan élt a földön, de minden bűn nélkül. Az ő engedelmessége miatt kaptuk vissza tőled, amit elvesztettünk az engedetlenség bűne által; hogy azt szerethesd bennünk, amit Fiadban kedveltél.

Ezért mi is dicsőítünk az összes angyalokkal és szentekkel együtt, Urunknak vallunk téged, és ujjongva mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Quia sic mundum misericórditer dilexísti, ut ipsum nobis mítteres Redemptórem, quem absque peccáto in nostra voluísti similitúdine conversári, ut amáres in nobis quod diligébas in Fílio, cuius obœdiéntia sumus ad tua dona reparáti, quæ per inobœdiéntiam amiserámus peccándo.

Unde et nos, Dómine, cum Angelis et Sanctis univérsis tibi confitémur, in exsultatióne dicéntes:
'''

# vasarnap-8: the middle paragraph follows igenaptár 2026-11-08 ("VIII. évközi prefáció – Misekönyv 454.
# oldal", probably the new missal): "hogy néped, amelyet … a te mérhetetlen bölcsességed" (1991: "hogy a nép,
# amelyet … mérhetetlen bölcsességed"; "(te) újból" there). Its last line "És ezért … ujjongva zengjük:" is the
# sung form: stripped like the others ("mondjuk:").
[vasarnap-8]
label = "Prefáció az évközi vasárnapokra VIII."
source = "igenaptár 2026-11-08 („VIII. évközi prefáció – Misekönyv 454. oldal”, valószínűleg az új misekönyv), egyébként Római Misekönyv 1991 (PPEK 335), 55. prefáció, 386. o. Latin: Missale Romanum cum lectionibus 1977, vol. IV, Ordo Missae, praefatio 55, p. 595; hangsúlyjelek a Missale Romanum szokása szerint"
sub = "Az Egyház közössége a Szentháromság egységéből fakad"
la_label = "Praefatio VIII de dominicis per annum"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

A bűn ugyan elszakította fiaidat tőled, de szent Fiad vére és Szentlelked ereje által te újból magad köré akartad gyűjteni őket: hogy néped, amelyet a Szentháromság egy Isten egyesít, a te mérhetetlen bölcsességed dicséretére Egyházzá váljék, mint Krisztus teste és a Szentlélek temploma.

Ezért mi is az angyalok kórusához társulunk, dicsőítünk téged, és ujjongva mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Quia fílios, quos longe peccáti crimen abstúlerat, per sánguinem Fílii tui Spiritúsque virtúte, in unum ad te dénuo congregáre voluísti: ut plebs, de unitáte Trinitátis adunáta, in tuæ laudem sapiéntiæ multifórmis Christi corpus templúmque Spíritus noscerétur Ecclésia.

Et ídeo, choris angélicis sociáti, te laudámus in gáudio confiténtes:
'''

