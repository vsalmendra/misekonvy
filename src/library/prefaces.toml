text = '''
Valóban méltó és igazságos, illő és üdvös, hogy mindig és mindenütt hálát adjunk néked, mi Urunk, szentséges Atyánk, mindenható, örök Isten:

s a Boldogságos, mindenkor Szűz Mária N. ünnepén téged dicsérjünk, magasztaljunk és áldjunk. Mert ő foganta Egyszülöttedet a Szentlélek által, és szüzességének teljes ragyogásában világra hozta az örök világosságot, a mi Urunkat, Jézus Krisztust.

A te fölségedet általa dicsérik az angyalok, és imádják az uralkodó szellemek, az égi hatalmak rettegik; a mennyei seregek, az ég erői s a boldog szeráfkórusok ujjongva együtt tisztelik.

Add, kérünk, hogy az ő szavukhoz társuljon szózatunk, és alázatos megvallással mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, nos tibi semper et ubíque grátias ágere: Dómine, sancte Pater, omnípotens ætérne Deus:

Et te in N. beátæ Maríæ semper Vírginis collaudáre, benedícere et prædicáre. Quæ et Unigénitum tuum Sancti Spíritus obumbratióne concépit, et, virginitátis glória permanénte, lumen ætérnum mundo effúdit, Iesum Christum Dóminum nostrum.

Per quem maiestátem tuam laudant Angeli, adórant Dominatiónes, tremunt Potestátes. Cæli cælorúmque Virtútes, ac beáta Séraphim, sócia exsultatióne concélebrant.

Cum quibus et nostras voces ut admítti iúbeas, deprecámur, súpplici confessióne dicéntes:
'''

[maria-2]
label = "Prefáció a Boldogságos Szűz Máriáról II."
source = "Római Misekönyv 1991 (PPEK 335), 59. prefáció, 390. o. – az új misekönyvvel még nem egyeztetve. Latin: Missale Romanum 2008 (ordo.pallotyni.pl, Praefatio II de beata Maria Virgine)"
sub = "Az Egyház Szűz Mária szavaival magasztalja Istent"
la_label = "Praefatio II de beata Maria Virgine"
text = '''
Valóban méltó és igazságos, illő és üdvös, hogy téged szentjeidben csodálatra méltónak valljunk, de kiváltképpen, amikor tiszteljük a Boldogságos Szűz Máriát, az ő hálaadó éneke által jóságodért magasztaljunk téged.

Te valóban nagy csodákat műveltél szerte az egész földön: és nemzedékről nemzedékre folytatod, amit jóvoltodból tettél értünk. Mert alázatos szolgálóleányodat kegyes szemmel nézted, és általa adtad nekünk Fiadat: Üdvözítő Urunkat, Jézus Krisztust.

A te fölségedet őáltala dicsőíti az angyalok hatalmas kórusa: boldogan áldanak, mert mindörökké látnak téged.

Add, kérünk, hogy az ő szavukhoz társuljon szózatunk, és velük együtt szüntelen ujjongással mondjuk:
'''
la = '''
Vere dignum et iustum est, æquum et salutáre, in ómnium Sanctórum provéctu te mirábilem confitéri, et potíssimum, beátæ Vírginis Maríæ memóriam recoléntes, cleméntiam tuam ipsíus grato magnificáre præcónio.

Vere namque in omnes terræ fines magna fecísti, ac tuam in sǽcula prorogásti misericórdiæ largitátem, cum, ancíllæ tuæ humilitátem aspíciens, per eam dedísti humánæ salútis auctórem, Fílium tuum, Iesum Christum, Dóminum nostrum.

Per quem maiestátem tuam adórat exércitus Angelórum, ante conspéctum tuum in æternitáte lætántium.

Cum quibus et nostras voces ut admítti iúbeas, deprecámur, sócia exsultatióne dicéntes:
'''
