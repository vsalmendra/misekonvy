text = '''
Valóban méltó és igazságos, illő és üdvös, hogy téged szentjeidben csodálatra méltónak valljunk, de kiváltképpen, amikor tiszteljük a Boldogságos Szűz Máriát, az ő hálaadó éneke által jóságodért magasztaljunk téged.

Te valóban nagy csodákat műveltél szerte az egész földön: és nemzedékről nemzedékre folytatod, amit jóvoltodból tettél értünk. Mert alázatos szolgálóleányodat kegyes szemmel nézted, és általa adtad nekünk Fiadat: Üdvözítő Urunkat, Jézus Krisztust.

A te fölségedet őáltala dicsőíti az angyalok hatalmas kórusa: boldogan áldanak, mert mindörökké látnak téged.

