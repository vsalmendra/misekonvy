la_label = "Prex eucharistica II"
la = [
  "Vere Sanctus es, Dómine, fons omnis sanctitátis.",
  "Hæc ergo dona, quǽsumus, Spíritus tui rore sanctífica, ut nobis Corpus et † Sanguis fiant Dómini nostri Iesu Christi.",
  "Qui cum Passióni voluntárie traderétur, accépit panem et grátias agens fregit, dedítque discípulis suis, dicens:",
  "Accípite et manducáte ex hoc omnes: hoc est enim Corpus meum, quod pro vobis tradétur.",
  "Símili modo, postquam cenátum est, accípiens et cálicem, íterum tibi grátias agens dedit discípulis suis, dicens:",
  "Accípite et bíbite ex eo omnes: hic est enim calix Sánguinis mei novi et ætérni testaménti, qui pro vobis et pro multis effundétur in remissiónem peccatórum. Hoc fácite in meam commemoratiónem.",
  "Mystérium fídei.",
  "Mortem tuam annuntiámus, Dómine, et tuam resurrectiónem confitémur, donec vénias.",
  "Mémores ígitur mortis et resurrectiónis eius, tibi, Dómine, panem vitæ et cálicem salútis offérimus, grátias agéntes quia nos dignos habuísti astáre coram te et tibi ministráre.",
  "Et súpplices deprecámur ut Córporis et Sánguinis Christi partícipes a Spíritu Sancto congregémur in unum.",
  "Recordáre, Dómine, Ecclésiæ tuæ toto orbe diffúsæ, ut eam in caritáte perfícias una cum Papa nostro Leóne et Epíscopo nostro N. et univérso clero.",
  "Meménto étiam fratrum nostrórum, qui in spe resurrectiónis dormiérunt, omniúmque in tua miseratióne defunctórum, et eos in lumen vultus tui admítte. Omnium nostrum, quǽsumus, miserére, ut cum beáta Dei Genetríce Vírgine María, beátis Apóstolis et ómnibus Sanctis, qui tibi a sǽculo placuérunt, ætérnæ vitæ mereámur esse consórtes, et te laudémus et glorificémus per Fílium tuum Iesum Christum.",
  "Per ipsum, et cum ipso, et in ipso, est tibi Deo Patri omnipoténti, in unitáte Spíritus Sancti, omnis honor et glória per ómnia sǽcula sæculórum.",
