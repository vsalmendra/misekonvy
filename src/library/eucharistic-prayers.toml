# Eucharistic prayers I-IV (HTML) with Latin (la: one entry per Hungarian <p>, rubrics skipped).
# Latin: Missale Romanum 2008 (ordo.pallotyni.pl), EP I from the 2026-10-20 page; "Papa nostro N." -> Leóne.
# EP IV may only be said with its own preface (prefaces.toml: ep4).

[1]
la_label = "Prex eucharistica I (Canon Romanus)"
la = [
  "Te ígitur, clementíssime Pater, per Iesum Christum, Fílium tuum, Dóminum nostrum, súpplices rogámus ac pétimus, uti accépta hábeas et benedícas † hæc dona, hæc múnera, hæc sancta sacrifícia illibáta,",
  "in primis, quæ tibi offérimus pro Ecclésia tua sancta cathólica: quam pacificáre, custodíre, adunáre et régere dignéris toto orbe terrárum: una cum fámulo tuo Papa nostro Leóne et Antístite nostro N. et ómnibus orthodóxis atque cathólicæ et apostólicæ fídei cultóribus.",
  "Meménto, Dómine, famulórum famularúmque tuárum N. et N.",
  "et ómnium circumstántium, quorum tibi fides cógnita est et nota devótio, pro quibus tibi offérimus: vel qui tibi ófferunt hoc sacrifícium laudis, pro se suísque ómnibus: pro redemptióne animárum suárum, pro spe salútis et incolumitátis suæ: tibíque reddunt vota sua ætérno Deo, vivo et vero.",
  "Communicántes, et memóriam venerántes, in primis gloriósæ semper Vírginis Maríæ, Genetrícis Dei et Dómini nostri Iesu Christi: sed et beáti Ioseph, eiúsdem Vírginis Sponsi, et beatórum Apostolórum ac Mártyrum tuórum, Petri et Pauli, Andréæ, (Iacóbi, Ioánnis, Thomæ, Iacóbi, Philíppi, Bartholomǽi, Matthǽi, Simónis et Thaddǽi: Lini, Cleti, Cleméntis, Xysti, Cornélii, Cypriáni, Lauréntii, Chrysógoni, Ioánnis et Pauli, Cosmæ et Damiáni) et ómnium Sanctórum tuórum; quorum méritis precibúsque concédas, ut in ómnibus protectiónis tuæ muniámur auxílio. (Per Christum Dóminum nostrum. Amen.)",
  "Hanc ígitur oblatiónem servitútis nostræ, sed et cunctæ famíliæ tuæ, quǽsumus, Dómine, ut placátus accípias: diésque nostros in tua pace dispónas, atque ab ætérna damnatióne nos éripi et in electórum tuórum iúbeas grege numerári. (Per Christum Dóminum nostrum. Amen.)",
  "Quam oblatiónem tu, Deus, in ómnibus, quǽsumus, benedíctam, adscríptam, ratam, rationábilem, acceptabilémque fácere dignéris: ut nobis Corpus et Sanguis fiat dilectíssimi Fílii tui, Dómini nostri Iesu Christi.",
  "Qui, prídie quam paterétur, accépit panem in sanctas ac venerábiles manus suas, et elevátis óculis in cælum ad te Deum Patrem suum omnipoténtem, tibi grátias agens benedíxit, fregit, dedítque discípulis suis, dicens:",
  "Accípite et manducáte ex hoc omnes: hoc est enim Corpus meum, quod pro vobis tradétur.",
  "Símili modo, postquam cenátum est, accípiens et hunc præclárum cálicem in sanctas ac venerábiles manus suas, item tibi grátias agens benedíxit, dedítque discípulis suis, dicens:",
  "Accípite et bíbite ex eo omnes: hic est enim calix Sánguinis mei novi et ætérni testaménti, qui pro vobis et pro multis effundétur in remissiónem peccatórum. Hoc fácite in meam commemoratiónem.",
  "Mystérium fídei.",
  "Mortem tuam annuntiámus, Dómine, et tuam resurrectiónem confitémur, donec vénias.",
  "Unde et mémores, Dómine, nos servi tui, sed et plebs tua sancta, eiúsdem Christi, Fílii tui, Dómini nostri, tam beátæ passiónis, necnon et ab ínferis resurrectiónis, sed et in cælos gloriósæ ascensiónis: offérimus præcláræ maiestáti tuæ de tuis donis ac datis hóstiam puram, hóstiam sanctam, hóstiam immaculátam, Panem sanctum vitæ ætérnæ et Cálicem salútis perpétuæ.",
  "Supra quæ propítio ac seréno vultu respícere dignéris: et accépta habére, sícuti accépta habére dignátus es múnera púeri tui iusti Abel, et sacrifícium Patriárchæ nostri Abrahæ, et quod tibi óbtulit summus sacérdos tuus Melchísedech, sanctum sacrifícium, immaculátam hóstiam.",
  "Súpplices te rogámus, omnípotens Deus: iube hæc perférri per manus sancti Angeli tui in sublíme altáre tuum, in conspéctu divínæ maiestátis tuæ; ut, quotquot ex hac altáris participatióne sacrosánctum Fílii tui Corpus et Sánguinem sumpsérimus, omni benedictióne cælésti et grátia repleámur. (Per Christum Dóminum nostrum. Amen.)",
  "Meménto étiam, Dómine, famulórum famularúmque tuárum N. et N., qui nos præcessérunt cum signo fídei, et dórmiunt in somno pacis.",
  "Ipsis, Dómine, et ómnibus in Christo quiescéntibus, locum refrigérii, lucis et pacis, ut indúlgeas, deprecámur. (Per Christum Dóminum nostrum. Amen.)",
  "Nobis quoque peccatóribus fámulis tuis, de multitúdine miseratiónum tuárum sperántibus, partem áliquam et societátem donáre dignéris cum tuis sanctis Apóstolis et Martýribus: cum Ioánne, Stéphano, Matthía, Bárnaba, (Ignátio, Alexándro, Marcellíno, Petro, Felicitáte, Perpétua, Agatha, Lúcia, Agnéte, Cæcília, Anastásia) et ómnibus Sanctis tuis: intra quorum nos consórtium, non æstimátor mériti, sed véniæ, quǽsumus, largítor admítte. Per Christum Dóminum nostrum.",
  "Per quem hæc ómnia, Dómine, semper bona creas, sanctíficas, vivíficas, benedícis, et præstas nobis.",
  "Per ipsum, et cum ipso, et in ipso, est tibi Deo Patri omnipoténti, in unitáte Spíritus Sancti, omnis honor et glória per ómnia sǽcula sæculórum.",
  "Amen.",
]
label = "I. eucharisztikus ima (római kánon)"
html = '''
<p>Könyörögve kérünk tehát, jóságos Atyánk, Fiad, a mi Urunk, Jézus Krisztus által: fogadd el és áldd † meg ezeket az adományokat és ajándékokat, ezt a szent és tiszta áldozatot.</p>
<p>Elsősorban szent és katolikus Egyházadért ajánljuk fel neked: tartsd meg békében, őrizd meg egységben, és vezesd az egész földkerekségen szolgáddal, Leó pápánkkal, N. főpásztorunkkal, és mindazokkal, akik az egyetemes és apostoli hitet hűségesen őrzik és vallják.</p>
<p>Emlékezzél meg, Urunk, szolgáidról, N. és N.-ről.</p>
<p>Emlékezzél meg minden jelenlévőről is, akiknek hitét és buzgóságát ismered, akikért ezt a dicsőítő áldozatot felajánljuk, vagy akik ezt felajánlják önmagukért és övéikért, lelkük megváltásáért, üdvösségük és épségük reményében, és hódolatukat bemutatják neked, az örök, élő és igaz Istennek.</p>
<p>A szentek közösségében tisztelettel megemlékezünk mindenekelőtt a dicsőséges, mindenkor Szűz Máriáról, Istenünk és Urunk, Jézus Krisztus édesanyjáról, valamint Szent Józsefről, a Szent Szűz jegyeséről, Péter és Pál, András, (Jakab, János, Tamás, Jakab, Fülöp, Bertalan, Máté, Simon és Tádé) apostolaidról; (Linusz, Klétusz, Kelemen, Szixtusz, Kornél, Ciprián, Lőrinc, Krizogonusz, János és Pál, Kozma és Damján) vértanúidról és minden szentedről. Az ő érdemeikért és könyörgésükre add, hogy mindenben érezzük oltalmadat. (Krisztus, a mi Urunk által. Ámen.)</p>
<p>Kérünk, Istenünk, fogadd megengesztelődve ezt az áldozati adományt tőlünk, szolgáidtól és házad egész népétől. Irányítsd a te békédben életünk napjait, ments meg minket az örök kárhozattól, és végy fel választottaid körébe. (Krisztus, a mi Urunk által. Ámen.)</p>
<p>Áldd meg, Istenünk, bőséges áldásoddal ezt az áldozati adományt, tedd rendelésed szerint magadhoz méltóvá és előtted kedvessé, hogy legyen ez számunkra szeretett Fiadnak, a mi Urunk, Jézus Krisztusnak teste és vére.</p>
<p>Ő ugyanis szenvedésének előestéjén tiszteletreméltó szent kezébe vette a kenyeret, és szemét az égre emelte, tehozzád, az Istenhez, mindenható Atyjához, majd hálát adva áldást mondott, megtörte, tanítványainak adta, és így szólt:</p>
<p class="cons">Vegyétek, és egyetek ebből mindnyájan, mert ez az én testem, mely értetek adatik.</p>
<p>A vacsora után ugyanígy tiszteletreméltó szent kezébe vette ezt a csodálatos kelyhet, majd ismét hálát adva áldást mondott, tanítványainak adta, és így szólt:</p>
<p class="cons">Vegyétek, és igyatok ebből mindnyájan, mert ez az én vérem kelyhe, az új és örök szövetségé. Ez a vér értetek és sokakért kiontatik a bűnök bocsánatára. Ezt cselekedjétek az én emlékezetemre.</p>
<p>Íme, hitünk szent titka.</p>
<p class="resp">Halálodat hirdetjük, Urunk, és hittel valljuk feltámadásodat, amíg el nem jössz.</p>
<p>Megemlékezünk ezért, Istenünk, mi, a te szolgáid, és a te szent néped, Fiadnak, Krisztus Urunknak áldott szenvedéséről, a halálból való feltámadásáról, dicsőséges mennybemeneteléről, és ajándékaidból felajánljuk magasztos Fölségednek ezt a tiszta, szent és szeplőtelen áldozati adományt: az örök élet szent kenyerét és az örök üdvösség kelyhét.</p>
<p>Nézd kegyes és jóságos szemmel, és fogadd el, amint elfogadtad igaz szolgádnak, Ábelnek ajándékát, ősatyánknak, Ábrahámnak áldozatát, és azt a szent és szeplőtelen áldozati adományt, amelyet főpapod, Melkizedek mutatott be neked.</p>
<p>Könyörögve kérünk, mindenható Istenünk, szent angyalod vigye áldozatunkat mennyei oltárodra isteni Fölséged színe elé, hogy mi, akik erről az oltárról Fiad szentséges testében és vérében részesülünk, minden mennyei † áldással és kegyelemmel elteljünk. (Krisztus, a mi Urunk által. Ámen.)</p>
<p>Emlékezzél meg, Urunk, N. és N. szolgáidról, akik a hit jelével előttünk távoztak el az élők sorából, és a béke álmát alusszák.</p>
<p>Kérünk, Urunk, hogy nekik és minden Krisztusban elhunyt hívőnek add meg a boldogságot, a világosságot és a békét a te országodban. (Krisztus, a mi Urunk által. Ámen.)</p>
<p>Nekünk is, bűnös szolgáidnak, akik irgalmad bőségében bizakodunk, adj kegyesen közösséget szent apostolaiddal és vértanúiddal: Jánossal, Istvánnal, Mátyással, Barnabással (Ignáccal, Sándorral, Marcellinnal, Péterrel, Felicitásszal, Perpétuával, Ágotával, Lúciával, Ágnessel, Cecíliával, Anasztáziával) és minden szenteddel; és kérünk, bár meg nem érdemeljük, irgalmadból mégis bocsáss be minket szentjeid körébe.</p>
<p>Istenünk, te mindezeket a javakat mindenkor Krisztus, a mi Urunk által teremted, szenteled meg, élteted, áldod meg és adod nékünk.</p>
<p>Őáltala, ővele és őbenne a tiéd, mindenható Atyaisten, a Szentlélekkel egységben minden tisztelet és dicsőség mindörökkön örökké.</p>
<p class="resp">Ámen.</p>
'''

