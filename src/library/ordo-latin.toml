<p class="bi-l " lang="la">Dómine Iesu Christe, qui dixísti Apóstolis tuis: Pacem relínquo vobis, pacem meam do vobis: ne respícias peccáta nostra, sed fidem Ecclésiæ tuæ; eámque secúndum voluntátem tuam pacificáre et coadunáre dignéris. Qui vivis et regnas in sǽcula sæculórum.</p>
<p class="bi-r ">Urunk, Jézus Krisztus, te azt mondottad apostolaidnak: „Békességet hagyok rátok, az én békémet adom nektek.” Ne vétkeinket nézzed, hanem Egyházad hitét, őrizd meg szándékod szerint békében, és add meg teljes egységét. Aki élsz és uralkodol mindörökkön-örökké.</p>
<p class="bi-l resp" lang="la">Amen.</p>
<p class="bi-r resp">Ámen.</p>
