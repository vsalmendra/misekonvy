communion_rite = '''
<h3 class="bi-l">Oratio dominica</h3>
<h3 class="bi-r">Miatyánk</h3>
<p class="bi-l " lang="la">Præcéptis salutáribus móniti, et divína institutióne formáti, audémus dícere:</p>
<p class="bi-r ">Üdvözítőnk parancsára és isteni tanítása szerint így imádkozunk:</p>
<p class="bi-l resp" lang="la">Pater noster, qui es in cælis: sanctificétur nomen tuum; advéniat regnum tuum; fiat volúntas tua, sicut in cælo, et in terra. Panem nostrum cotidiánum da nobis hódie; et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris; et ne nos indúcas in tentatiónem; sed líbera nos a malo.</p>
<p class="bi-r resp">Mi Atyánk, aki a mennyekben vagy, szenteltessék meg a te neved; jöjjön el a te országod; legyen meg a te akaratod, amint a mennyben, úgy a földön is. Mindennapi kenyerünket add meg nekünk ma; és bocsásd meg vétkeinket, miképpen mi is megbocsátunk az ellenünk vétkezőknek; és ne vigy minket kísértésbe; de szabadíts meg a gonosztól.</p>
<p class="bi-l " lang="la">Líbera nos, quǽsumus, Dómine, ab ómnibus malis, da propítius pacem in diébus nostris, ut, ope misericórdiæ tuæ adiúti, et a peccáto simus semper líberi et ab omni perturbatióne secúri: exspectántes beátam spem et advéntum Salvatóris nostri Iesu Christi.</p>
<p class="bi-r ">Szabadíts meg, kérünk, Urunk, minden gonosztól; adj kegyesen békét napjainkban, hogy irgalmadból mindenkor bűn és baj nélkül éljünk, míg reménykedve várjuk az örök boldogságot és Üdvözítőnknek, Jézus Krisztusnak dicsőséges eljöttét.</p>
<p class="bi-l resp" lang="la">Quia tuum est regnum, et potéstas, et glória in sǽcula.</p>
<p class="bi-r resp">Mert tiéd az ország, a hatalom és a dicsőség mindörökkön-örökké. Ámen.</p>
