# Gloria: Missale Romanum 2008 (ordo.pallotyni.pl, Ritus initiales).
gloria = '''
<h3 class="bi-l">Gloria</h3><h3 class="bi-r">Dicsőség</h3><p class="bi-l resp" lang="la">Glória in excélsis Deo et in terra pax homínibus bonæ voluntátis. Laudámus te, benedícimus te, adorámus te, glorificámus te, grátias ágimus tibi propter magnam glóriam tuam, Dómine Deus, Rex cæléstis, Deus Pater omnípotens. Dómine Fili Unigénite, Iesu Christe, Dómine Deus, Agnus Dei, Fílius Patris, qui tollis peccáta mundi, miserére nobis; qui tollis peccáta mundi, súscipe deprecatiónem nostram. Qui sedes ad déxteram Patris, miserére nobis. Quóniam tu solus Sanctus, tu solus Dóminus, tu solus Altíssimus, Iesu Christe, cum Sancto Spíritu: in glória Dei Patris. Amen.</p><p class="bi-r resp">Dicsőség a magasságban Istennek, és a földön békesség a jóakaratú embereknek. Dicsőítünk téged, áldunk téged, imádunk téged, magasztalunk téged, hálát adunk neked nagy dicsőségedért, Urunk és Istenünk, mennyei Király, mindenható Atyaisten. Urunk, Jézus Krisztus, egyszülött Fiú, Urunk és Istenünk, Isten Báránya, az Atyának Fia, te elveszed a világ bűneit, irgalmazz nekünk; te elveszed a világ bűneit, hallgasd meg könyörgésünket. Te az Atya jobbján ülsz, irgalmazz nekünk. Mert egyedül te vagy a Szent, te vagy az Úr, te vagy az egyetlen Fölség, Jézus Krisztus, a Szentlélekkel együtt, az Atyaisten dicsőségében. Ámen.</p>
'''

# Creed: Latin Missale Romanum 2008 (ordo.pallotyni.pl, Ordo Missae, Liturgia verbi 18.;
# rubric "Ad verba quæ sequuntur, usque ad factus est, omnes se inclinant." shown with the Hungarian
# rubrics of the 1991 missal); Hungarian as in ordo.toml (1991).
creed = '''
<h3 class="bi-l">Credo</h3><h3 class="bi-r">Hitvallás</h3><p class="bi-l resp" lang="la">Credo in unum Deum, Patrem omnipoténtem, factórem cæli et terræ, visibílium ómnium et invisibílium.</p><p class="bi-r resp">Hiszek az egy Istenben, mindenható Atyában, mennynek és földnek, minden láthatónak és láthatatlannak Teremtőjében.</p><p class="bi-l resp" lang="la">Et in unum Dóminum Iesum Christum, Fílium Dei Unigénitum, et ex Patre natum ante ómnia sǽcula. Deum de Deo, lumen de lúmine, Deum verum de Deo vero, génitum, non factum, consubstantiálem Patri: per quem ómnia facta sunt. Qui propter nos hómines et propter nostram salútem descéndit de cælis.</p><p class="bi-r resp">Hiszek az egy Úrban, Jézus Krisztusban, Isten egyszülött Fiában, aki az Atyától született az idő kezdete előtt. Isten az Istentől, Világosság a Világosságtól, valóságos Isten a valóságos Istentől, született, de nem teremtmény, az Atyával egylényegű; és minden általa lett. Értünk, emberekért, a mi üdvösségünkért leszállott a mennyből.</p><p class="bi-full rub">Mindnyájan mélyen meghajolnak:</p><p class="bi-l resp" lang="la">Et incarnátus est de Spíritu Sancto ex María Vírgine, et homo factus est.</p><p class="bi-r resp">Megtestesült a Szentlélek erejéből Szűz Máriától, és emberré lett.</p><p class="bi-full rub">Felegyenesednek:</p><p class="bi-l resp" lang="la">Crucifíxus étiam pro nobis sub Póntio Piláto; passus et sepúltus est, et resurréxit tértia die, secúndum Scriptúras, et ascéndit in cælum, sedet ad déxteram Patris. Et íterum ventúrus est cum glória, iudicáre vivos et mórtuos, cuius regni non erit finis.</p><p class="bi-r resp">Poncius Pilátus alatt értünk keresztre feszítették, kínhalált szenvedett és eltemették. Harmadnapra feltámadott az Írások szerint, fölment a mennybe, ott ül az Atyának jobbján, de újra eljön dicsőségben, ítélni élőket és holtakat, és országának nem lesz vége.</p><p class="bi-l resp" lang="la">Et in Spíritum Sanctum, Dóminum et vivificántem: qui ex Patre Filióque procédit. Qui cum Patre et Fílio simul adorátur et conglorificátur: qui locútus est per prophétas.</p><p class="bi-r resp">Hiszek a Szentlélekben, Urunkban és éltetőnkben, aki az Atyától és a Fiútól származik; akit éppúgy imádunk és dicsőítünk, mint az Atyát és a Fiút. Ő szólt a próféták szavával.</p><p class="bi-l resp" lang="la">Et unam, sanctam, cathólicam et apostólicam Ecclésiam. Confíteor unum baptísma in remissiónem peccatórum. Et exspécto resurrectiónem mortuórum, et vitam ventúri sǽculi. Amen.</p><p class="bi-r resp">Hiszek az egy, szent, katolikus és apostoli Anyaszentegyházban, vallom az egy keresztséget a bűnök bocsánatára, várom a holtak feltámadását és az eljövendő örök életet. Ámen.</p>
'''

# Symbolum Apostolorum: Missale Romanum 2008, Ordo Missae 19 (ordo.pallotyni.pl); Hungarian 1991 pp. 356-357.
creed_apostles = '''
<p class="bi-l resp" lang="la">Credo in Deum Patrem omnipoténtem, Creatórem cæli et terræ,</p><p class="bi-r resp">Hiszek egy Istenben, mindenható Atyában, mennynek és földnek Teremtőjében.</p><p class="bi-l resp" lang="la">et in Iesum Christum, Fílium eius únicum, Dóminum nostrum, qui concéptus est de Spíritu Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus, mórtuus, et sepúltus, descéndit ad ínferos, tértia die resurréxit a mórtuis, ascéndit ad cælos, sedet ad déxteram Dei Patris omnipoténtis, inde ventúrus est iudicáre vivos et mórtuos.</p><p class="bi-r resp">És Jézus Krisztusban, az ő egyszülött Fiában, a mi Urunkban; aki fogantatott Szentlélektől, született Szűz Máriától; szenvedett Poncius Pilátus alatt; megfeszítették, meghalt és eltemették. Alászállt a poklokra, harmadnapon feltámadt a halottak közül; fölment a mennybe, ott ül a mindenható Atyaisten jobbján; onnan jön el ítélni élőket és holtakat.</p><p class="bi-l resp" lang="la">Credo in Spíritum Sanctum, sanctam Ecclésiam cathólicam, sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, vitam ætérnam. Amen.</p><p class="bi-r resp">Hiszek Szentlélekben. Hiszem a katolikus Anyaszentegyházat; a szentek közösségét, a bűnök bocsánatát; a test feltámadását és az örök életet. Ámen.</p>
'''

