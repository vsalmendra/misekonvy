communion_rite = '''
<h3 class="bi-l">Oratio dominica</h3>
<h3 class="bi-r">Miatyánk</h3>
<p class="bi-l " lang="la">Præcéptis salutáribus móniti, et divína institutióne formáti, audémus dícere:</p>
<p class="bi-r ">Üdvözítőnk parancsára és isteni tanítása szerint így imádkozunk:</p>
<p class="bi-l resp" lang="la">Pater noster, qui es in cælis: sanctificétur nomen tuum; advéniat regnum tuum; fiat volúntas tua, sicut in cælo, et in terra. Panem nostrum cotidiánum da nobis hódie; et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris; et ne nos indúcas in tentatiónem; sed líbera nos a malo.</p>
<p class="bi-r resp">Mi Atyánk, aki a mennyekben vagy, szenteltessék meg a te neved; jöjjön el a te országod; legyen meg a te akaratod, amint a mennyben, úgy a földön is. Mindennapi kenyerünket add meg nekünk ma; és bocsásd meg vétkeinket, miképpen mi is megbocsátunk az ellenünk vétkezőknek; és ne vigy minket kísértésbe; de szabadíts meg a gonosztól.</p>
<p class="bi-l " lang="la">Líbera nos, quǽsumus, Dómine, ab ómnibus malis, da propítius pacem in diébus nostris, ut, ope misericórdiæ tuæ adiúti, et a peccáto simus semper líberi et ab omni perturbatióne secúri: exspectántes beátam spem et advéntum Salvatóris nostri Iesu Christi.</p>
<p class="bi-r ">Szabadíts meg, kérünk, Urunk, minden gonosztól; adj kegyesen békét napjainkban, hogy irgalmadból mindenkor bűn és baj nélkül éljünk, míg reménykedve várjuk az örök boldogságot és Üdvözítőnknek, Jézus Krisztusnak dicsőséges eljöttét.</p>
<p class="bi-l resp" lang="la">Quia tuum est regnum, et potéstas, et glória in sǽcula.</p>
<p class="bi-r resp">Mert tiéd az ország, a hatalom és a dicsőség mindörökkön örökké. Ámen.</p>
<h3 class="bi-l">Ritus pacis</h3>
<h3 class="bi-r">Békeima</h3>
<p class="bi-l " lang="la">Dómine Iesu Christe, qui dixísti Apóstolis tuis: Pacem relínquo vobis, pacem meam do vobis: ne respícias peccáta nostra, sed fidem Ecclésiæ tuæ; eámque secúndum voluntátem tuam pacificáre et coadunáre dignéris. Qui vivis et regnas in sǽcula sæculórum.</p>
<p class="bi-r ">Urunk, Jézus Krisztus, te azt mondottad apostolaidnak: „Békességet hagyok rátok, az én békémet adom nektek.” Ne vétkeinket nézzed, hanem Egyházad hitét, őrizd meg szándékod szerint békében, és add meg teljes egységét. Aki élsz és uralkodol mindörökkön örökké.</p>
<p class="bi-l resp" lang="la">Amen.</p>
<p class="bi-r resp">Ámen.</p>
<p class="bi-l " lang="la">Pax Dómini sit semper vobíscum.</p>
<p class="bi-r ">Az Úr békéje legyen veletek mindenkor.</p>
<p class="bi-l resp" lang="la">Et cum spíritu tuo.</p>
<p class="bi-r resp">És a te lelkeddel.</p>
<p class="bi-l " lang="la">Offérte vobis pacem.</p>
<p class="bi-r ">Engesztelődjetek ki szívből egymással!</p>
<!--sil:fraction-->
<h3 class="bi-l">Agnus Dei</h3>
<h3 class="bi-r">Agnus Dei</h3>
<p class="bi-l resp" lang="la">Agnus Dei, qui tollis peccáta mundi: miserére nobis.<br>Agnus Dei, qui tollis peccáta mundi: miserére nobis.<br>Agnus Dei, qui tollis peccáta mundi: dona nobis pacem.</p>
<p class="bi-r resp">Isten Báránya, te elveszed a világ bűneit: irgalmazz nekünk.<br>Isten Báránya, te elveszed a világ bűneit: irgalmazz nekünk.<br>Isten Báránya, te elveszed a világ bűneit: adj nekünk békét.</p>
<!--sil:before_comm-->
<h3 class="bi-l">Communio</h3>
<h3 class="bi-r">Áldozás</h3>
<p class="bi-l " lang="la">Ecce Agnus Dei, ecce qui tollit peccáta mundi. Beáti qui ad cenam Agni vocáti sunt.</p>
<p class="bi-r ">Íme, az Isten Báránya, íme, aki elveszi a világ bűneit. Boldogok, akik meghívást kaptak a Bárány lakomájára.</p>
<p class="bi-l resp" lang="la">Dómine, non sum dignus, ut intres sub téctum meum,<br>sed tantum dic verbo, et sanábitur ánima mea.</p>
<p class="bi-r resp">Uram, nem vagyok méltó, hogy hajlékomba jöjj,<br>hanem csak egy szóval mondd, és meggyógyul az én lelkem.</p>
<!--sil:comm_priest-->
<p class="bi-l " lang="la">Corpus Christi.</p>
<p class="bi-r ">Krisztus teste.</p>
<p class="bi-l resp" lang="la">Amen.</p>
<p class="bi-r resp">Ámen.</p>
'''

