# Builds app/data from src/, then publishes only the app/ folder to GitHub Pages; everything else in the repo stays unpublished.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'tools/**', 'tests/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Browser test of the app (day selection, automatic update without loops).
  # If it fails, nothing is deployed and the site keeps the previous version.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node tests/app-test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Rebuild the Mass database from src/ so the site never lags behind the sources
      - run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
