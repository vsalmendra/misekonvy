# Builds app/data from src/, then publishes only the app/ folder to GitHub Pages; everything else in the repo stays unpublished.
name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'tools/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # No tests here (they cost Actions minutes): tests/app-test.mjs runs locally before every push.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Rebuild the Mass database from src/ so the site never lags behind the sources
      - run: python3 tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
